      var INK = "#16191D";

      // ── voice map (assets/voice/05.wav · 5.381s, then 1.2s de quietud) ───

      // ── Scene 1 (0.0–1.30) · el travelling dibuja la franja y las tres ───

      for (var i = 0; i < 3; i++) {

        tl.fromTo(

          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.40, ease: "power2.out" },
          at + 0.18

        tl.fromTo(
          col.querySelector(".qv05-head-rule"),

          { scaleX: 1, duration: 0.46, ease: "power2.out" },
          at + 0.34

      // ── Scene 2a (1.10–2.10) · "qué puede volar" — las dos que sí vuelan
      //    pasan a plena tinta

        tl.to(
          el(LABELS[k]),
          { color: INK, duration: 0.34, ease: "power1.out" },
          INK_BEAT[k]

        tl.to(
          el(COLS[k]),
          { borderColor: "rgba(22, 25, 29, 0.20)", duration: 0.34, ease: "power1.out" },
