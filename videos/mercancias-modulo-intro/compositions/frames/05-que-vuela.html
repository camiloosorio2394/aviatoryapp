      <div id="qv05-strip"></div>

      <div class="qv05-col" id="qv05-c1" style="left: 80px">
        <div class="qv05-flag" id="qv05-f1"></div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-que-vuela"]');
      var el = function (s) { return root.querySelector(s); };
      var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var INK = "#16191D";

      // ── voice map (escena 6.163s) ─────────────────────────────────────────
      // "Vas a saber"        0.239–0.979  → las tres columnas suben en "saber" (0.56)
      // "qué puede volar,"   0.979–2.339  → PERMITIDO (1.18) y CON CONDICIONES (1.46) a plena tinta
      // "qué no,"            2.339–3.460  → PROHIBIDO se atenúa (2.34) y la cruza la hairline (2.52)
      // "y en qué aeronave." 3.460–…      → la banda CAO entra en "aeronave." (4.079)
      //  ~5.05–6.163                      → quietud

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.60) · el travelling dibuja la franja; las tres
      //    estaciones suben en "saber", escalonadas 0.14s, y cada una enciende
      //    su franja de semáforo al llegar
      tl.fromTo(
        el("#qv05-strip"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.90, ease: "power2.out" },
        0.08
      );

      var COLS = ["#qv05-c1", "#qv05-c2", "#qv05-c3"];
      var FLAGS = ["#qv05-f1", "#qv05-f2", "#qv05-f3"];
      var LABELS = ["#qv05-lb1", "#qv05-lb2", "#qv05-lb3"];
      var EDGES = ["#qv05-e1", "#qv05-e2", "#qv05-e3"];

      for (var i = 0; i < 3; i++) {
        var at = 0.46 + i * 0.14;
        var col = el(COLS[i]);

        tl.fromTo(
          col,
          { opacity: 0, y: 44 },
          { opacity: 1, y: 0, duration: 0.54, ease: "power2.out" },
          at
        );
        tl.fromTo(
          el(FLAGS[i]),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.48, ease: "power2.out" },
          at + 0.14
        );
        tl.fromTo(
          el(LABELS[i]),
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.40, ease: "power2.out" },
          at + 0.18
        );
        tl.fromTo(
          col.querySelector(".qv05-head-rule"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.46, ease: "power2.out" },
          at + 0.32
        );
      }

      // ── Scene 2a (1.18–1.80) · "puede volar" — las dos que sí vuelan
      //    pasan a plena tinta
      var INK_BEAT = [1.18, 1.46];
      for (var k = 0; k < 2; k++) {
        tl.to(
          el(LABELS[k]),
          { color: INK, duration: 0.34, ease: "power1.out" },
          INK_BEAT[k]
        );
        tl.to(
          el(EDGES[k]),
          { borderColor: "rgba(22, 25, 29, 0.20)", duration: 0.34, ease: "power1.out" },
          INK_BEAT[k]
        );
      }

      // ── Scene 2b (2.30–3.10) · "qué no" — la tercera se cierra: 35% y una
      //    hairline la cruza (el gesto de la escena)
      tl.to(el("#qv05-lb3"), { color: INK, duration: 0.22, ease: "power1.out" }, 2.30);
      tl.to(el("#qv05-c3"), { opacity: 0.35, duration: 0.58, ease: "power2.inOut" }, 2.34);
      tl.fromTo(
        el("#qv05-strike"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.58, ease: "power2.inOut" },
        2.52
      );

      // ── Scene 3 (4.02–5.00) · "aeronave." — la banda mostaza sólida barre
      //    el pie y el texto crema aparece cuando el relleno ya lo cubre
      tl.fromTo(
        el("#qv05-band-bg"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.66, ease: "power2.inOut" },
        4.02
      );
      var parts = all(".qv05-band-part");
      tl.fromTo(parts[0], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 4.32);
      tl.fromTo(parts[1], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" }, 4.54);

      // quietud — el cuadro se sostiene hasta el final (6.163), sin salida
      tl.to({ hold: 0 }, { hold: 1, duration: 0.001 }, 6.162);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-que-vuela"] = tl;
    })();
