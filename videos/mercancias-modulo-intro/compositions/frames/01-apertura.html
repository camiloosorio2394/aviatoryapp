    /* The frame root is styled by #root (never a class on the composition-id
       element) and carries NO background — the full-bleed navy ground is its own
       full-duration class="clip" layer below. */
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      container-type: size;
      /* frame.md atoms */
      --mp01-navy: #14202e;
      --mp01-cream: #fbfaf8;
      /* el acento del módulo es mostaza #7A5C12; sobre navy queda en 2.6:1, así que
         se usa el token brillante del brief — oklch(0.78 0.135 86) = #DEB042, misma
         familia mostaza a mayor luminosidad. ONE accent moment. */
      --mp01-accent: #deb042;
    }

    /* ── background: campo navy + retícula hairline, 3 capas de profundidad ──── */
    .mp01-bg {
      position: absolute;
      inset: 0;
      background-color: var(--mp01-navy);
    }
    .mp01-depth {
      position: absolute;
      inset: 0;

        repeating-linear-gradient(to right, rgba(251, 250, 248, 0.085) 0 1px, rgba(251, 250, 248, 0) 1px 300px),
        repeating-linear-gradient(to bottom, rgba(251, 250, 248, 0.085) 0 1px, rgba(251, 250, 248, 0) 1px 300px);
    }
    .mp01-pool {
      background-image:
        radial-gradient(78% 62% at 50% 44%, rgba(251, 250, 248, 0.055) 0%, rgba(251, 250, 248, 0) 68%),
        radial-gradient(122% 100% at 50% 50%, rgba(9, 14, 21, 0) 42%, rgba(9, 14, 21, 0.62) 100%);
    }

    /* ── stage: todo el contenido por encima de y=900 (banda de subtítulos) ──── */
    .mp01-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;

    /* rótulo mono (supporting) */
    .mp01-kicker {
      display: flex;
      align-items: center;
      gap: 0.95em;
      font-family: "JetBrains Mono", monospace;

    .mp01-kw {
      display: inline-block;
    }

    /* MERCANCÍAS PELIGROSAS (foreground subject) + la hairline de acento.
       Dos líneas: el título es de dos palabras, así que se apilan y el acento
       subraya solo la segunda. 9.4cqw ≈ 62% del ancho en la línea más larga. */
    .mp01-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: fit-content;
      margin-top: 90px;
    }
    .mp01-line {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: fit-content;
    }
    /* máscara de entrada: las letras suben desde debajo de la línea base.
       El padding/margen superior deja aire para el halo del desenfoque. */
    .mp01-mask {
      overflow: hidden;
      padding-top: 64px;
      margin-top: -64px;
    }
    .mp01-word {
      display: block;
      text-align: center;
      font-family: "Archivo", sans-serif;
      font-weight: 400;
      font-size: 9.4cqw;
      line-height: 0.98;
      letter-spacing: -0.018em;
      color: var(--mp01-cream);
      white-space: nowrap;
    }
    .mp01-ltr {
      --dof: 0px;
      display: inline-block;
      filter: blur(var(--dof));
      will-change: filter, transform, opacity;
    }
    .mp01-rule {
      height: 3px;
      margin-top: 46px;
      background: var(--mp01-accent);
      transform-origin: left center;
    }
  </style>

  <div id="root" data-composition-id="01-apertura" data-start="0" data-duration="5.667" data-width="1920" data-height="1080">
    <!-- fondo a sangre: capa propia con class="clip", duración completa -->
    <div id="mp01-fondo" class="clip mp01-bg" data-start="0" data-duration="5.667" data-track-index="0">
      <div class="mp01-depth mp01-pool"></div>
      <div class="mp01-depth mp01-grid-coarse"></div>
      <div class="mp01-depth mp01-grid-fine"></div>

    <div id="mp01-escena" class="clip mp01-stage" data-start="0" data-duration="5.667" data-track-index="1">
      <div class="mp01-kicker">
        <span class="mp01-tick"></span>
        <span class="mp01-kw">INGRESO</span>
        <span class="mp01-kw">A</span>

  <script>
    (function () {
      var ID = "01-apertura";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!root) return;
      var q = function (s) {
        return root.querySelector(s);
      };
      var qa = function (s) {
        return Array.prototype.slice.call(root.querySelectorAll(s));
      };

      var D = 5.667;
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.0s) ────────────────────────────────────────────────
      // "Bienvenido al módulo…" — el campo navy ya es opaco en t=0 (color de la
      // capa .clip). Las tres capas de profundidad se asientan: retícula gruesa,
      // retícula fina, pozo de luz.
      tl.fromTo(q(".mp01-pool"), { opacity: 0.35 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0);
      tl.fromTo(q(".mp01-grid-coarse"), { opacity: 0 }, { opacity: 1, duration: 1.1, ease: "power2.out" }, 0);
      tl.fromTo(q(".mp01-grid-fine"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.06);

      // rótulo mono — revelado por palabra en el tercio superior
      tl.fromTo(q(".mp01-tick"), { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 0.12);
      tl.fromTo(
        qa(".mp01-kw"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power3.out", stagger: 0.085 },
        0.18,
      );

      // ── Scene 2 (1.52–3.60s) ──────────────────────────────────────────────
      // El título entra desde abajo tras la máscara y se resuelve desde el
      // desenfoque (depth-of-field-blur: se tensa la variable --dof, que lee
      // filter: blur()). Escalonado por línea — MERCANCÍAS entra sobre la palabra
      // "Mercancías" (VO 1.599s) y PELIGROSAS sobre "peligrosas" (VO 2.419s).
      tl.fromTo(
        qa(".mp01-l1"),
        { yPercent: 100, opacity: 0, "--dof": "22px" },
        {
          yPercent: 0,
          opacity: 1,
          "--dof": "0px",
          duration: 0.9,
          ease: "power3.out",
          stagger: 0.04,
        },
        1.52,
      );
      tl.fromTo(
        qa(".mp01-l2"),
        { yPercent: 100, opacity: 0, "--dof": "22px" },
        {
          yPercent: 0,
          opacity: 1,
          "--dof": "0px",
          duration: 0.9,
          ease: "power3.out",
          stagger: 0.04,
        },
        2.34,
      );

      // ── Scene 3 (3.7s–fin) ────────────────────────────────────────────────
      // La hairline de acento se dibuja bajo PELIGROSAS de izquierda a derecha y
      // queda, cerrando al terminar "Aviatory." (VO 3.399–4.179s). Después, quietud:
      // lectura sostenida, sin deriva de cámara y sin salida (la transición de
      // raíz es la salida).
      tl.fromTo(q(".mp01-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 3.7);

      // ancla de duración completa
      tl.to({}, { duration: D }, 0);

      window.__timelines[ID] = tl;
    })();
  </script>
