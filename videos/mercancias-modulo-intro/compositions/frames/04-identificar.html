      var edges = qa(".f04-edge");

      var T0 = 0.26;

         «sus etiquetas» (w7 3.339) · «y» (w8 4.199) · «sus grupos de embalaje» (w10 4.619)

        q("#f04-rotulo-a"),
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.out" },
        3.26

      tl.fromTo(

        { scale: 1.012, duration: DUR - VOZ, ease: "none" },
