    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {

    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;

  .caption-pill {
    max-width: 78%;

    font-weight: 500;

    line-height: 1.24;
    letter-spacing: -0.02em;
  }

  .caption-word {

    border-bottom: 3px solid var(--cap-accent, #cc785c);
  }
  /* already spoken — solid warm ink, underline cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #141413);
    border-bottom: 3px solid transparent;
  }

  .caption-word.cap-brand {

    border-bottom: 3px solid var(--cap-accent, #cc785c);
  }

  .caption-word.cap-num {
