      var world = el("#lq05-world");
      var mark = el("#lq05-mark");

      var PAN_Y = 211.2;          // Q line centred on screen at scale 2.2
      var PAN_S = 2.2;
      var STOP = [1012.35, 1012.35, 811.0, 495.6, 225.3, -45.1, -405.5, -1012.35];

      // ── voice map (assets/voice/05.wav regenerada · escena 10.143s) ─────────
      // "Vas a leer la línea cu,"  0.239–1.860   → the line lands, camera dives in on "línea" (1.100)
      // "pieza por pieza."         2.419–3.580   → the eight-field walk, BEAT[3] on "pieza" (2.419)
      //  (silence 3.580–4.500)                   → the last two fields breathe
      // "Y los ítems,"             4.500–5.580   → pan down onto the column, leaving on "los" (4.639)
      // "de la A a la G,"          6.039–7.519   → A) … G) enumerate, G) lands after "G," (7.399)
      // "uno por uno."             8.059–9.000   → pull back on "uno", 3/4 on "uno." (8.599)
      //  9.08–10.143                             → absolute stillness

      // Arrival beat per field — 0.44s apart (was 0.346), so every field now
      // holds ~0.18s dead still after the pan lands before the next one starts.
      var BEAT = [1.10, 1.54, 1.98, 2.42, 2.86, 3.30, 3.74, 4.18];
      var PAN_DUR = 0.26;         // travel time between two adjacent fields
      var WALK_END = 4.66;        // the camera leaves the Q line here, on "Y los" (4.639)

      // Travelling read head: [x offset from the line start, width in px]

        [0, 163.84],
        [204.8, 204.8],
        [450.56, 81.92],
        [573.44, 122.88],
        [737.28, 40.96],
        [819.2, 122.88],
        [983.04, 122.88],
        [1146.88, 573.44]
      ];

      var ACCENT = "#5DB8A6";
      var PAPER = "#FBFAF8";

      gsap.set(world, CAM_S1);

      // ── Scene 1 (0.0–1.10) · the real Q line lands full width on navy ────

        all(".lq05-ch"),
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power2.out", stagger: 0.024 },
        0.02

        el("#lq05-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power2.out" },
        0.41

      // ── Scene 2 (1.10–4.66) · the camera walks the eight fields ──────────

        BEAT[0] - 0.46
      );
      // STOP[0] === STOP[1]: fields 1 and 2 share the opening stop, so the
      // walk proper starts at station 3 (index 2).
      for (var k = 2; k < 8; k++) {
        tl.to(
          world,
          { x: STOP[k], y: PAN_Y, scale: PAN_S, duration: PAN_DUR, ease: "power2.inOut" },
          BEAT[k] - PAN_DUR
        );
      }

      tl.fromTo(mark, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, BEAT[0] - 0.2);
      for (var m = 1; m < 8; m++) {
        tl.to(
          mark,
          { x: MARK[m][0], width: MARK[m][1], duration: PAN_DUR, ease: "power2.inOut" },
          BEAT[m] - PAN_DUR
        );
      }
      tl.to(mark, { opacity: 0, duration: 0.18, ease: "power1.in" }, WALK_END - 0.04);

      for (var f = 0; f < 8; f++) {

        tl.to(field, { color: PAPER, duration: 0.20, ease: "power1.inOut" }, out);

      tl.to(
