    (function () {
      var scope = document.querySelector('[data-composition-id="04-tres-tipos"]');
      if (!scope) return;

      var q = function (sel) {
        return scope.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(scope.querySelectorAll(sel));
      };

      /* Tiempos reales de audio_meta.json → voices[] con frame: 4 (voz regenerada)
         voz = 6.87s ("Vas a diferenciar un NOTAM ene, de un NOTAM erre, y de un NOTAM ce.")
         + 1.0s de remanso = 7.87s */
      var DUR = 7.87;

      /* palabras ancla: «Vas» w0 · «diferenciar» w2 · fin de «ce.» w14 */
      var VAS = 0.219;
      var DIFERENCIAR = 0.539;
      var CE_FIN = 6.579;

      /* cada ficha aparece con su letra dicha: «ene,» w5 · «erre,» w9 · «ce.» w14 */
      var SIGLA = [2.299, 4.199, 6.299];

      /* cierre de la estructura al terminar «ce.»; QUIETUD = fin del último reveal */
      var CIERRE = CE_FIN;
      var PROGRESO = CIERRE + 0.14;
      var QUIETUD = PROGRESO + 0.44;

      /* la ficha arranca un pelo antes para aterrizar sobre la sílaba */
      var LEAD = 0.18;

      var fichas = qa(".f04-ficha");
      var edges = qa(".f04-edge");
      var empties = qa(".f04-empty");
      var minis = qa(".f04-rule-mini");
      var verbos = qa(".f04-verbo");

      var tl = gsap.timeline({ paused: true });

      /* macro camera: un push lentísimo que decelera hasta pararse con el último reveal */
      tl.fromTo(q(".f04-camera"), { scale: 1 }, { scale: 1.014, duration: QUIETUD, ease: "power1.out" }, 0);

      /* Escena 1 (0.0–2.1s) — «Vas a diferenciar un NOTAM…»: papel, hairline superior
         y el framing tríptico con sus tres casillas todavía vacías */
      tl.fromTo(q(".f04-rule-top"), { scaleX: 0 }, { scaleX: 1, duration: 0.72, ease: "power2.out" }, 0.02);
      tl.fromTo(q(".f04-kicker"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" }, VAS - 0.1);
      tl.fromTo(empties, { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.16, ease: "power1.out" }, DIFERENCIAR - 0.2);

      /* Escenas 1–3 — una ficha por letra pronunciada: N «ene,» (2.30s) · R «erre,» (4.20s) · C «ce.» (6.30s)
         (grid-card-assemble: cada ficha entra desde abajo, recorrido corto, directo a su casilla) */
      for (var i = 0; i < SIGLA.length; i++) {
        var s = SIGLA[i] - LEAD;
        tl.fromTo(
          fichas[i],
          { y: 58, opacity: 0, scale: 0.986 },
          { y: 0, opacity: 1, scale: 1, duration: 0.58, ease: "power3.out" },
          s
        );
        tl.fromTo(edges[i], { opacity: 0.85 }, { opacity: 0, duration: 0.72, ease: "power2.out" }, s + 0.14);
        tl.fromTo(minis[i], { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power2.out" }, s + 0.22);
        tl.fromTo(
          verbos[i],
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.52, ease: "power2.out" },
          s + 0.3
        );
      }

      /* Escena 4 — las tres asentadas, pesos iguales; la estructura cierra
         al terminar «ce.» (6.579s), con la ficha C ya asentada */
      tl.fromTo(q(".f04-rule-bottom"), { scaleX: 0 }, { scaleX: 1, duration: 0.56, ease: "power2.out" }, CIERRE);
      tl.fromTo(q(".f04-progress"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, PROGRESO);

      tl.fromTo(

        { scale: 1.014, duration: DUR - QUIETUD, ease: "none" },
        QUIETUD
