  <script>
    (function () {
      var ROOT = document.querySelector('[data-composition-id="02-codigo-ilegible"]');
      if (!ROOT) return;

      var world = ROOT.querySelector('.f02cil-world');
      var stage = ROOT.querySelector('.f02cil-stage');
      var label = ROOT.querySelector('.f02cil-label');
      var rule = ROOT.querySelector('.f02cil-rule');
      var code = ROOT.querySelector('.f02cil-code');
      var inks = ROOT.querySelectorAll('.f02cil-ink');

      /* ────────────────────────────────────────────────────────────────
         VIRTUAL CAMERA (viewport-change, single-wrapper form)
         The whole world is authored at its final 1x layout; the camera is
         the ONLY thing that moves, and it only ever moves OUTWARD. One
         composite transform on one .world wrapper => T = -offset * S, with
         the offset measured from the world centre (transform-origin 50% 50%).

         Focal detail = the centre of `QMRLC` on the Q line, derived from the
         authored mono grid: text box left 365 + 1px border + 44 = 410px, char advance
         40px * 0.6 = 24px, `QMRLC` starts at column 8 (centre col 10.5)
         -> x = 410 + 10.5*24 = 662. First line top 160 + 1 + 48 = 209px,
         line box 64px, Q line is row 1 -> y = 209 + 64 + 32 = 305.
         ──────────────────────────────────────────────────────────────── */
      var WORLD_CX = 960, WORLD_CY = 540;
      var DETAIL_X = 662, DETAIL_Y = 305;

      var S0 = 10;                                  /* macro open: 8 chars across the frame */
      var S1 = 9.15;                                /* end of the pre-reveal ride (~9% travel) */

      var FOX0 = DETAIL_X - WORLD_CX;               /* -298 */
      var FOY0 = DETAIL_Y - WORLD_CY;               /* -235 */
      var FOX1 = FOX0 + 30;                         /* the camera rides right along the Q line */
      var FOY1 = FOY0 + 6;

      /* T = -offset * S, solved once per camera pose. The poses are real GSAP
         transform values, not an onUpdate writer: a frame renderer seeks with
         callbacks suppressed, so a callback-driven camera would never move. */
      var OPEN = { x: -FOX0 * S0, y: -FOY0 * S0, scale: S0 };
      var RIDE = { x: -FOX1 * S1, y: -FOY1 * S1, scale: S1 };

      /* smoothstep — Scene 1 is a slow ride along the line, never a dead hold */
      function driftEase(p) { return p * p * (3 - 2 * p); }

      /* Scene 2's single outward move. The eased value is remapped so that the
         SCALE recedes exponentially (constant perceived zoom rate) under a
         power3.out profile — expo-class deceleration into a full stop. One
         ease, shared by scale + translate, so the detail drifts from frame
         centre to its home slot as the wide takes over. The cubic profile keeps
         the opening rate of the verified 9.33s cut and spends the extra runway
         of the 11.945s cut on a longer, softer landing. */
      function pullEase(p) {
        var q = 1 - p;
        var g = 1 - q * q * q;
        return (S1 - Math.pow(S1, 1 - g)) / (S1 - 1);
      }

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.959s) — macro on QMRLC, the camera already easing outward.
         Ends on the word «sale,» (voice w5 @1.959) — audio_meta.json, frame 2. */

        { x: OPEN.x, y: OPEN.y, scale: OPEN.scale },
        { x: RIDE.x, y: RIDE.y, scale: RIDE.scale, duration: 1.959, ease: driftEase },

      /* Scene 2 (1.959-6.459s) — THE move: one decelerating zoom-out to the wide.
         It starts under «...vuelo sale» (w5 1.959) so the camera is still running
         while the voice says «decide si tu vuelo sale», uncovers the Q line whole
         (~scale 1.6 @3.8s) and then the full block, and eases to a dead stop on
         the last word of the sentence, «aterrizar.» (w13 end @6.459). The frame is
         LOCKED from 6.459s on; no camera tween exists after it. */
      tl.fromTo(world,
        { x: RIDE.x, y: RIDE.y, scale: RIDE.scale },
        { x: 0, y: 0, scale: 1, duration: 4.5, ease: pullEase, immediateRender: false },
        1.959);

      /* Scene 1 — blur-to-sharp macro resolve, chorded to the early pull */
      tl.fromTo(stage, { '--dof': '11px' }, {
        '--dof': '0px',
        duration: 2.64,
        ease: 'power2.out'
      }, 0);

      /* Scene 3 (6.459-9.199s) — the frame is locked; the document presents itself.
         Chrome label + the one coral rule draw on over «Y está escrito en un
         código» (w14 @7.059, w16 @7.460). Camera untouched. */
      tl.fromTo(label, { opacity: 0, y: 12 }, {
        opacity: 1,
        y: 0,
        duration: 0.62,
        ease: 'power2.out'
      }, 7.059);

      tl.fromTo(rule, { scaleX: 0 }, {
        scaleX: 1,
        duration: 0.78,
        ease: 'power2.out'
      }, 7.46);

      /* Scene 4 (9.199-10.449s) — on «nadie te enseñó a leer» (w21 @9.199 ... w25
         end @10.659) the block falls to half ink. The three fragments carry their
         own colour, so they do not inherit the dim: QMRLC, BTN, CLSD stay at full

      tl.fromTo(code, { color: 'rgba(251,250,248,1)' }, {
        color: 'rgba(251,250,248,0.44)',

        duration: 1.0,
        ease: 'power2.out'
      }, 9.259);
