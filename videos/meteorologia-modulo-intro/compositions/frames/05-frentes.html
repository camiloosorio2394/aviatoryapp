  </style>

  <div id="root" data-composition-id="05-frentes" data-start="0" data-duration="8.45" data-width="1920" data-height="1080">
    <div id="mt05-fondo-navy" class="clip mt05-ground" data-start="0" data-duration="8.45" data-track-index="0"></div>

    <div id="mt05-camara" class="clip mt05-stage" data-start="0" data-duration="8.45" data-track-index="1">
      <!-- el mundo se sale del contenedor a propósito: la cámara pasea a 1.55 -->
      <div class="mt05-world" data-layout-allow-overflow>
        <div class="mt05-kicker">Parte 3 · Masas de aire, frentes y tormentas</div>
        <div class="mt05-sub">La firma de un frente cálido</div>

        <div class="mt05-axis"></div>

        <div class="mt05-station mt05-s1">
          <span class="mt05-tick"></span>

          <div class="mt05-st-read">la presión sigue cayendo</div>

        <div class="mt05-type mt05-t3">
          <span class="mt05-ty-name">Estacionario</span><span class="mt05-ty-ref">las dos masas se empujan con fuerzas parecidas</span>
        </div>
        <div class="mt05-type mt05-t4">
          <span class="mt05-ty-name">Ocluido</span><span class="mt05-ty-ref">un frente frío rápido alcanza a uno cálido lento</span>
        </div>

        <div class="mt05-progress">3/4</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "05-frentes";
      var ROOT = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!ROOT) return;
      var q = function (s) {
        return ROOT.querySelector(s);
      };
      var qa = function (s) {
        return Array.prototype.slice.call(ROOT.querySelectorAll(s));
      };

      /* ────────────────────────────────────────────────────────────────
         CÁMARA VIRTUAL, la misma forma que en el frame 2: un solo
         envoltorio, transform-origin 50% 50%, T = -offset * S.

         El mundo está maquetado a 1x con las tres estaciones ya cabiendo en
         los 1920 (620px cada una), así que el plano general de la escena 4 es
         simplemente scale 1. El paneo de la escena 2 es un acercamiento a
         1.55 que recorre las tres: a esa escala una estación ocupa 961px,
         media pantalla, y las vecinas se salen por los bordes.

         Centros a 1x: estación 1 en x=370, la 2 en 960, la 3 en 1550. Centro
         vertical de la tira, y=360. Centro del bloque de tipos, y=645.
         ──────────────────────────────────────────────────────────────── */
      var CX = 960,
        CY = 540;
      var S = 1.55;
      var pose = function (x, y, s) {
        return { x: -(x - CX) * s, y: -(y - CY) * s, scale: s };
      };

      var P1 = pose(370, 360, S); /* estación 1 centrada */
      var P3 = pose(1550, 360, S); /* estación 3 centrada */
      var PTYPES = pose(960, 645, S); /* los cuatro tipos, mismo acercamiento */
      var PWIDE = { x: 0, y: 0, scale: 1 }; /* plano general: todo en cuadro */

      var D = 8.45;
      var world = q(".mt05-world");
      var tl = gsap.timeline({ paused: true });

      /* Cues estimados sobre la ventana de voz de 7.250s. Re-cuear con
         audio_engine_meta.json cuando exista la locución. */

      /* ── Escena 1 (0.0–1.0s) ──────────────────────────────────────────────
         Vuelve la superficie navy. La cámara abre ya en la estación 1 y el eje
         de la tira se dibuja de izquierda a derecha. */
      tl.set(world, P1);
      tl.fromTo(q(".mt05-kicker"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo(q(".mt05-sub"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.16);
      tl.fromTo(q(".mt05-axis"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.1);

      /* ── Escena 2 (1.0–3.6s) ──────────────────────────────────────────────
         UN solo paneo continuo de la estación 1 a la 3. No se detiene. Cada
         estación pasa a acento y suelta su lectura del barómetro justo cuando
         cruza el centro del cuadro: 1.0s, 2.2s y 3.4s. */
      tl.fromTo(world, P1, { x: P3.x, y: P3.y, scale: S, duration: 2.6, ease: "none", immediateRender: false }, 1.0);

      var CRUCE = [1.0, 2.2, 3.4];
      var CHROME = "rgba(251,250,248,0.46)";
      ["1", "2", "3"].forEach(function (n, i) {
        var st = q(".mt05-s" + n);
        var name = st.querySelector(".mt05-st-name");
        tl.to(name, { color: "#49939c", duration: 0.34, ease: "power2.out" }, CRUCE[i]);
        /* el acento viaja con la cámara: al cruzar la siguiente, esta vuelve a
           ser chrome. Solo la última se queda marcada, que es donde aterriza el
           paneo, y así el frame conserva UN solo momento de acento. */
        if (i < 2) {
          tl.to(name, { color: CHROME, duration: 0.45, ease: "power2.inOut" }, CRUCE[i + 1] - 0.12);
        }
        tl.fromTo(
          st.querySelector(".mt05-st-read"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
          CRUCE[i] + 0.08,
        );
      });

      /* ── Escena 3 (3.6–5.2s) ──────────────────────────────────────────────
         Paneo corto hacia abajo, al mismo acercamiento. Los cuatro tipos
         entran escalonados. Sin detenerse en ninguno: solo se enumeran. */
      tl.to(world, { x: PTYPES.x, y: PTYPES.y, duration: 1.0, ease: "power2.inOut" }, 3.6);
      tl.fromTo(
        qa(".mt05-type"),
        { opacity: 0, x: -20 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out", stagger: 0.17 },
        3.8,
      );

      /* ── Escena 4 (5.2–7.2s) ──────────────────────────────────────────────
         La cámara se aleja lo justo para que la tira y los cuatro tipos queden
         juntos en cuadro. Después, quietud: no hay tween de cámara tras 6.3s. */
      tl.to(world, { x: PWIDE.x, y: PWIDE.y, scale: PWIDE.scale, duration: 1.1, ease: "power2.inOut" }, 5.2);
      tl.to(q(".mt05-progress"), { opacity: 1, duration: 0.5, ease: "power2.out" }, 6.3);

      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
