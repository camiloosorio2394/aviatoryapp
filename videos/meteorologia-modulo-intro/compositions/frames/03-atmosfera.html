<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "Archivo";

    .mt03-hair {

  <div id="root" data-composition-id="03-atmosfera" data-start="0" data-duration="8.2" data-width="1920" data-height="1080">

    <div id="mt03-escena" class="clip" data-start="0" data-duration="8.2" data-track-index="1" style="position:absolute; inset:0;">
      <div class="mt03-hair"></div>
      <div class="mt03-kicker">Parte 1 · La atmósfera y el aire en movimiento</div>

      <div class="mt03-word">Presión</div>
      <div class="mt03-divider"></div>

      <div class="mt03-list">
        <div class="mt03-li">01  La atmósfera en la que vuelas</div>
        <div class="mt03-li">02  La presión y lo que le hace a tu altímetro</div>
        <div class="mt03-li">03  Por qué se mueve el aire</div>
        <div class="mt03-li">04  El viento cerca del suelo</div>
        <div class="mt03-li">05  Cizalladura a bajo nivel</div>
      </div>

      <div class="mt03-progress">1/4</div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "03-atmosfera";
      var ROOT = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!ROOT) return;
      var q = function (s) {
        return ROOT.querySelector(s);
      };
      var qa = function (s) {
        return Array.prototype.slice.call(ROOT.querySelectorAll(s));
      };

      var D = 8.2;
      var tl = gsap.timeline({ paused: true });

      /* Cues estimados sobre la ventana de voz de 7.000s. Re-cuear con
         audio_engine_meta.json cuando exista la locución. */

      /* ── Escena 1 (0.0–1.4s) ──────────────────────────────────────────────
         Corte a papel. «Presión» sola, centrada: se maqueta ya en su sitio
         final de la izquierda y se trae al centro con un transform, que es el
         único que se deshace en la escena 2. Así no hay reflow. */
      var CENTRO = (1920 - 572) / 2 - 140; /* desplazamiento para centrarla */
      tl.set(q(".mt03-word"), { x: CENTRO });
      tl.fromTo(q(".mt03-hair"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0);
      tl.fromTo(q(".mt03-kicker"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo(q(".mt03-word"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.72, ease: "power3.out" }, 0.18);

      /* ── Escena 2 (1.4–3.4s) ──────────────────────────────────────────────
         La palabra se va a la izquierda (un solo gesto), la hairline de acento
         se dibuja hacia abajo y entran las dos consecuencias, una por cue. */
      tl.to(q(".mt03-word"), { x: 0, duration: 0.9, ease: "power2.inOut" }, 1.4);
      tl.fromTo(q(".mt03-divider"), { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 1.85);
      tl.fromTo(q(".mt03-conseq-1"), { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.56, ease: "power3.out" }, 2.05);
      tl.fromTo(q(".mt03-conseq-2"), { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.56, ease: "power3.out" }, 2.62);

      /* ── Escena 3 (3.4–7.0s) ──────────────────────────────────────────────
         Entran escalonadas las cinco lecciones reales de la parte 1 y la marca
         de progreso. Después, quietud: nada se mueve hasta el corte. */
      tl.fromTo(
        qa(".mt03-li"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", stagger: 0.13 },
        3.5,
      );
      tl.fromTo(q(".mt03-progress"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.5);

      tl.to({}, { duration: D }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
