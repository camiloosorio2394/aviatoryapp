<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FBFAF8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      ────────────────────────────────────────────────────────────────────────
      Las duraciones de abajo son las REALES de la locución, no estimadas:
      cada plano dura lo que dura su voz (audio_engine_meta.json) más su cola
      de silencio, 1,2 s salvo el plano 7, el del giro, que lleva 1,6.

      Los planos 1 y 6 llevan 0,5 s de más porque de ellos sale un fundido
      cruzado: ese solapamiento ES el fundido y no suma al total.

      Suma: 48,117 s de voz + 10,0 s de silencio = 58,117 s, que pasa la
      puerta de 58,5 del brief y deja 1,9 s contra el tope de un minuto.
      ────────────────────────────────────────────────────────────────────────
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="58.117" data-width="1920" data-height="1080">
      <div id="el-01-apertura" class="scene" data-layout-allow-overlap data-composition-id="01-apertura" data-composition-src="compositions/frames/01-apertura.html" data-start="0" data-duration="5.279" data-track-index="0"></div>
      <audio id="el-01-apertura-voice" src="assets/voice/01.wav" data-start="0" data-duration="3.579" data-track-index="10" data-volume="1"></audio>

      <div id="el-02-pronostico-ilegible" class="scene" data-layout-allow-overlap data-composition-id="02-pronostico-ilegible" data-composition-src="compositions/frames/02-pronostico-ilegible.html" data-start="4.779" data-duration="9.794" data-track-index="1"></div>
      <audio id="el-02-pronostico-ilegible-voice" src="assets/voice/02.wav" data-start="4.779" data-duration="8.594" data-track-index="10" data-volume="1"></audio>

      <div id="el-03-atmosfera" class="scene" data-composition-id="03-atmosfera" data-composition-src="compositions/frames/03-atmosfera.html" data-start="14.573" data-duration="6.869" data-track-index="0"></div>
      <audio id="el-03-atmosfera-voice" src="assets/voice/03.wav" data-start="14.573" data-duration="5.669" data-track-index="10" data-volume="1"></audio>

      <div id="el-04-agua" class="scene" data-composition-id="04-agua" data-composition-src="compositions/frames/04-agua.html" data-start="21.442" data-duration="6.816" data-track-index="1"></div>
      <audio id="el-04-agua-voice" src="assets/voice/04.wav" data-start="21.442" data-duration="5.616" data-track-index="10" data-volume="1"></audio>

      <div id="el-05-frentes" class="scene" data-composition-id="05-frentes" data-composition-src="compositions/frames/05-frentes.html" data-start="28.258" data-duration="9.141" data-track-index="0"></div>
      <audio id="el-05-frentes-voice" src="assets/voice/05.wav" data-start="28.258" data-duration="7.941" data-track-index="10" data-volume="1"></audio>

      <div id="el-06-codigo" class="scene" data-layout-allow-overlap data-composition-id="06-codigo" data-composition-src="compositions/frames/06-codigo.html" data-start="37.399" data-duration="7.787" data-track-index="1"></div>
      <audio id="el-06-codigo-voice" src="assets/voice/06.wav" data-start="37.399" data-duration="6.087" data-track-index="10" data-volume="1"></audio>

      <div id="el-07-tu-ventana" class="scene" data-layout-allow-overlap data-composition-id="07-tu-ventana" data-composition-src="compositions/frames/07-tu-ventana.html" data-start="44.686" data-duration="7.033" data-track-index="0"></div>
      <audio id="el-07-tu-ventana-voice" src="assets/voice/07.wav" data-start="44.686" data-duration="5.433" data-track-index="10" data-volume="1"></audio>

      <div id="el-08-empecemos" class="scene" data-composition-id="08-empecemos" data-composition-src="compositions/frames/08-empecemos.html" data-start="51.719" data-duration="6.398" data-track-index="1"></div>
      <audio id="el-08-empecemos-voice" src="assets/voice/08.wav" data-start="51.719" data-duration="5.198" data-track-index="10" data-volume="1"></audio>

      <!-- música: la semilla de 15s del catálogo, en bucle con crossfade hasta
           cubrir el video, a 0.12 como el de NOTAM -->
      <audio id="el-bgm" src="assets/bgm/track.loop.mp3" data-start="0" data-duration="58.117" data-track-index="11" data-volume="0.12"></audio>

      <!-- subtítulos: 34 grupos sacados de los tiempos de palabra -->
      <div id="el-captions" class="scene" data-layout-allow-overlap data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="58.117" data-track-index="2"></div>

      <!-- efectos -->
      <audio id="el-sfx-0" src="assets/sfx/impacto-suave.mp3" data-start="0" data-duration="2.758" data-track-index="20" data-volume="0.35"></audio>
      <audio id="el-sfx-1" src="assets/sfx/zumbido-grave-descendente.mp3" data-start="4.779" data-duration="5.901" data-track-index="20" data-volume="0.35"></audio>
      <audio id="el-sfx-2" src="assets/sfx/tic-seco.mp3" data-start="14.573" data-duration="6.869" data-track-index="20" data-volume="0.35"></audio>
      <audio id="el-sfx-3" src="assets/sfx/tic-escalonado.mp3" data-start="21.442" data-duration="1.334" data-track-index="20" data-volume="0.35"></audio>
      <audio id="el-sfx-4" src="assets/sfx/whoosh-corto.mp3" data-start="28.258" data-duration="1.056" data-track-index="20" data-volume="0.35"></audio>
      <audio id="el-sfx-5" src="assets/sfx/tic-por-sustituci-n.mp3" data-start="37.399" data-duration="7.287" data-track-index="20" data-volume="0.35"></audio>
      <audio id="el-sfx-6" src="assets/sfx/cascada-tics-suaves.mp3" data-start="44.686" data-duration="3.855" data-track-index="20" data-volume="0.35"></audio>
      <audio id="el-sfx-7" src="assets/sfx/impacto-final.mp3" data-start="50.119" data-duration="1.6" data-track-index="20" data-volume="0.35"></audio>
      <audio id="el-sfx-8" src="assets/sfx/impacto-grave-cierre.mp3" data-start="51.719" data-duration="5.28" data-track-index="20" data-volume="0.35"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── fundidos cruzados entre planos ───────────────────────────────────
      // Los únicos dos del video son los que entran y salen del pronóstico. El
      // resto son cortes secos. El plano que sale dura 0.5s más que su hueco:
      // ese solapamiento ES el fundido.
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-apertura", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.779);
        tl.fromTo("#el-02-pronostico-ilegible", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.779);
        tl.to("#el-06-codigo", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 44.686);
        tl.fromTo("#el-07-tu-ventana", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 44.686);
        tl.to({}, { duration: 58.117 }, 0); // ancla de duración completa: main.duration() == total de la composición
      })();
    </script>
  </body>
</html>
