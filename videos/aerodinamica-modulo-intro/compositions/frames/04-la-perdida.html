    <div id="f04-perdida-stage" class="clip" data-start="0" data-duration="7.262" data-track-index="1">
      <!-- El desbordamiento es el acercamiento de cámara del 1,2%: la capa crece

      <div class="f04-perdida-camera" data-layout-allow-overflow>

  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="04-la-perdida"]');
      if (!scope) return;

      var q = function (sel) {
        return scope.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(scope.querySelectorAll(sel));
      };

      /* Voz real (audio_meta.json, frame 4): 7.262s
         Vas 0.239 · a 0.46 · entender 0.56 · por 1.259 · qué 1.5 · un 1.74 · ala 1.939
         entra 2.259 · en 2.579 · pérdida, 2.759–3.279
         y 3.98 · por 4.139 · qué 4.319 · eso 4.579 · puede 4.94 · pasar 5.259
         a 5.619 · cualquier 5.759 · velocidad. 6.299–7.0 */
      var DUR = 7.262;
      var QUIETUD = 6.05;

      var camara = q(".f04-perdida-camera");
      var ejeY = q("#f04-perdida-eje-y");
      var ejeX = q("#f04-perdida-eje-x");
      var curva = q("#f04-perdida-curva");
      var marca = q("#f04-perdida-marca");
      var punto = q("#f04-perdida-punto");
      var palabras = qa(".f04-perdida-pal");

      /* svg-path-draw: la longitud real del trazo alimenta dasharray/dashoffset.
         Determinista — la misma geometría da la misma longitud en cada seek. */
      var trazo = function (path) {
        var L = path.getTotalLength();
        path.style.strokeDasharray = L + "px";
        return L;
      };
      var LY = trazo(ejeY);
      var LX = trazo(ejeX);
      var LC = trazo(curva);
      var LM = trazo(marca);

      var tl = gsap.timeline({ paused: true });

      /* cámara macro: empuje casi imperceptible que decelera y se detiene con el pie */
      tl.fromTo(camara, { scale: 1 }, { scale: 1.012, duration: QUIETUD, ease: "power2.out" }, 0);

      /* ── Escena 1 — «Vas a entender» (0.239–1.22)
         los dos ejes se dibujan en hairline tinta al 20%, desde el origen ── */
      tl.fromTo(ejeY, { strokeDashoffset: LY }, { strokeDashoffset: 0, duration: 0.40, ease: "power2.out" }, 0.10);
      tl.fromTo(ejeX, { strokeDashoffset: LX }, { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" }, 0.16);

      /* sus rótulos, en cuanto cada eje aterriza — sin escala numérica */
      tl.fromTo(
        q("#f04-perdida-lab-cl"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.40
      );
      tl.fromTo(
        q("#f04-perdida-lab-eje-x"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.52
      );

      /* ── Escena 1b — el trazo, de izquierda a derecha, a velocidad constante.
         Arranca en 0.40 (la curva ya se ve antes de 0.5s) y corre 2.55s: el máximo
         cae al 70% del recorrido ≈ 2.19s, y la caída entra justo bajo «en pérdida,» ── */
      tl.fromTo(curva, { strokeDashoffset: LC }, { strokeDashoffset: 0, duration: 2.55, ease: "none" }, 0.40);

      /* ── Escena 2 — «pérdida,» (2.759–3.279): el punto del máximo y su rótulo ── */
      tl.fromTo(
        punto,
        { attr: { r: 0 }, opacity: 0 },
        { attr: { r: 7 }, opacity: 1, duration: 0.34, ease: "power2.out" },
        2.98
      );
      tl.fromTo(
        q("#f04-perdida-lab-clmax"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.50, ease: "power2.out" },
        3.12
      );

      /* «y» (3.98): la marca vertical en acento se dibuja sobre el eje horizontal */
      tl.fromTo(marca, { strokeDashoffset: LM }, { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 3.98);

      /* «qué eso» (4.319–4.799): el rótulo de la marca */
      tl.fromTo(
        q("#f04-perdida-lab-critico"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" },
        4.30
      );

      /* ── Escena 3 — «puede pasar a cualquier velocidad.» (4.94–7.0)
         la frase del módulo se asienta palabra a palabra, sin rebote ── */
      tl.fromTo(
        palabras,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.50, ease: "power2.out", stagger: 0.055 },
        4.92
      );

      /* Quietud declarada — 6.05s → 7.262s: nada se mueve, ni la cámara.
         Sostiene el timeline hasta DUR. */
      tl.fromTo(
        camara,
        { scale: 1.012 },
        { scale: 1.012, duration: DUR - QUIETUD, ease: "none", immediateRender: false },
        QUIETUD
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-la-perdida"] = tl;
    })();
  </script>
