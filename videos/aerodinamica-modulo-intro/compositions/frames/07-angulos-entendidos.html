  <script>
    (function () {
      var ROOT = document.querySelector('[data-composition-id="07-angulos-entendidos"]');
      if (!ROOT) return;

      /* Todas las líneas de la tabla MENOS la fila focal R6: son las que bajan
         al 45%. El pie queda fuera a propósito (ver Scene 2). */
      var dim = ROOT.querySelectorAll('.f07ae-ln:not(.f07ae-hero)');
      var hero = ROOT.querySelector('.f07ae-hero');
      var foot = ROOT.querySelector('.f07ae-foot');
      var cellPitch = ROOT.querySelector('.f07ae-cell-pitch');
      var cellAoa = ROOT.querySelector('.f07ae-cell-aoa');
      var band = ROOT.querySelector('.f07ae-band');

      /* ────────────────────────────────────────────────────────────────
         Blueprint grid-card-assemble — ADAPTADO por el paquete al caso
         límite: la rejilla NO se ensambla aquí, porque YA ESTÁ ENSAMBLADA.
         El espectador la vio montarse en el Frame 02. Lo que sobrevive del
         blueprint es su Scene 3 — «todo se asienta y se sostiene hasta el
         final» — más su verbo de de-énfasis por posición (dim-by-position,
         mapeado a `gsap-effects`: opacidad por línea, sin recorrido). El
         ensamblaje se sustituye por su inverso exacto: un cambio de PESO
         sobre una rejilla inmóvil. Nada entra en Scene 1; nada se desplaza
         en Scene 2; sólo la banda llega en Scene 3.

         ESTE PLANO VA SIN LOCUCIÓN, A PROPÓSITO. El guion tenía una línea
         aquí —«Al terminar, vas a ver una nariz quince grados arriba y un
         avión cayendo…»— pero lo que decía ya está escrito en la banda, así
         que la voz solo lo iba a repetir. Callar al narrador justo cuando
         aparece lo que hay que entender es el recurso, no una avería.

         Sin voz que marcar, los tiempos los pone la lectura: la banda son 55
         caracteres y necesita sus casi tres segundos de quietud para leerse.
         Por eso el plano dura 6.8s y no los 10.5 de la versión narrada.
         ──────────────────────────────────────────────────────────────── */

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–1.1s) — CORTE SECO E IDÉNTICO. Ni una entrada, ni un
         fundido, ni una escala: el frame aparece ya en el estado en que quedó
         el Frame 02. Durante un segundo es literalmente la misma imagen.
         El estado se fija explícitamente en t=0 para que cualquier seek hacia
         atrás lo reconstruya igual. El sujeto es visible en el fotograma 0. */
      tl.set(dim, { opacity: 1 }, 0);
      tl.set(hero, { opacity: 1 }, 0);
      tl.set(foot, { opacity: 1 }, 0);

      /* Scene 2 (1.1–3.3s) — CAMBIA EL PESO, NO LA POSICIÓN.
         (a) Todas las demás líneas bajan al 45%. La fila focal
             no se toca: sube a plena tinta por contraste, que es la única
             manera de destacarla sin mover un píxel. El pie NO se atenúa: su
             crema al 50% ya lo deja al mismo peso óptico que las líneas
             atenuadas, y es requisito legal — se queda exactamente como en el
             Frame 02. */
      tl.fromTo(dim,
        { opacity: 1 },
        { opacity: 0.45, duration: 0.72, ease: 'power2.inOut' },
        1.10);

      /*   (b) «+15°» toma el acento. Color de texto,
             no recuadro: el <span> es inline y sin caja, así que la rejilla
             mono no se mueve. Columna 35 → x = 885.0px. */
      tl.fromTo(cellPitch,
        { color: '#FBFAF8' },
        { color: '#5D84AC', duration: 0.54, ease: 'power2.out' },
        1.70);

      /*   (c) «40° (en pérdida)» toma el acento en «y un avión cayendo» —
             0.8s después, para que se lean como dos datos y no como un par.
             Columna 57 → x = 1307.4px. «–25°» se queda a plena tinta y SIN
             acento: es el dato que explica, no el que sorprende. */
      tl.fromTo(cellAoa,
        { color: '#FBFAF8' },
        { color: '#5D84AC', duration: 0.54, ease: 'power2.out' },
        2.40);

      /* Scene 3 (3.3–6.8s) — la banda entra con un
         fundido corto con 16px de subida, aterrizada en 3.92. A partir de ahí,
         LA QUIETUD MÁS LARGA DEL VIDEO: 2.9 segundos en los que no se mueve
         absolutamente nada. Sin push, sin drift, sin flotación. El panel
         completamente quieto es lo que hace legible el cambio de peso — por
         eso este frame renuncia al acercamiento del 2% del Frame 02. */
      tl.fromTo(band,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.62, ease: 'power2.out' },
        3.30);

      /* Sostener el plano aterrizado hasta el último fotograma — sin animación
         de salida (el frame no es el último; la transición raíz es la salida). */
      tl.to({ hold: 0 }, { hold: 1, duration: 0.001 }, 6.799);

      window.__timelines = window.__timelines || {};
      window.__timelines['07-angulos-entendidos'] = tl;
    })();
