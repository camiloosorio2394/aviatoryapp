  <script>
    (function () {

      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–3.0s) — sobre papel, los cuatro rotulos entran en cruz,

        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.12);

        { scaleY: 0 },
        { scaleY: 1, duration: 0.45, ease: "power2.out" }, 0.32);

        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.62);

        { scaleY: 0 },
        { scaleY: 1, duration: 0.45, ease: "power2.out" }, 0.82);

      /* izquierda — EMPUJE (Thrust), entra desde fuera del cuadro */

        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 1.12);

        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" }, 1.32);

      /* derecha — RESISTENCIA (Drag), cierra la cruz */

        { opacity: 0, x: 26 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 1.62);
      tl.fromTo(one(".f03-sustentacion-hair-right"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" }, 1.82);

      /* ── Scene 2 (3.0–6.2s) — la cruz se atenúa al 45% y sube desde abajo el

        { opacity: 1 },
        { opacity: 0.45, duration: 0.70, ease: "power2.inOut" }, 3.00);

            empuje lentísimo sobre el panel, sin salida. ── */
