<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Perder la capacidad PBN: el flujo</title>
<desc id="desc">Diagrama de flujo vertical: la capacidad PBN se degrada; controlar el avión; identificar el mensaje o la falla; contrastar la posición; aplicar QRH y SOP; determinar qué capacidad de navegación queda; y la pregunta decisiva, se puede seguir cumpliendo la especificación exigida. Si la respuesta es sí, continuar y seguir vigilando. Si es no, informar al ATC, solicitar autorización alternativa y usar la capacidad de navegación disponible. A la izquierda, tres notas: el mensaje concreto está en el FCOM y el QRH; qué capacidad queda depende de la especificación; y la pregunta decisiva se contestó en el briefing.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="1140" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Perder la capacidad PBN: el flujo</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Sirve en cualquier fase y con cualquier especificación</text>
<rect x="500" y="160" width="680" height="64" rx="12" fill="#E9DDC7" stroke="#8F7343" stroke-width="3"/><text x="840" y="201" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">LA CAPACIDAD PBN SE DEGRADA</text><path d="M840 226L840 242" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="246" width="680" height="64" rx="12" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="840" y="287" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">CONTROLAR EL AVIÓN</text><path d="M840 312L840 328" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="332" width="680" height="64" rx="12" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="840" y="373" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">IDENTIFICAR EL MENSAJE O LA FALLA</text><path d="M840 398L840 414" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="418" width="680" height="64" rx="12" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="840" y="459" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">CONTRASTAR LA POSICIÓN</text><path d="M840 484L840 500" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="504" width="680" height="64" rx="12" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="840" y="545" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">APLICAR QRH Y SOP</text><path d="M840 570L840 586" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="590" width="680" height="64" rx="12" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="840" y="631" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">DETERMINAR QUÉ CAPACIDAD DE NAVEGACIÓN QUEDA</text><path d="M840 656L840 672" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><path d="M840 676L1180 760L840 844L500 760Z" fill="#5C4520"/><text x="840" y="744" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="840" dy="0">¿SE PUEDE SEGUIR CUMPLIENDO</tspan><tspan x="840" dy="32">LA ESPECIFICACIÓN EXIGIDA?</tspan></text><path d="M1180 760L1262 760" fill="none" stroke="#2E7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-verde)"/><text x="1221" y="744" font-size="24" font-weight="700" fill="#2E7A4B" text-anchor="middle">SÍ</text><rect x="1272" y="710" width="272" height="100" rx="14" fill="#DDEFE3"/><text x="1408" y="754" font-size="24" font-weight="700" fill="#2E7A4B" text-anchor="middle"><tspan x="1408" dy="0">Continuar y</tspan><tspan x="1408" dy="30">seguir vigilando</tspan></text><path d="M840 844L840 888" fill="none" stroke="#5C4520" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><text x="856" y="876" font-size="24" font-weight="700" fill="#5C4520">NO</text><rect x="480" y="898" width="720" height="56" rx="12" fill="#F3EDE1" stroke="#5C4520" stroke-width="3"/><text x="840" y="935" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">INFORMAR AL ATC</text><rect x="480" y="964" width="720" height="56" rx="12" fill="#F3EDE1" stroke="#5C4520" stroke-width="3"/><text x="840" y="1001" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">SOLICITAR AUTORIZACIÓN ALTERNATIVA</text><rect x="480" y="1030" width="720" height="56" rx="12" fill="#F3EDE1" stroke="#5C4520" stroke-width="3"/><text x="840" y="1067" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">USAR LA CAPACIDAD DE NAVEGACIÓN DISPONIBLE</text><rect x="56" y="326" width="420" height="90" rx="12" fill="#FFFFFF" stroke="#D2BC93" stroke-width="3"/><text x="80" y="360" font-size="22" fill="#231F1A"><tspan x="80" dy="0">El mensaje concreto está en el FCOM</tspan><tspan x="80" dy="29">y el QRH.</tspan></text><path d="M476 364L494 364" fill="none" stroke="#D2BC93" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><rect x="56" y="570" width="420" height="90" rx="12" fill="#FFFFFF" stroke="#D2BC93" stroke-width="3"/><text x="80" y="604" font-size="22" fill="#231F1A"><tspan x="80" dy="0">Depende de la especificación: las</tspan><tspan x="80" dy="29">fuentes admitidas no son las mismas.</tspan></text><path d="M476 622L494 622" fill="none" stroke="#D2BC93" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><rect x="56" y="720" width="420" height="61" rx="12" fill="#FFFFFF" stroke="#D2BC93" stroke-width="3"/><text x="80" y="754" font-size="22" fill="#231F1A"><tspan x="80" dy="0">Esto se contestó en el briefing.</tspan></text><path d="M476 760L494 760" fill="none" stroke="#D2BC93" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/>
<text x="1560" y="1116" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-28</text>
</svg>
