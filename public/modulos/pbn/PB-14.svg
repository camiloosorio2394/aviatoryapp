<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">El tramo RF: el arco es la trayectoria</title>
<desc id="desc">Vista en planta. Del waypoint A sale un arco de radio constante en magenta hasta el waypoint B, con el centro marcado por una cruz y el mismo radio R hasta cada extremo. Un avión sigue la curva. En gris y con línea de puntos, el giro que haría el avión si anticipara el paso por un waypoint en la esquina: queda claramente fuera del arco. Al pie: la trayectoria publicada es el arco y la velocidad máxima del tramo está en la carta.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">El tramo RF: el arco es la trayectoria</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Radio fijo, centro fijo: el avión no decide dónde gira</text>
<path d="M380.0 630.0L680.0 630.0L680.0 330.0" fill="none" stroke="#A89F94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 10"/><path d="M560 630A120 120 0 0 0 680 510" fill="none" stroke="#6F665B" stroke-width="4" stroke-dasharray="3 8"/><path d="M680 617L683.6 626.4L693 630L683.6 633.6L680 643L676.4 633.6L667 630L676.4 626.4Z" fill="#FFFFFF" stroke="#A89F94" stroke-width="2.5" stroke-linejoin="round"/><text x="710" y="644" font-size="22" fill="#6F665B"><tspan x="710" dy="0">Giro anticipado en un waypoint:</tspan><tspan x="710" dy="29">queda fuera del arco.</tspan></text><path d="M100 630L380 630" fill="none" stroke="#B0198F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 630A300 300 0 0 0 680 330" fill="none" stroke="#B0198F" stroke-width="9"/><path d="M680 330L680 180" fill="none" stroke="#B0198F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-magenta)"/><path d="M380.0 330.0L380.0 630.0" fill="none" stroke="#231F1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M380.0 330.0L680.0 330.0" fill="none" stroke="#231F1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M366 330L394 330M380 316L380 344" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="312" font-size="20" fill="#6F665B" text-anchor="end">centro</text><text x="358" y="488" font-size="30" font-weight="700" fill="#231F1A" text-anchor="end">R</text><text x="530" y="312" font-size="30" font-weight="700" fill="#231F1A" text-anchor="middle">R</text><path d="M380 615L384.2 625.8L395 630L384.2 634.2L380 645L375.8 634.2L365 630L375.8 625.8Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><path d="M680 315L684.2 325.8L695 330L684.2 334.2L680 345L675.8 334.2L665 330L675.8 325.8Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><text x="380" y="676" font-size="24" font-weight="700" fill="#231F1A" text-anchor="middle">WP A</text><text x="708" y="338" font-size="24" font-weight="700" fill="#231F1A">WP B</text><path d="M0 -30C3 -30 4 -26 4 -20L4 -6L30 6L30 11L4 5L4 18L11 24L11 28L0 25.5L-11 28L-11 24L-4 18L-4 5L-30 11L-30 6L-4 -6L-4 -20C-4 -26 -3 -30 0 -30Z" fill="#231F1A" transform="translate(592.1 542.1) rotate(45) scale(1.3)"/><text x="420" y="440" font-size="26" font-weight="700" fill="#B0198F">TRAMO RF</text><text x="420" y="470" font-size="22" fill="#B0198F">radio constante</text><rect x="1020" y="280" width="520" height="330" rx="16" fill="#FFFFFF" stroke="#D2BC93" stroke-width="3"/><text x="1050" y="336" font-size="28" font-weight="700" fill="#5C4520"><tspan x="1050" dy="0">La trayectoria publicada es el</tspan><tspan x="1050" dy="36">arco. La velocidad máxima del</tspan><tspan x="1050" dy="36">tramo está en la carta.</tspan></text><text x="1050" y="480" font-size="22" fill="#6F665B"><tspan x="1050" dy="0">Con el radio fijo, lo que cambia con la</tspan><tspan x="1050" dy="29">velocidad es la inclinación necesaria para</tspan><tspan x="1050" dy="29">seguirlo.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-14</text>
</svg>
