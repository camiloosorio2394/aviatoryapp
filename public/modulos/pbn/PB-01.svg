<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La misma llegada, dos maneras de trazarla</title>
<desc id="desc">Dos mapas del mismo terreno y el mismo aeropuerto. A la izquierda, navegación convencional: la ruta va en tramos rectos de un VOR al siguiente, y uno de los tramos pasa sobre el cerro donde está la antena. A la derecha, PBN: la misma llegada definida por seis waypoints de nombre ficticio, con la trayectoria lejos del relieve y alineada con la pista.</desc>
