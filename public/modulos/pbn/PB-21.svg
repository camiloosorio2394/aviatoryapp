<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Autorización, carta y FMS: las tres se contrastan</title>
<desc id="desc">Un triángulo con la autorización del ATC arriba, la carta abajo a la izquierda y el FMS abajo a la derecha, y en el centro un círculo rotulado contraste. Junto a cada lado, el error típico de ese par: entre autorización y carta, se vuela lo que se esperaba y no lo autorizado; entre carta y FMS, lo cargado no es lo publicado; entre autorización y FMS, se ejecuta antes de comparar.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Autorización, carta y FMS: las tres se contrastan</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Cada par tiene su error típico; el hábito es comparar las tres antes de ejecutar</text>
<path d="M800 230L400 740L1200 740Z" fill="#F3EDE1" stroke="#8F7343" stroke-width="4" stroke-linejoin="round"/><path d="M800 570L800 230" fill="none" stroke="#D2BC93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/><path d="M800 570L400 740" fill="none" stroke="#D2BC93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/><path d="M800 570L1200 740" fill="none" stroke="#D2BC93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/><circle cx="800" cy="570" r="92" fill="#5C4520"/><text x="800" y="580" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CONTRASTE</text><rect x="590" y="190" width="420" height="80" rx="14" fill="#FFFFFF" stroke="#5C4520" stroke-width="3"/><text x="800" y="240" font-size="28" font-weight="700" fill="#5C4520" text-anchor="middle">AUTORIZACIÓN DEL ATC</text><rect x="290" y="700" width="220" height="80" rx="14" fill="#FFFFFF" stroke="#5C4520" stroke-width="3"/><text x="400" y="750" font-size="28" font-weight="700" fill="#5C4520" text-anchor="middle">CARTA</text><rect x="1090" y="700" width="220" height="80" rx="14" fill="#FFFFFF" stroke="#5C4520" stroke-width="3"/><text x="1200" y="750" font-size="28" font-weight="700" fill="#5C4520" text-anchor="middle">FMS</text><text x="560" y="420" font-size="24" font-weight="700" fill="#B3372B" text-anchor="end"><tspan x="560" dy="0">Se vuela lo que se</tspan><tspan x="560" dy="31">esperaba, no lo</tspan><tspan x="560" dy="31">autorizado.</tspan></text><text x="1040" y="420" font-size="24" font-weight="700" fill="#B3372B"><tspan x="1040" dy="0">Se ejecuta antes de</tspan><tspan x="1040" dy="31">comparar.</tspan></text><text x="800" y="830" font-size="24" font-weight="700" fill="#B3372B" text-anchor="middle">Lo cargado no es lo publicado.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-21</text>
</svg>
