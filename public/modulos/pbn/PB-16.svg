<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La desviación lateral, en planta y en cabina</title>
<desc id="desc">A la izquierda, vista en planta: la trayectoria deseada en magenta y el avión desplazado a su derecha, unidos por una cota perpendicular rotulada XTK. A la derecha, la presentación de desviación lateral en cabina, unida a la planta por una línea de puntos: la aguja está desplazada la misma proporción, hacia el lado donde queda la trayectoria.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La desviación lateral, en planta y en cabina</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Lo que se ve en la pantalla es la misma distancia que se ve en el mapa</text>
<path d="M100 450L960 450" fill="none" stroke="#B0198F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-magenta)"/><text x="120" y="430" font-size="24" font-weight="700" fill="#B0198F">DESIRED PATH · trayectoria deseada</text><path d="M0 -30C3 -30 4 -26 4 -20L4 -6L30 6L30 11L4 5L4 18L11 24L11 28L0 25.5L-11 28L-11 24L-4 18L-4 5L-30 11L-30 6L-4 -6L-4 -20C-4 -26 -3 -30 0 -30Z" fill="#231F1A" transform="translate(560 560) rotate(90) scale(1.5)"/><path d="M640 456L640 554" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)" marker-start="url(#f-tinta)"/><text x="660" y="516" font-size="32" font-weight="700" fill="#231F1A">XTK</text><text x="660" y="546" font-size="22" fill="#6F665B">desviación lateral</text><path d="M600 590C760 680 1000 650 1110 510" fill="none" stroke="#6F665B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8"/><rect x="1096" y="286" width="428" height="278" rx="22" fill="#2A2E34"/><rect x="1110" y="300" width="400" height="250" rx="10" fill="#161A1F" stroke="#3A4048" stroke-width="2"/><text x="1310" y="344" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#9AA3AD" text-anchor="middle">DESVIACIÓN LATERAL</text><circle cx="1170" cy="430" r="9" fill="none" stroke="#E6EAEE" stroke-width="3"/><circle cx="1240" cy="430" r="9" fill="none" stroke="#E6EAEE" stroke-width="3"/><circle cx="1380" cy="430" r="9" fill="none" stroke="#E6EAEE" stroke-width="3"/><circle cx="1450" cy="430" r="9" fill="none" stroke="#E6EAEE" stroke-width="3"/><path d="M1310 390L1310 470" fill="none" stroke="#E6EAEE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1240 408L1252 430L1240 452L1228 430Z" fill="#E05ACB"/><text x="1310" y="522" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" fill="#9AA3AD" text-anchor="middle">avión = línea central</text><text x="1100" y="620" font-size="22" fill="#231F1A"><tspan x="1100" dy="0">La aguja marca dónde queda la</tspan><tspan x="1100" dy="29">trayectoria: el avión está a la derecha, la</tspan><tspan x="1100" dy="29">aguja a la izquierda. Se corrige hacia ella.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-16</text>
