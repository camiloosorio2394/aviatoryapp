<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Por qué la temperatura es una limitación</title>
<desc id="desc">Perfil de una aproximación final. Desde el FAF a la pista, una senda continua rotulada trayectoria en condición estándar y, por debajo, una senda de puntos rotulada efecto conceptual de aire más frío que el estándar. Las dos coinciden en el umbral y se separan con la altura; entre ellas, a la altura del FAF, una cota sin cifra: la magnitud está en la nota de la carta. Bajo la senda fría hay un obstáculo con menos margen del diseñado.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Por qué la temperatura es una limitación</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Con aire más frío que el estándar, la senda barométrica queda más baja de lo que indica</text>
<rect x="80" y="740" width="1440" height="60" fill="#EFE7D8"/><path d="M80 740L1520 740" fill="none" stroke="#C9B797" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 740C640 730 680 648 730 644C780 648 820 730 860 740Z" fill="#E3D6BF" stroke="#C9B797" stroke-width="2"/><rect x="1240" y="732" width="260" height="10" fill="#231F1A"/><text x="1370" y="780" font-size="22" font-weight="700" fill="#6F665B" text-anchor="middle">PISTA</text><path d="M300 280L300 740" fill="none" stroke="#6F665B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8"/><text x="300" y="780" font-size="24" font-weight="700" fill="#231F1A" text-anchor="middle">FAF</text><path d="M140 320L300 320L1240 722" fill="none" stroke="#5C4520" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 430L300 430L1240 722" fill="none" stroke="#A86400" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 10"/><path d="M240 326L240 424" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)" marker-start="url(#f-tinta)"/><text x="224" y="383" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end">¿cuánto?</text><text x="56" y="184" font-size="22" fill="#231F1A"><tspan x="56" dy="0">La magnitud depende de la temperatura y del procedimiento: está en la nota de la</tspan><tspan x="56" dy="29">carta, no en una regla general.</tspan></text><text x="470" y="376.7" font-size="22" font-weight="700" fill="#5C4520" transform="rotate(23.15443759699923 470 376.7)">TRAYECTORIA EN CONDICIÓN ESTÁNDAR</text><text x="330" y="425.3" font-size="20" font-weight="700" fill="#A86400" transform="rotate(17.256795527993713 330 425.3)">EFECTO CONCEPTUAL DEL AIRE MÁS FRÍO</text><rect x="613.2" y="598" width="173.6" height="36" rx="18" fill="#FBEBD2"/><text x="700" y="623.2" font-size="20" font-weight="700" fill="#A86400" text-anchor="middle">menos margen</text><rect x="960" y="170" width="560" height="150" rx="14" fill="#FFFFFF" stroke="#5C4520" stroke-width="3"/><text x="990" y="214" font-size="24" font-weight="700" fill="#5C4520" letter-spacing="1">LIMITACIÓN DE TEMPERATURA</text><text x="990" y="252" font-size="24" fill="#231F1A">Ver la nota del procedimiento.</text><text x="990" y="290" font-size="22" fill="#6F665B">Fuera de límites y sin compensación: MDA de LNAV.</text><text x="56" y="846" font-size="22" fill="#6F665B">Las dos sendas coinciden en el umbral: el error del altímetro crece con la altura sobre la fuente del ajuste.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-11</text>
</svg>
