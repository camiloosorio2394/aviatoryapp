<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">El contraste carta-FMS, renglón por renglón</title>
<desc id="desc">Recreación de una página genérica de plan de vuelo del FMS con la SID KILAB 1A de la pista 09 cargada: un encabezado con la pista y el procedimiento, un renglón con la transición MORUS y cinco renglones de puntos con su derrota y su distancia; uno lleva la restricción de velocidad de 230 nudos y otros dos, las de altitud. Cinco números señalan la pista, el nombre del procedimiento, la transición, la columna de puntos y derrotas, y una restricción de altitud.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="940" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">El contraste carta-FMS, renglón por renglón</text>
<rect x="1059.3" y="54" width="484.7" height="36" rx="18" fill="#F3EDE1"/><text x="1301.6" y="79.2" font-size="20" font-weight="700" fill="#5C4520" text-anchor="middle">Pantalla genérica · no imita a ningún fabricante</text>
<rect x="106" y="166" width="848" height="718" rx="22" fill="#2A2E34"/><rect x="120" y="180" width="820" height="690" rx="10" fill="#161A1F" stroke="#3A4048" stroke-width="2"/><text x="160" y="236" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#E6EAEE">RWY09</text><text x="360" y="236" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#E6EAEE">KILAB1A</text><text x="160" y="296" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="700" fill="#9AA3AD">TRANS</text><text x="310" y="296" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#63C7E0">MORUS</text><path d="M150 324L910 324" fill="none" stroke="#3A4048" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="364" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#9AA3AD">DERROTA</text><text x="310" y="364" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#9AA3AD">PUNTO</text><text x="520" y="364" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#9AA3AD">DIST</text><text x="680" y="364" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#9AA3AD">VEL/ALT</text><text x="160" y="430" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#5BD68F">090°</text><text x="310" y="430" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#E6EAEE">OLTAR</text><text x="520" y="430" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">4 NM</text><text x="680" y="430" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#63C7E0">230/-----</text><text x="160" y="514" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#5BD68F">047°</text><text x="310" y="514" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#E6EAEE">PUXEM</text><text x="520" y="514" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">6 NM</text><text x="680" y="514" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#63C7E0">---/5000A</text><text x="160" y="598" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#5BD68F">028°</text><text x="310" y="598" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#E6EAEE">RIBOS</text><text x="520" y="598" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">5 NM</text><text x="680" y="598" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#63C7E0">---/9000B</text><text x="160" y="682" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#5BD68F">072°</text><text x="310" y="682" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#E6EAEE">KILAB</text><text x="520" y="682" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">7 NM</text><text x="160" y="766" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#5BD68F">064°</text><text x="310" y="766" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#E6EAEE">MORUS</text><text x="520" y="766" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">31 NM</text><path d="M298 226L260 226" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="226" r="5" fill="#5C4520"/><circle cx="298" cy="226" r="18" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="298" y="232.8" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M530 226L494 226" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="494" cy="226" r="5" fill="#5C4520"/><circle cx="530" cy="226" r="18" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="530" y="232.8" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M442 286L404 286" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="404" cy="286" r="5" fill="#5C4520"/><circle cx="442" cy="286" r="18" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="442" y="292.8" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M440 356L410 356" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="356" r="5" fill="#5C4520"/><circle cx="440" cy="356" r="18" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="440" y="362.8" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M868 506L832 506" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="832" cy="506" r="5" fill="#5C4520"/><circle cx="868" cy="506" r="18" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="868" y="512.8" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1070" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1090" cy="236" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1090" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1126" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1126" dy="0">Pista</tspan></text><text x="1126" y="273" font-size="22" fill="#6F665B"><tspan x="1126" dy="0">Tiene que ser la autorizada. Otra pista es</tspan><tspan x="1126" dy="27">otro procedimiento.</tspan></text><circle cx="1090" cy="339" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1090" y="346.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1126" y="347" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1126" dy="0">Procedimiento</tspan></text><text x="1126" y="376" font-size="22" fill="#6F665B"><tspan x="1126" dy="0">Se compara con la autorización, no con lo</tspan><tspan x="1126" dy="27">que se esperaba.</tspan></text><circle cx="1090" cy="442" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1090" y="449.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1126" y="450" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1126" dy="0">Transición</tspan></text><text x="1126" y="479" font-size="22" fill="#6F665B"><tspan x="1126" dy="0">La equivocada, con la SID correcta,</tspan><tspan x="1126" dy="27">cambia la trayectoria. Es la que más se</tspan><tspan x="1126" dy="27">escapa.</tspan></text><circle cx="1090" cy="572" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1090" y="579.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1126" y="580" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1126" dy="0">Puntos y derrotas</tspan></text><text x="1126" y="609" font-size="22" fill="#6F665B"><tspan x="1126" dy="0">Secuencia y rumbos contra la carta.</tspan></text><circle cx="1090" cy="648" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1090" y="655.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1126" y="656" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1126" dy="0">Restricción</tspan></text><text x="1126" y="685" font-size="22" fill="#6F665B"><tspan x="1126" dy="0">Leída en la carta no basta: tiene que</tspan><tspan x="1126" dy="27">estar aquí.</tspan></text>
