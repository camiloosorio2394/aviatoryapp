<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Tres errores que se suman: PDE, NSE y FTE</title>
<desc id="desc">Diagrama de convergencia. Tres cajas a la izquierda: PDE, trayectoria definida frente a deseada, que se considera despreciable; NSE, posición verdadera frente a estimada, que vigila el sistema; y FTE, el control del avión frente a lo mandado, que vigila la tripulación. Las tres flechas convergen en TSE, posición verdadera frente a deseada, la suma vectorial de las tres. Debajo, el reparto: el sistema alerta del NSE y la tripulación vigila el FTE en la desviación lateral.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Tres errores que se suman: PDE, NSE y FTE</text>
<text x="56" y="124" font-size="24" fill="#6F665B">El error total sale de tres fuentes, y cada una tiene quien la vigila</text>
<rect x="56" y="170" width="600" height="124" rx="14" fill="#FFFFFF" stroke="#A89F94" stroke-width="3"/><text x="84" y="222" font-size="36" font-weight="700" fill="#A89F94">PDE</text><text x="190" y="220" font-size="24" font-weight="700" fill="#231F1A">Trayectoria definida frente a deseada</text><text x="190" y="256" font-size="22" fill="#6F665B" font-style="italic">Se considera despreciable</text><path d="M656 232C800 232 860 400 990 400" fill="none" stroke="#A89F94" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-gris)"/><rect x="56" y="320" width="600" height="124" rx="14" fill="#FFFFFF" stroke="#5C4520" stroke-width="3"/><text x="84" y="372" font-size="36" font-weight="700" fill="#5C4520">NSE</text><text x="190" y="370" font-size="24" font-weight="700" fill="#231F1A">Posición verdadera frente a estimada</text><text x="190" y="406" font-size="22" fill="#6F665B">La vigila el sistema</text><path d="M656 382C800 382 860 400 990 400" fill="none" stroke="#5C4520" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="56" y="470" width="600" height="124" rx="14" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="84" y="522" font-size="36" font-weight="700" fill="#8F7343">FTE</text><text x="190" y="520" font-size="24" font-weight="700" fill="#231F1A">Control del avión frente a lo mandado</text><text x="190" y="556" font-size="22" fill="#6F665B">La vigila la tripulación</text><path d="M656 532C800 532 860 400 990 400" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="1000" y="300" width="544" height="200" rx="16" fill="#5C4520"/><text x="1036" y="366" font-size="48" font-weight="700" fill="#FFFFFF">TSE</text><text x="1036" y="412" font-size="26" font-weight="700" fill="#FFFFFF">Posición verdadera frente a deseada</text><text x="1036" y="454" font-size="22" fill="#E9DDC7">Suma vectorial de los tres</text><rect x="56" y="660" width="734" height="130" rx="14" fill="#F3EDE1"/><text x="84" y="710" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">EL SISTEMA</text><text x="84" y="752" font-size="30" font-weight="700" fill="#5C4520">Alerta del NSE.</text><rect x="810" y="660" width="734" height="130" rx="14" fill="#F3EDE1"/><text x="838" y="710" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">LA TRIPULACIÓN</text><text x="838" y="752" font-size="30" font-weight="700" fill="#5C4520">Vigila el FTE en la desviación lateral.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-17</text>
</svg>
