" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="820" cy="212" r="5" fill="#5C4520"/><circle cx="790" cy="212" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="790" y="219.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M1070 676L1070 648" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1070" cy="648" r="5" fill="#5C4520"/><circle cx="1070" cy="676" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1070" y="683.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M940 540L852 590" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="852" cy="590" r="5" fill="#5C4520"/><circle cx="940" cy="540" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="940" y="547.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M420 520L508 520" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="508" cy="520" r="5" fill="#5C4520"/><circle cx="420" cy="520" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="420" y="527.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><path d="M330 316L376 340" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="376" cy="340" r="5" fill="#5C4520"/><circle cx="330" cy="316" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="330" y="323.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><path d="M720 462L684 492" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="684" cy="492" r="5" fill="#5C4520"/><circle cx="720" cy="462" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="720" y="469.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><path d="M740 540L740 596" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="740" cy="596" r="5" fill="#5C4520"/><circle cx="740" cy="540" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="740" y="547.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><path d="M900 928L866 928" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="866" cy="928" r="5" fill="#5C4520"/><circle cx="900" cy="928" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="900" y="935.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><path d="M196 886L166 886" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="166" cy="886" r="5" fill="#5C4520"/><circle cx="196" cy="886" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="196" y="893.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text><path d="M1420 640L1236 588" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1236" cy="588" r="5" fill="#5C4520"/><circle cx="1420" cy="640" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1420" y="647.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text><circle cx="76" cy="1134" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="76" y="1141.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="110" y="1142" font-size="24" font-weight="700" fill="#231F1A">Título</text><text x="110" y="1172" font-size="21" fill="#6F665B"><tspan x="110" dy="0">La clase de procedimiento; no dice solo qué</tspan><tspan x="110" dy="26">exige.</tspan></text><circle cx="576" cy="1134" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="576" y="1141.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="610" y="1142" font-size="24" font-weight="700" fill="#231F1A">Recuadro PBN</text><text x="610" y="1172" font-size="21" fill="#6F665B"><tspan x="610" dy="0">Especificación, sensores y valor RNP</tspan><tspan x="610" dy="26">mínimo. Obligatorio.</tspan></text><circle cx="1076" cy="1134" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1076" y="1141.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1110" y="1142" font-size="24" font-weight="700" fill="#231F1A">Equipo requerido</text><text x="1110" y="1172" font-size="21" fill="#6F665B"><tspan x="1110" dy="0">Lo de tierra o del aeropuerto, aparte.</tspan></text><circle cx="76" cy="1238" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="76" y="1245.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="110" y="1246" font-size="24" font-weight="700" fill="#231F1A">Pista</text><text x="110" y="1276" font-size="21" fill="#6F665B"><tspan x="110" dy="0">Lo que se carga tiene que ser exactamente</tspan><tspan x="110" dy="26">esto.</tspan></text><circle cx="576" cy="1238" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="576" y="1245.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="610" y="1246" font-size="24" font-weight="700" fill="#231F1A">Punto fly-by</text><text x="610" y="1276" font-size="21" fill="#6F665B"><tspan x="610" dy="0">El giro se anticipa.</tspan></text><circle cx="1076" cy="1238" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1076" y="1245.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="1110" y="1246" font-size="24" font-weight="700" fill="#231F1A">Tramo RF</text><text x="1110" y="1276" font-size="21" fill="#6F665B"><tspan x="1110" dy="0">Arco de radio constante: capacidad listada y</tspan><tspan x="1110" dy="26">velocidad máxima.</tspan></text><circle cx="76" cy="1342" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="76" y="1349.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="110" y="1350" font-size="24" font-weight="700" fill="#231F1A">Restricción de altitud</text><text x="110" y="1380" font-size="21" fill="#6F665B"><tspan x="110" dy="0">Se verifica cargada en el FMS.</tspan></text><circle cx="576" cy="1342" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="576" y="1349.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="610" y="1350" font-size="24" font-weight="700" fill="#231F1A">Restricción de velocidad</text><text x="610" y="1380" font-size="21" fill="#6F665B"><tspan x="610" dy="0">En un RF es parte del diseño.</tspan></text><circle cx="1076" cy="1342" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1076" y="1349.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="1110" y="1350" font-size="24" font-weight="700" fill="#231F1A">Derrota</text><text x="1110" y="1380" font-size="21" fill="#6F665B"><tspan x="1110" dy="0">La referencia contra la que se compara el</tspan><tspan x="1110" dy="26">FMS.</tspan></text><circle cx="76" cy="1446" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="76" y="1453.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><text x="110" y="1454" font-size="24" font-weight="700" fill="#231F1A">Valor con dos decimales</text><text x="110" y="1484" font-size="21" fill="#6F665B"><tspan x="110" dy="0">0.30 o menos: operación con autorización</tspan><tspan x="110" dy="26">requerida.</tspan></text><circle cx="576" cy="1446" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="576" y="1453.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text><text x="610" y="1454" font-size="24" font-weight="700" fill="#231F1A">Notas</text><text x="610" y="1484" font-size="21" fill="#6F665B"><tspan x="610" dy="0">Temperatura, ajuste altimétrico y</tspan><tspan x="610" dy="26">condiciones.</tspan></text><circle cx="1076" cy="1446" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1076" y="1453.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text><text x="1110" y="1454" font-size="24" font-weight="700" fill="#231F1A">Frustrada</text><text x="1110" y="1484" font-size="21" fill="#6F665B"><tspan x="1110" dy="0">Su propio requisito de navegación.</tspan></text>
