65" fill="none" stroke="#231F1A" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="470" y="402" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end">180°</text><text x="560" y="470" font-size="26" font-weight="700" fill="#231F1A">RF</text><text x="560" y="500" font-size="20" font-weight="700" fill="#231F1A">MAX 180 KT</text><text x="840" y="542" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">3000</text><path d="M814 520L866 520M814 548L866 548" fill="none" stroke="#231F1A" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="740" y="634" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">090°</text><path d="M56 680L1544 680" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><path d="M300 830L1300 830" fill="none" stroke="#6F665B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1020" y="824" width="100" height="8" fill="#231F1A"/><path d="M640 740L840 740L1020 818" fill="none" stroke="#231F1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M840 730L840 830" fill="none" stroke="#6F665B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="840" y="722" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">DAMOX · 3000</text><path d="M900 800L1100 800" fill="none" stroke="#231F1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="1110" y="806" font-size="20" font-weight="700" fill="#231F1A">DA</text><path d="M964 800L1040 750" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#f-tinta)"/><path d="M56 856L1544 856" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="84" y="892" font-size="20" font-weight="700" fill="#6F665B" letter-spacing