<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">De la radioayuda a la trayectoria</title>
<desc id="desc">Tres mapas con los mismos dos aeropuertos y el mismo cerro. En el primero, navegación convencional: la derrota se quiebra sobre tres VOR. En el segundo, navegación de área: la derrota pasa por waypoints y los VOR quedan en gris. En el tercero, PBN: la misma derrota con una franja alrededor y la especificación rotulada en cada tramo, RNAV 1 en la salida, RNP 2 en ruta y RNP APCH en la aproximación.</desc>
