<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">De la radioayuda a la trayectoria</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Lo que PBN añade al mapa de la navegación de área es el requisito de performance de cada segmento</text>
