<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Dónde se declara la capacidad PBN</title>
<desc id="desc">Recreación de un fragmento de plan de vuelo OACI. En la casilla 10, la cadena de equipo SDFGHIRWY/S, con la R resaltada. En la casilla 18, PBN/A1D2O2S2 y otro indicador. Debajo, qué significa cada descriptor: A1, RNAV 10; D2, RNAV 1 con GNSS; O2, RNP 1 básica con GNSS; S2, RNP APCH con Baro-VNAV. Tres números señalan la R, el indicador PBN/ y el descriptor S2.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Dónde se declara la capacidad PBN</text>
<rect x="1132.8" y="54" width="411.2" height="36" rx="18" fill="#F3EDE1"/><text x="1338.4" y="79.2" font-size="20" font-weight="700" fill="#5C4520" text-anchor="middle">Recreación educativa · plan de ejemplo</text>
<rect x="56" y="160" width="1074" height="700" rx="3" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><text x="90" y="220" font-size="22" font-weight="700" fill="#6F665B" letter-spacing="1">10  EQUIPO Y CAPACIDADES</text><rect x="90" y="240" width="700" height="90" rx="2" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><rect x="274.4" y="256" width="34.4" height="60" rx="6" fill="#E9DDC7"/><text x="120" y="300" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="700" fill="#231F1A">SDFGHIRWY/S</text><text x="90" y="450" font-size="22" font-weight="700" fill="#6F665B" letter-spacing="1">18  OTRA INFORMACIÓN</text><rect x="90" y="470" width="1000" height="90" rx="2" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><rect x="116" y="486" width="113.6" height="60" rx="6" fill="#E9DDC7"/><rect x="380" y="486" width="60.8" height="60" rx="6" fill="#E9DDC7"/><text x="120" y="530" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="700" fill="#231F1A">PBN/A1D2O2S2 DOF/261015</text><text x="90" y="700" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#5C4520">A1</text><text x="150" y="698" font-size="26" fill="#231F1A">RNAV 10</text><text x="590" y="700" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#5C4520">D2</text><text x="650" y="698" font-size="26" fill="#231F1A">RNAV 1 con GNSS</text><text x="90" y="770" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#5C4520">O2</text><text x="150" y="768" font-size="26" fill="#231F1A">RNP 1 básica con GNSS</text><text x="590" y="770" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#5C4520">S2</text><text x="650" y="768" font-size="26" fill="#231F1A">RNP APCH con Baro-VNAV</text><path d="M291.4 386L291.4 320" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="291.4" cy="320" r="5" fill="#5C4520"/><circle cx="291.4" cy="386" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="291.4" y="394.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M172.8 612L172.8 550" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="172.8" cy="550" r="5" fill="#5C4520"/><circle cx="172.8" cy="612" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="172.8" y="619.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M410.4 612L410.4 550" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410.4" cy="550" r="5" fill="#5C4520"/><circle cx="410.4" cy="612" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="410.4" y="619.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1160" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1180" cy="236" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1216" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">La R de la casilla 10</tspan></text><text x="1216" y="273" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">PBN aprobado. Es la declaración</tspan><tspan x="1216" dy="27">general; el detalle va en la 18.</tspan></text><circle cx="1180" cy="339" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="346.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1216" y="347" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">El indicador PBN/</tspan></text><text x="1216" y="376" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Los descriptores concretos:</tspan><tspan x="1216" dy="27">hasta 8, y no más de 16</tspan><tspan x="1216" dy="27">caracteres en total.</tspan></text><circle cx="1180" cy="469" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="476.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1216" y="477" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">S2</tspan></text><text x="1216" y="506" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">RNP APCH con Baro-VNAV: la</tspan><tspan x="1216" dy="27">guía vertical barométrica se</tspan><tspan x="1216" dy="27">declara aparte, distinta de S1.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-25</text>
</svg>
