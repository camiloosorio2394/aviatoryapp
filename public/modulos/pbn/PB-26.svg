<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">En la MEL, la decisión está en las observaciones</title>
<desc id="desc">Recreación de una entrada de MEL ficticia para un receptor GNSS, con cinco columnas: ítem y sistema, categoría de reparación C, dos instalados, uno requerido para el despacho, y las observaciones, que empiezan con el símbolo (O) de procedimiento operacional y dicen que no se permiten las operaciones que exijan dos receptores. Cinco números señalan la columna del sistema, el número requerido, el (O), la columna de observaciones y el renglón que quita una capacidad de navegación.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">En la MEL, la decisión está en las observaciones</text>
<rect x="1117.2" y="54" width="426.8" height="36" rx="18" fill="#F3EDE1"/><text x="1330.6" y="79.2" font-size="20" font-weight="700" fill="#5C4520" text-anchor="middle">Entrada ficticia · con fines de enseñanza</text>
<rect x="56" y="170" width="1074" height="420" rx="3" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><rect x="57" y="171" width="1072" height="70" fill="#EEEAE4"/><text x="173" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">ÍTEM Y SISTEMA</text><text x="335" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">CAT.</text><path d="M290 170L290 590" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="445" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">INSTAL.</text><path d="M380 170L380 590" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="575" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">REQUER.</text><path d="M510 170L510 590" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="885" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">OBSERVACIONES O EXCEPCIONES</text><path d="M640 170L640 590" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><path d="M56 241L1130 241" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="76" y="290" font-size="24" font-weight="700" fill="#231F1A"><tspan x="76" dy="0">34-XX-01</tspan><tspan x="76" dy="32">Receptor GNSS</tspan></text><text x="335" y="290" font-size="30" font-weight="700" fill="#231F1A" text-anchor="middle">C</text><text x="445" y="290" font-size="30" font-weight="700" fill="#231F1A" text-anchor="middle">2</text><text x="575" y="290" font-size="30" font-weight="700" fill="#231F1A" text-anchor="middle">1</text><rect x="660" y="450" width="360" height="76" rx="6" fill="#FBEBD2"/><text x="664" y="340" font-size="23" fill="#231F1A"><tspan x="664" dy="0">(O) Uno puede estar inoperativo</tspan><tspan x="664" dy="34">siempre que:</tspan><tspan x="664" dy="34">a) se cumpla el procedimiento</tspan><tspan x="664" dy="34">operacional asociado, y</tspan><tspan x="664" dy="34">b) no se hagan operaciones que</tspan><tspan x="664" dy="34">exijan dos receptores GNSS.</tspan></text><path d="M173 420L173 330" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="173" cy="330" r="5" fill="#5C4520"/><circle cx="173" cy="420" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="173" y="428.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M575 400L575 304" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="575" cy="304" r="5" fill="#5C4520"/><circle cx="575" cy="400" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="575" y="408.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M740 280L690 312" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="690" cy="312" r="5" fill="#5C4520"/><circle cx="740" cy="280" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="740" y="288.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M1100 206L1078 206" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1078" cy="206" r="5" fill="#5C4520"/><circle cx="1100" cy="206" r="18" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1100" y="212.8" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M1080 488L1026 488" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1026" cy="488" r="5" fill="#5C4520"/><circle cx="1080" cy="488" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="496.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1160" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1180" cy="236" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1216" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Sistema e ítem</tspan></text><text x="1216" y="273" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Lo que se busca, pero no lo que</tspan><tspan x="1216" dy="27">decide.</tspan></text><circle cx="1180" cy="339" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="346.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1216" y="347" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Requeridos</tspan></text><text x="1216" y="376" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Cuántos para despachar.</tspan><tspan x="1216" dy="27">Despachar no es conservar todas</tspan><tspan x="1216" dy="27">las capacidades.</tspan></text><circle cx="1180" cy="469" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="476.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1216" y="477" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">(O)</tspan></text><text x="1216" y="506" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Hay un procedimiento</tspan><tspan x="1216" dy="27">operacional asociado: ahí suele</tspan><tspan x="1216" dy="27">estar la restricción real.</tspan></text><circle cx="1180" cy="599" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="606.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1216" y="607" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Observaciones</tspan></text><text x="1216" y="636" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Lo que queda limitado. Es lo que</tspan><tspan x="1216" dy="27">se salta quien solo mira si sale.</tspan></text><circle cx="1180" cy="702" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="709.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1216" y="710" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">La restricción</tspan></text><text x="1216" y="739" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">El renglón que quita una</tspan><tspan x="1216" dy="27">capacidad PBN con el avión</tspan><tspan x="1216" dy="27">despachable.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-26</text>
</svg>
