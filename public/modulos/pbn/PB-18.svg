<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">RNP frente a ANP: la comparación del sistema</title>
<desc id="desc">Recreación de una página genérica de FMS con dos renglones separados: RNP con el valor 1.0 y ANP con el valor 0.08, y debajo una zona de mensajes vacía. Tres números señalan el renglón RNP, el renglón ANP y la zona de mensajes.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">RNP frente a ANP: la comparación del sistema</text>
<rect x="1059.3" y="54" width="484.7" height="36" rx="18" fill="#F3EDE1"/><text x="1301.6" y="79.2" font-size="20" font-weight="700" fill="#5C4520" text-anchor="middle">Pantalla genérica · no imita a ningún fabricante</text>
<rect x="126" y="176" width="788" height="648" rx="22" fill="#2A2E34"/><rect x="140" y="190" width="760" height="620" rx="10" fill="#161A1F" stroke="#3A4048" stroke-width="2"/><text x="520" y="250" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#E6EAEE" text-anchor="middle">NAV PERFORMANCE</text><text x="200" y="360" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">RNP</text><text x="200" y="420" font-family="'Courier New', Courier, monospace" font-size="56" font-weight="700" fill="#5BD68F">1.0</text><text x="200" y="520" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">ANP</text><text x="200" y="580" font-family="'Courier New', Courier, monospace" font-size="56" font-weight="700" fill="#5BD68F">0.08</text><rect x="180" y="660" width="680" height="100" rx="6" fill="none" stroke="#3A4048" stroke-width="3" stroke-dasharray="10 8"/><text x="520" y="720" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#9AA3AD" text-anchor="middle">(sin mensajes)</text><path d="M960 390L370 402" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="402" r="5" fill="#5C4520"/><circle cx="960" cy="390" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="960" y="398.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M960 560L400 562" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400" cy="562" r="5" fill="#5C4520"/><circle cx="960" cy="560" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="960" y="568.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M960 720L860 710" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="860" cy="710" r="5" fill="#5C4520"/><circle cx="960" cy="720" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="960" y="728.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1060" y="200" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1080" cy="246" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="253.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1116" y="254" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">RNP: lo requerido</tspan></text><text x="1116" y="283" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">Lo fija el procedimiento o el espacio aéreo;</tspan><tspan x="1116" dy="27">automático o manual.</tspan></text><circle cx="1080" cy="349" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="356.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1116" y="357" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">ANP: lo estimado</tspan></text><text x="1116" y="386" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">Incertidumbre de posición, no el error real.</tspan><tspan x="1116" dy="27">También EPU o EPE; en algunos aviones</tspan><tspan x="1116" dy="27">no se muestra.</tspan></text><circle cx="1080" cy="479" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="486.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1116" y="487" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">Mensajes</tspan></text><text x="1116" y="516" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">Aquí saldría la alerta. La norma exige la</tspan><tspan x="1116" dy="27">alerta, no el número.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-18</text>
</svg>
