<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Lo que RNP tiene y RNAV no</title>
<desc id="desc">Dos columnas con la misma trayectoria arriba. RNAV tiene una sola pieza: la capacidad de navegación. RNP tiene tres: la capacidad de navegación, el control de la performance a bordo y la alerta a la tripulación, esta última resaltada con un símbolo de aviso. Al pie: la diferencia no es el número, es el aviso.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Lo que RNP tiene y RNAV no</text>
<text x="56" y="124" font-size="24" fill="#6F665B">La misma trayectoria; lo que cambia es si el avión se vigila a sí mismo y avisa</text>
<path d="M170 215L730 215" fill="none" stroke="#B0198F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-magenta)"/><path d="M270 202L273.6 211.4L283 215L273.6 218.6L270 228L266.4 218.6L257 215L266.4 211.4Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><path d="M450 202L453.6 211.4L463 215L453.6 218.6L450 228L446.4 218.6L437 215L446.4 211.4Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><path d="M630 202L633.6 211.4L643 215L633.6 218.6L630 228L626.4 218.6L617 215L626.4 211.4Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><text x="450" y="310" font-size="52" font-weight="700" fill="#5C4520" text-anchor="middle">RNAV</text><rect x="150" y="350" width="600" height="108" rx="14" fill="#FFFFFF" stroke="#D2BC93" stroke-width="3"/><text x="182" y="400" font-size="30" font-weight="700" fill="#231F1A">Capacidad de navegación</text><text x="182" y="434" font-size="22" fill="#6F665B" font-style="italic">navigation capability</text><rect x="150" y="478" width="600" height="108" rx="14" fill="none" stroke="#A89F94" stroke-width="3" stroke-dasharray="10 10"/><text x="450" y="540" font-size="24" fill="#A89F94" text-anchor="middle">La especificación no lo exige</text><rect x="150" y="606" width="600" height="108" rx="14" fill="none" stroke="#A89F94" stroke-width="3" stroke-dasharray="10 10"/><text x="450" y="668" font-size="24" fill="#A89F94" text-anchor="middle">La especificación no lo exige</text><path d="M870 215L1430 215" fill="none" stroke="#B0198F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-magenta)"/><path d="M970 202L973.6 211.4L983 215L973.6 218.6L970 228L966.4 218.6L957 215L966.4 211.4Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><path d="M1150 202L1153.6 211.4L1163 215L1153.6 218.6L1150 228L1146.4 218.6L1137 215L1146.4 211.4Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><path d="M1330 202L1333.6 211.4L1343 215L1333.6 218.6L1330 228L1326.4 218.6L1317 215L1326.4 211.4Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><text x="1150" y="310" font-size="52" font-weight="700" fill="#5C4520" text-anchor="middle">RNP</text><rect x="850" y="350" width="600" height="108" rx="14" fill="#FFFFFF" stroke="#D2BC93" stroke-width="3"/><text x="882" y="400" font-size="30" font-weight="700" fill="#231F1A">Capacidad de navegación</text><text x="882" y="434" font-size="22" fill="#6F665B" font-style="italic">navigation capability</text><rect x="850" y="478" width="600" height="108" rx="14" fill="#FFFFFF" stroke="#D2BC93" stroke-width="3"/><text x="882" y="528" font-size="30" font-weight="700" fill="#231F1A">Control de la performance a bordo</text><text x="882" y="562" font-size="22" fill="#6F665B" font-style="italic">on-board performance monitoring</text><rect x="850" y="606" width="600" height="108" rx="14" fill="#5C4520"/><text x="946" y="656" font-size="30" font-weight="700" fill="#FFFFFF">Alerta a la tripulación</text><text x="946" y="690" font-size="22" fill="#E9DDC7" font-style="italic">alerting</text><path d="M902 638L928.4 681.2L875.6 681.2Z" fill="#FBEBD2" stroke-linejoin="round"/><text x="902" y="676.9" font-size="30" font-weight="700" fill="#5C4520" text-anchor="middle">!</text><text x="800" y="800" font-size="34" font-weight="700" fill="#5C4520" text-anchor="middle">La diferencia no es el número: es el aviso.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-05</text>
