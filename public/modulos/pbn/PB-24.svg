<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Una autorización que cambia el procedimiento</title>
<desc id="desc">Diagrama de flujo vertical con siete cajas: autorización del ATC, entender, colacionar, seleccionar o modificar el FMS, contrastar, ejecutar y vigilar. Junto a contrastar, tres preguntas: a qué punto exactamente, qué restricciones sobreviven y si sigue enganchada la aproximación. Una flecha vuelve de vigilar al principio: cada cambio del ATC reinicia el flujo.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="940" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Una autorización que cambia el procedimiento</text>
<text x="56" y="124" font-size="24" fill="#6F665B">No se programa y se ejecuta: en el medio hay un contraste</text>
<rect x="420" y="160" width="520" height="80" rx="14" fill="#E9DDC7" stroke="#8F7343" stroke-width="3"/><text x="680" y="210" font-size="26" font-weight="700" fill="#5C4520" text-anchor="middle">AUTORIZACIÓN DEL ATC</text><path d="M680 242L680 260" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="420" y="266" width="520" height="80" rx="14" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="680" y="316" font-size="26" font-weight="700" fill="#5C4520" text-anchor="middle">ENTENDER</text><path d="M680 348L680 366" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="420" y="372" width="520" height="80" rx="14" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="680" y="422" font-size="26" font-weight="700" fill="#5C4520" text-anchor="middle">COLACIONAR</text><path d="M680 454L680 472" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="420" y="478" width="520" height="80" rx="14" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="680" y="528" font-size="26" font-weight="700" fill="#5C4520" text-anchor="middle">SELECCIONAR O MODIFICAR EL FMS</text><path d="M680 560L680 578" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="420" y="584" width="520" height="80" rx="14" fill="#5C4520"/><text x="680" y="634" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTRASTAR</text><path d="M680 666L680 684" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="420" y="690" width="520" height="80" rx="14" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="680" y="740" font-size="26" font-weight="700" fill="#5C4520" text-anchor="middle">EJECUTAR</text><path d="M680 772L680 790" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="420" y="796" width="520" height="80" rx="14" fill="#FFFFFF" stroke="#8F7343" stroke-width="3"/><text x="680" y="846" font-size="26" font-weight="700" fill="#5C4520" text-anchor="middle">VIGILAR</text><path d="M420 836L350 836L350 200L412 200" fill="none" stroke="#8F7343" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 9" marker-end="url(#f-acento2)"/><text x="324" y="500" font-size="24" font-weight="700" fill="#5C4520" text-anchor="end"><tspan x="324" dy="0">Cada cambio</tspan><tspan x="324" dy="30">del ATC reinicia</tspan><tspan x="324" dy="30">el flujo.</tspan></text><path d="M940 624L1000 624" fill="none" stroke="#5C4520" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1000" y="524" width="480" height="200" rx="14" fill="#F3EDE1"/><circle cx="1032" cy="574" r="6" fill="#5C4520"/><text x="1050" y="582" font-size="24" font-weight="700" fill="#5C4520">¿A qué punto, exactamente?</text><circle cx="1032" cy="630" r="6" fill="#5C4520"/><text x="1050" y="638" font-size="24" font-weight="700" fill="#5C4520">¿Qué restricciones sobreviven?</text><circle cx="1032" cy="686" r="6" fill="#5C4520"/><text x="1050" y="694" font-size="24" font-weight="700" fill="#5C4520">¿Sigue enganchada la aproximación?</text>
<text x="1560" y="916" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-24</text>
</svg>
