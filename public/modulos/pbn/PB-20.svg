<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Tres datos de la base de navegación</title>
<desc id="desc">Recreación de una página genérica de estado de la base de datos de navegación: NAV DATA BASE, ACTIVE con el ciclo 2610, EFFECTIVE FROM 01OCT26 y EFFECTIVE TO 28OCT26. Tres números señalan el ciclo activo, la fecha de entrada en vigor y la fecha de fin.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Tres datos de la base de navegación</text>
<rect x="1059.3" y="54" width="484.7" height="36" rx="18" fill="#F3EDE1"/><text x="1301.6" y="79.2" font-size="20" font-weight="700" fill="#5C4520" text-anchor="middle">Pantalla genérica · no imita a ningún fabricante</text>
<rect x="126" y="176" width="788" height="628" rx="22" fill="#2A2E34"/><rect x="140" y="190" width="760" height="600" rx="10" fill="#161A1F" stroke="#3A4048" stroke-width="2"/><text x="520" y="250" font-family="'Courier New', Courier, monospace" font-size="32" font-weight="700" fill="#E6EAEE" text-anchor="middle">NAV DATA BASE</text><text x="200" y="360" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">ACTIVE</text><text x="200" y="416" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="700" fill="#5BD68F">2610</text><path d="M960 396L340 400" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="400" r="5" fill="#5C4520"/><circle cx="960" cy="396" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="960" y="404.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="200" y="500" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">EFFECTIVE FROM</text><text x="200" y="556" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="700" fill="#5BD68F">01OCT26</text><path d="M960 536L430 540" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="540" r="5" fill="#5C4520"/><circle cx="960" cy="536" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="960" y="544.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="200" y="640" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#9AA3AD">EFFECTIVE TO</text><text x="200" y="696" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="700" fill="#5BD68F">28OCT26</text><path d="M960 676L430 680" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="680" r="5" fill="#5C4520"/><circle cx="960" cy="676" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="960" y="684.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1060" y="200" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1080" cy="246" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="253.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1116" y="254" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">ACTIVE</tspan></text><text x="1116" y="283" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">Qué base está en uso. Se confirma al</tspan><tspan x="1116" dy="27">inicializar el sistema.</tspan></text><circle cx="1080" cy="349" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="356.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1116" y="357" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">EFFECTIVE FROM</tspan></text><text x="1116" y="386" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">Desde cuándo vale. Una base que aún no</tspan><tspan x="1116" dy="27">entró en vigor no es la actual.</tspan></text><circle cx="1080" cy="452" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="459.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1116" y="460" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">EFFECTIVE TO</tspan></text><text x="1116" y="489" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">Hasta cuándo. Si el vuelo cruza esta</tspan><tspan x="1116" dy="27">fecha, se aplica el procedimiento del</tspan><tspan x="1116" dy="27">operador.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-20</text>
