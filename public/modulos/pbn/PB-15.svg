<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Fly-by y fly-over: dos trayectorias distintas</title>
<desc id="desc">Dos paneles con las mismas dos derrotas que se cruzan en un waypoint. En el fly-by, el punto es la estrella sin círculo y la trayectoria empieza a curvar antes del punto, por dentro de la esquina; una cota marca la anticipación, que depende de la velocidad y la altitud. En el fly-over, la estrella va dentro de un círculo y la trayectoria pasa exactamente por encima del punto, curva después y hace una recuperación hasta la derrota siguiente.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Fly-by y fly-over: dos trayectorias distintas</text>
<text x="56" y="124" font-size="24" fill="#6F665B">La simbología del punto dice qué trayectoria espera la carta</text>
<rect x="56" y="160" width="728" height="680" rx="18" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="210" font-size="28" font-weight="700" fill="#5C4520" letter-spacing="1">FLY-BY</text><g transform="translate(0 -60)"><path d="M356.0 800.0L356.0 490.0L736.0 490.0" fill="none" stroke="#A89F94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9"/><path d="M356 800L356 600A110 110 0 0 1 466 490L736 490" fill="none" stroke="#B0198F" stroke-width="6" marker-end="url(#f-magenta)"/><path d="M356 473L360.8 485.2L373 490L360.8 494.8L356 507L351.2 494.8L339 490L351.2 485.2Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><path d="M318 600L318 496" fill="none" stroke="#6F665B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-suave)" marker-start="url(#f-suave)"/><text x="304" y="552" font-size="22" fill="#231F1A" text-anchor="end"><tspan x="304" dy="0">anticipación:</tspan><tspan x="304" dy="27">depende de la velocidad</tspan><tspan x="304" dy="27">y de la altitud</tspan></text><text x="456" y="640" font-size="22" fill="#6F665B"><tspan x="456" dy="0">El giro empieza antes del</tspan><tspan x="456" dy="29">punto y pasa por dentro de la</tspan><tspan x="456" dy="29">esquina.</tspan></text><text x="326" y="468" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end">WPT</text></g><rect x="816" y="160" width="728" height="680" rx="18" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="844" y="210" font-size="28" font-weight="700" fill="#5C4520" letter-spacing="1">FLY-OVER</text><g transform="translate(0 -60)"><path d="M1116.0 800.0L1116.0 490.0L1496.0 490.0" fill="none" stroke="#A89F94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9"/><path d="M1116 800C1116 763.3 1116 631.7 1116 580C1116 528.3 1115.3 511.7 1116 490C1116.7 468.3 1114.2 463.3 1120 450C1125.8 436.7 1135.8 418.7 1151 410C1166.2 401.3 1191.8 396 1211 398C1230.2 400 1248.5 410 1266 422C1283.5 434 1300.2 458.7 1316 470C1331.8 481.3 1344.3 486.7 1361 490C1377.7 493.3 1393.5 490 1416 490C1438.5 490 1482.7 490 1496 490" fill="none" stroke="#B0198F" stroke-width="6" marker-end="url(#f-magenta)"/><circle cx="1116" cy="490" r="18.8" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5"/><path d="M1116 475L1120.2 485.8L1131 490L1120.2 494.2L1116 505L1111.8 494.2L1101 490L1111.8 485.8Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><text x="1216" y="640" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Se sobrevuela el punto y el</tspan><tspan x="1216" dy="29">giro empieza después, con</tspan><tspan x="1216" dy="29">una recuperación hasta la</tspan><tspan x="1216" dy="29">derrota siguiente.</tspan></text><text x="1086" y="468" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end">WPT</text></g>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-15</text>
</svg>
