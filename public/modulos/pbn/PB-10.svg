<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La caja de mínimos no es un menú</title>
<desc id="desc">Recreación de una caja de mínimos de una aproximación RNP con cuatro líneas y columnas por categoría de aeronave A, B, C y D. LPV con DA 1450 (250) y 750 m; LNAV/VNAV con DA 1560 (360) y 1200 m; LNAV con MDA 1620 (420); y circuito, con MDA de 1620 a 1900 según la categoría. Cuatro números señalan cada línea. Las cifras son ilustrativas.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La caja de mínimos no es un menú</text>
<text x="56" y="124" font-size="24" fill="#6F665B">A cada línea se llega por una capacidad concreta del avión y del operador</text>
<rect x="1093.7" y="54" width="450.3" height="36" rx="18" fill="#F3EDE1"/><text x="1318.8" y="79.2" font-size="20" font-weight="700" fill="#5C4520" text-anchor="middle">Recreación educativa · no es una carta real</text>
<rect x="56" y="170" width="1074" height="650" rx="3" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><text x="84" y="236" font-size="22" font-weight="700" fill="#6F665B" letter-spacing="1.5">MÍNIMOS</text><text x="84" y="796" font-size="20" fill="#6F665B">DA o MDA en ft, altura entre paréntesis; debajo, la visibilidad</text><text x="390" y="236" font-size="24" font-weight="700" fill="#231F1A" text-anchor="middle">CAT A</text><text x="600" y="236" font-size="24" font-weight="700" fill="#231F1A" text-anchor="middle">CAT B</text><text x="805" y="236" font-size="24" font-weight="700" fill="#231F1A" text-anchor="middle">CAT C</text><text x="1010" y="236" font-size="24" font-weight="700" fill="#231F1A" text-anchor="middle">CAT D</text><path d="M56 280L1130 280" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="130" y="336" font-size="28" font-weight="700" fill="#231F1A">LPV</text><text x="130" y="370" font-size="22" font-weight="700" fill="#6F665B">DA</text><text x="715" y="336" font-size="28" fill="#231F1A" text-anchor="middle">1450 (250)</text><text x="715" y="370" font-size="24" fill="#6F665B" text-anchor="middle">750 m</text><path d="M310 328L560 328" fill="none" stroke="#D2BC93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><path d="M870 328L1100 328" fill="none" stroke="#D2BC93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><circle cx="92" cy="338" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="92" y="345.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M56 398L1130 398" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="130" y="454" font-size="28" font-weight="700" fill="#231F1A">LNAV/VNAV</text><text x="130" y="488" font-size="22" font-weight="700" fill="#6F665B">DA</text><text x="715" y="454" font-size="28" fill="#231F1A" text-anchor="middle">1560 (360)</text><text x="715" y="488" font-size="24" fill="#6F665B" text-anchor="middle">1200 m</text><path d="M310 446L560 446" fill="none" stroke="#D2BC93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><path d="M870 446L1100 446" fill="none" stroke="#D2BC93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><circle cx="92" cy="456" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="92" y="463.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M56 516L1130 516" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="130" y="572" font-size="28" font-weight="700" fill="#231F1A">LNAV</text><text x="130" y="606" font-size="22" font-weight="700" fill="#6F665B">MDA</text><text x="390" y="572" font-size="26" fill="#231F1A" text-anchor="middle">1620 (420)</text><text x="390" y="606" font-size="22" fill="#6F665B" text-anchor="middle">1200 m</text><text x="600" y="572" font-size="26" fill="#231F1A" text-anchor="middle">1620 (420)</text><text x="600" y="606" font-size="22" fill="#6F665B" text-anchor="middle">1200 m</text><text x="805" y="572" font-size="26" fill="#231F1A" text-anchor="middle">1620 (420)</text><text x="805" y="606" font-size="22" fill="#6F665B" text-anchor="middle">1600 m</text><text x="1010" y="572" font-size="26" fill="#231F1A" text-anchor="middle">1620 (420)</text><text x="1010" y="606" font-size="22" fill="#6F665B" text-anchor="middle">1600 m</text><circle cx="92" cy="574" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="92" y="581.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M56 634L1130 634" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="130" y="690" font-size="28" font-weight="700" fill="#231F1A">CIRCLING</text><text x="130" y="724" font-size="22" font-weight="700" fill="#6F665B">MDA</text><text x="390" y="690" font-size="26" fill="#231F1A" text-anchor="middle">1620 (420)</text><text x="390" y="724" font-size="22" fill="#6F665B" text-anchor="middle">1900 m</text><text x="600" y="690" font-size="26" fill="#231F1A" text-anchor="middle">1700 (500)</text><text x="600" y="724" font-size="22" fill="#6F665B" text-anchor="middle">2800 m</text><text x="805" y="690" font-size="26" fill="#231F1A" text-anchor="middle">1800 (600)</text><text x="805" y="724" font-size="22" fill="#6F665B" text-anchor="middle">3700 m</text><text x="1010" y="690" font-size="26" fill="#231F1A" text-anchor="middle">1900 (700)</text><text x="1010" y="724" font-size="22" fill="#6F665B" text-anchor="middle">4600 m</text><circle cx="92" cy="692" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="92" y="699.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1160" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1180" cy="236" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1216" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">LPV</tspan></text><text x="1216" y="273" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Exige aumentación satelital</tspan><tspan x="1216" dy="27">aprobada. Se vuela a DA.</tspan></text><circle cx="1180" cy="339" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="346.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1216" y="347" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">LNAV/VNAV</tspan></text><text x="1216" y="376" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Guía vertical, normalmente</tspan><tspan x="1216" dy="27">Baro-VNAV. DA, con límite de</tspan><tspan x="1216" dy="27">temperatura.</tspan></text><circle cx="1180" cy="469" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="476.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1216" y="477" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">LNAV</tspan></text><text x="1216" y="506" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Solo lateral, a MDA. Es adonde</tspan><tspan x="1216" dy="27">se baja si falta la guía vertical.</tspan></text><circle cx="1180" cy="572" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="579.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1216" y="580" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">CIRCLING</tspan></text><text x="1216" y="609" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Nunca más bajo que la LNAV</tspan><tspan x="1216" dy="27">directa.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-10</text>
</svg>
