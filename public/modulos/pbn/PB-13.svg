<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Lo que permite RNP AR, y lo que cuesta</title>
<desc id="desc">Dos vistas en planta del mismo valle entre dos cerros, con la pista al fondo. A la izquierda, RNP APCH: una final recta y larga alineada con la pista, con una franja ancha, área primaria y zona secundaria a cada lado. A la derecha, RNP AR APCH, con el rótulo authorization required: la trayectoria rodea el cerro con un tramo RF de radio constante y entra al valle con una franja mucho más estrecha y sin zona secundaria, porque el área lateral de evaluación de obstáculos es 2 veces el valor RNP.</desc>
