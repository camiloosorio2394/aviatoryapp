<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Lo que permite RNP AR, y lo que cuesta</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Más precisión permite trayectorias curvas y estrechas; a cambio, desaparece el colchón lateral</text>
