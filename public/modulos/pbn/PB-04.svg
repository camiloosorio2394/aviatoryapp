<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">PBN no es GPS, y el TAWS no es PBN</title>
<desc id="desc">Diagrama radial. En el centro, PBN, concepto de navegación basada en performance. A su alrededor, cuatro fuentes de posición unidas al centro: GNSS, DME/DME, DME/DME/IRU y VOR/DME. Aparte, al otro lado de una línea de puntos, el TAWS, alerta de terreno: un sistema distinto, con otro propósito.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">PBN no es GPS, y el TAWS no es PBN</text>
<text x="56" y="124" font-size="24" fill="#6F665B">El GNSS es una fuente de posición entre varias; el TAWS avisa del terreno</text>
<path d="M620 500L414.93903345590127 294.9390334559012" fill="none" stroke="#D2BC93" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 500L825.0609665440988 294.93903345590127" fill="none" stroke="#D2BC93" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 500L825.0609665440988 705.0609665440987" fill="none" stroke="#D2BC93" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 500L414.93903345590127 705.0609665440988" fill="none" stroke="#D2BC93" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="500" r="150" fill="#5C4520"/><text x="620" y="488" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">PBN</text><text x="620" y="534" font-size="22" fill="#F3EDE1" text-anchor="middle"><tspan x="620" dy="0">concepto de navegación</tspan><tspan x="620" dy="28">basada en performance</tspan></text><circle cx="414.93903345590127" cy="294.9390334559012" r="98" fill="#FFFFFF" stroke="#8F7343" stroke-width="4"/><text x="414.9" y="290.9" font-size="28" font-weight="700" fill="#5C4520" text-anchor="middle">GNSS</text><text x="414.9" y="324.9" font-size="20" fill="#6F665B" text-anchor="middle">fuente de posición</text><circle cx="825.0609665440988" cy="294.93903345590127" r="98" fill="#FFFFFF" stroke="#8F7343" stroke-width="4"/><text x="825.1" y="290.9" font-size="28" font-weight="700" fill="#5C4520" text-anchor="middle">DME/DME</text><text x="825.1" y="324.9" font-size="20" fill="#6F665B" text-anchor="middle">fuente de posición</text><circle cx="825.0609665440988" cy="705.0609665440987" r="98" fill="#FFFFFF" stroke="#8F7343" stroke-width="4"/><text x="825.1" y="701.1" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle">DME/DME/IRU</text><text x="825.1" y="735.1" font-size="20" fill="#6F665B" text-anchor="middle">fuente de posición</text><circle cx="414.93903345590127" cy="705.0609665440988" r="98" fill="#FFFFFF" stroke="#8F7343" stroke-width="4"/><text x="414.9" y="701.1" font-size="28" font-weight="700" fill="#5C4520" text-anchor="middle">VOR/DME</text><text x="414.9" y="735.1" font-size="20" fill="#6F665B" text-anchor="middle">fuente de posición</text><path d="M1070 190L1070 830" fill="none" stroke="#A89F94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 12"/><rect x="1150" y="410" width="360" height="180" rx="16" fill="#EEEAE4" stroke="#A89F94" stroke-width="3"/><text x="1330" y="480" font-size="44" font-weight="700" fill="#231F1A" text-anchor="middle">TAWS</text><text x="1330" y="528" font-size="26" fill="#6F665B" text-anchor="middle">alerta de terreno</text><text x="1330" y="640" font-size="26" font-weight="700" fill="#231F1A" text-anchor="middle">Sistema distinto,</text><text x="1330" y="674" font-size="26" font-weight="700" fill="#231F1A" text-anchor="middle">propósito distinto.</text><text x="1330" y="300" font-size="22" font-weight="700" fill="#A89F94" text-anchor="middle" letter-spacing="1.5">FUERA DEL CONCEPTO</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-04</text>
</svg>
