<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Qué significa el número en RNP 1</title>
<desc id="desc">Vista en planta de un tramo de ruta. La trayectoria publicada va en magenta por el centro, rotulada CENTERLINE. A cada lado, a 1 NM, una línea de puntos. Un avión algo desplazado del eje, dentro de la franja, rotulado posición real. Al pie: el valor es un requisito de performance del sistema, conseguido al menos el 95 % del tiempo, y la expectativa operacional sigue siendo mantener el eje.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Qué significa el número en RNP 1</text>
<text x="56" y="124" font-size="24" fill="#6F665B">No es una banda de trabajo ni un permiso para desviarse</text>
<rect x="100" y="290" width="1400" height="300" fill="#F3EDE1"/><path d="M100 290L1500 290" fill="none" stroke="#8F7343" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 10"/><path d="M100 590L1500 590" fill="none" stroke="#8F7343" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 10"/><path d="M100 440L1500 440" fill="none" stroke="#B0198F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-magenta)"/><text x="130" y="424" font-size="24" font-weight="700" fill="#B0198F">CENTERLINE · trayectoria publicada</text><path d="M1400 434L1400 296" fill="none" stroke="#6F665B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-suave)" marker-start="url(#f-suave)"/><path d="M1400 446L1400 584" fill="none" stroke="#6F665B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-suave)" marker-start="url(#f-suave)"/><text x="1420" y="374" font-size="28" font-weight="700" fill="#231F1A">1 NM</text><text x="1420" y="524" font-size="28" font-weight="700" fill="#231F1A">1 NM</text><rect x="741.7" y="224" width="116.7" height="44" rx="22" fill="#5C4520"/><text x="800" y="256.1" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">RNP 1</text><path d="M0 -30C3 -30 4 -26 4 -20L4 -6L30 6L30 11L4 5L4 18L11 24L11 28L0 25.5L-11 28L-11 24L-4 18L-4 5L-30 11L-30 6L-4 -6L-4 -20C-4 -26 -3 -30 0 -30Z" fill="#231F1A" transform="translate(760 368) rotate(90) scale(1.4)"/><path d="M840 370L840 434" fill="none" stroke="#6F665B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-suave)" marker-start="url(#f-suave)"/><text x="700" y="376" font-size="24" font-weight="700" fill="#231F1A" text-anchor="end">posición real</text><rect x="160" y="660" width="1280" height="150" rx="16" fill="#FFFFFF" stroke="#D2BC93" stroke-width="3"/><text x="800" y="722" font-size="28" fill="#231F1A" text-anchor="middle"><tspan x="800" dy="0">El valor es un requisito de performance del sistema, conseguido al menos el 95 % del tiempo.</tspan><tspan x="800" dy="44">La expectativa operacional sigue siendo mantener el eje.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-06</text>
