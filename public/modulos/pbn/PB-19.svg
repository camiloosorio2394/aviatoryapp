<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Cuando la performance estimada ya no alcanza</title>
<desc id="desc">Dos escenarios con la misma trayectoria y el mismo límite requerido. Arriba, la incertidumbre de posición estimada cabe dentro del límite y el indicador dice normal. Abajo, la incertidumbre es más ancha que el límite: el avión se ve sobre la trayectoria, pero el indicador dice alerta. Al pie, la secuencia de actuación en siete pasos: reconocer, volar el avión, contrastar la posición, QRH y SOP, qué capacidad queda, si se cumple lo exigido e informar al ATC.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="960" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Cuando la performance estimada ya no alcanza</text>
<text x="56" y="124" font-size="24" fill="#6F665B">El avión puede verse sobre la trayectoria y aun así no cumplir: eso es lo que avisa la alerta</text>
<rect x="56" y="156" width="1488" height="272" rx="16" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="200" font-size="22" font-weight="700" fill="#5C4520" letter-spacing="1">PERFORMANCE ESTIMADA DENTRO DEL LÍMITE REQUERIDO</text><path d="M120 246L1180 246" fill="none" stroke="#8F7343" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 386L1180 386" fill="none" stroke="#8F7343" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1180" y="234" font-size="20" fill="#8F7343" text-anchor="end">límite requerido</text><path d="M120 316L1180 316" fill="none" stroke="#B0198F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-magenta)"/><circle cx="660" cy="316" r="38" fill="#8F7343" opacity="0.14" stroke="#8F7343" stroke-width="3" stroke-dasharray="none"/><path d="M0 -30C3 -30 4 -26 4 -20L4 -6L30 6L30 11L4 5L4 18L11 24L11 28L0 25.5L-11 28L-11 24L-4 18L-4 5L-30 11L-30 6L-4 -6L-4 -20C-4 -26 -3 -30 0 -30Z" fill="#231F1A" transform="translate(660 316) rotate(90) scale(1.1)"/><text x="712" y="356" font-size="20" fill="#6F665B">incertidumbre estimada</text><rect x="1266.3" y="294" width="187.4" height="44" rx="22" fill="#DDEFE3"/><text x="1360" y="326.1" font-size="28" font-weight="700" fill="#2E7A4B" text-anchor="middle">NORMAL</text><rect x="56" y="446" width="1488" height="272" rx="16" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="490" font-size="22" font-weight="700" fill="#5C4520" letter-spacing="1">LA PERFORMANCE ESTIMADA YA NO SATISFACE LA REQUERIDA</text><path d="M120 536L1180 536" fill="none" stroke="#8F7343" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 676L1180 676" fill="none" stroke="#8F7343" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1180" y="524" font-size="20" fill="#8F7343" text-anchor="end">límite requerido</text><path d="M120 606L1180 606" fill="none" stroke="#B0198F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-magenta)"/><circle cx="660" cy="606" r="108" fill="#A86400" opacity="0.14" stroke="#A86400" stroke-width="3" stroke-dasharray="6 8"/><path d="M0 -30C3 -30 4 -26 4 -20L4 -6L30 6L30 11L4 5L4 18L11 24L11 28L0 25.5L-11 28L-11 24L-4 18L-4 5L-30 11L-30 6L-4 -6L-4 -20C-4 -26 -3 -30 0 -30Z" fill="#231F1A" transform="translate(660 606) rotate(90) scale(1.1)"/><text x="782" y="646" font-size="20" fill="#A86400">incertidumbre estimada</text><rect x="1268.7" y="584" width="182.6" height="44" rx="22" fill="#FBEBD2"/><text x="1360" y="616.1" font-size="28" font-weight="700" fill="#A86400" text-anchor="middle">ALERTA</text><rect x="56" y="744" width="196" height="104" rx="12" fill="#F3EDE1"/><text x="72" y="776" font-size="20" font-weight="700" fill="#8F7343">1</text><text x="154" y="800" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="154" dy="0">Reconocer</tspan><tspan x="154" dy="27">la alerta</tspan></text><rect x="268" y="744" width="196" height="104" rx="12" fill="#F3EDE1"/><text x="284" y="776" font-size="20" font-weight="700" fill="#8F7343">2</text><text x="366" y="800" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="366" dy="0">Volar</tspan><tspan x="366" dy="27">el avión</tspan></text><rect x="480" y="744" width="196" height="104" rx="12" fill="#F3EDE1"/><text x="496" y="776" font-size="20" font-weight="700" fill="#8F7343">3</text><text x="578" y="800" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="578" dy="0">Contrastar</tspan><tspan x="578" dy="27">la posición</tspan></text><rect x="692" y="744" width="196" height="104" rx="12" fill="#F3EDE1"/><text x="708" y="776" font-size="20" font-weight="700" fill="#8F7343">4</text><text x="790" y="800" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="790" dy="0">QRH</tspan><tspan x="790" dy="27">y SOP</tspan></text><rect x="904" y="744" width="196" height="104" rx="12" fill="#F3EDE1"/><text x="920" y="776" font-size="20" font-weight="700" fill="#8F7343">5</text><text x="1002" y="800" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="1002" dy="0">Qué capacidad</tspan><tspan x="1002" dy="27">queda</tspan></text><rect x="1116" y="744" width="196" height="104" rx="12" fill="#5C4520"/><text x="1132" y="776" font-size="20" font-weight="700" fill="#E9DDC7">6</text><text x="1214" y="800" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1214" dy="0">¿Se cumple</tspan><tspan x="1214" dy="27">lo exigido?</tspan></text><rect x="1328" y="744" width="196" height="104" rx="12" fill="#F3EDE1"/><text x="1344" y="776" font-size="20" font-weight="700" fill="#8F7343">7</text><text x="1426" y="800" font-size="22" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="1426" dy="0">Informar</tspan><tspan x="1426" dy="27">al ATC</tspan></text><text x="56" y="896" font-size="22" fill="#6F665B">El paso 6 es el que se contesta en el briefing: hay que saber antes qué exige el procedimiento.</text>
<text x="1560" y="936" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-19</text>
