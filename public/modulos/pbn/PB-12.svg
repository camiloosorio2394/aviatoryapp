<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Volar a una MDA: escalera o descenso continuo</title>
<desc id="desc">Dos perfiles del FAF al umbral. Arriba, la escalera: la trayectoria baja a cada altitud mínima, nivela y llega a la MDA en vuelo nivelado y largo, con las nivelaciones marcadas en rojo. Abajo, el descenso continuo (CDFA): un solo trazo desde el FAF que pasa por encima de cada altitud mínima y llega a la MDA en el punto de descenso visual, marcado (V); la MDA no se cruza sin referencia visual, y la senda de asesoramiento no da franqueamiento por debajo de ella.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="1060" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Volar a una MDA: escalera o descenso continuo</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Una MDA no es una DA: por debajo de ella solo se baja viendo</text>
<rect x="56" y="160" width="1488" height="420" rx="18" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="206" font-size="26" font-weight="700" fill="#5C4520" letter-spacing="1">ESCALERA</text><path d="M76 520L1524 520" fill="none" stroke="#C9B797" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1300" y="513" width="200" height="9" fill="#231F1A"/><path d="M220 270L220 520" fill="none" stroke="#6F665B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8"/><text x="220" y="552" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">FAF</text><path d="M520 350L520 520" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8"/><path d="M470 350L570 350" fill="none" stroke="#6F665B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="512" y="376" font-size="20" fill="#6F665B" text-anchor="end">altitud mínima</text><path d="M820 416L820 520" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8"/><path d="M770 416L870 416" fill="none" stroke="#6F665B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="812" y="442" font-size="20" fill="#6F665B" text-anchor="end">altitud mínima</text><path d="M96 456L1340 456" fill="none" stroke="#231F1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 8"/><text x="104" y="446" font-size="22" font-weight="700" fill="#231F1A">MDA</text><path d="M120.0 270.0L220.0 270.0" fill="none" stroke="#231F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M220.0 270.0L290.0 350.0" fill="none" stroke="#231F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M290.0 350.0L520.0 350.0" fill="none" stroke="#B3372B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><path d="M520.0 350.0L5