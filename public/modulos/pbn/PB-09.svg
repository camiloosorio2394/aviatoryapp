IR</text><path d="M300 455L304.2 465.8L315 470L304.2 474.2L300 485L295.8 474.2L285 470L295.8 465.8Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="440" font-size="22" font-weight="700" fill="#6F665B" text-anchor="middle">IWP</text><text x="300" y="514" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">BOLTE</text><path d="M450 455L454.2 465.8L465 470L454.2 474.2L450 485L445.8 474.2L435 470L445.8 465.8Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><text x="450" y="440" font-size="22" font-weight="700" fill="#6F665B" text-anchor="middle">IF</text><text x="450" y="514" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">CUREN</text><path d="M610 455L614.2 465.8L625 470L614.2 474.2L610 485L605.8 474.2L595 470L605.8 465.8Z" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5" stroke-linejoin="round"/><text x="610" y="440" font-size="22" font-weight="700" fill="#6F665B" text-anchor="middle">FAF</text><text x="610" y="514" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">DAMOX</text><text x="860" y="514" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">RWY 09</text><path d="M100 700L1100 700" fill="none" stroke="#6F665B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="810" y="694" width="90" height="8" fill="#231F1A"/><path d="M300 590L610 590L810 686" fill="none" stroke="#231F1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 578L610 700" fill="none" stroke="#6F665B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="610" y="572" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">FAF · 3000</text><path d="M700 664L900 664" fill="none" stroke="#231F1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="910" y="670" font-size="22" font-weight="700" fill="#231F1A">DA</text><path d="M762 664L850 604" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#f-tinta)"/><text x="700" y="626" font-size="22" fill="#6F665B">3.0°</text><path d="M56 720L1130 720" fill="none" stroke="#231F1A" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/><text x="84" y="756" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1">MÍNIMOS</text><text x="84" y="800" font-size="24" font-weight="700" fill="#231F1A">LPV</text><text x="270" y="800" font-size="24" fill="#231F1A">DA 1450 (250)</text><text x="500" y="800" font-size="24" fill="#231F1A">750 m</text><text x="84" y="848" font-size="24" font-weight="700" fill="#231F1A">LNAV/VNAV</text><text x="270" y="848" font-size="24" fill="#231F1A">DA 1560 (360)</text><text x="500" y="848" font-size="24" fill="#231F1A">1200 m</text><text x="84" y="896" font-size="24" font-weight="700" fill="#231F1A">LNAV</text><text x="270" y="896" font-size="24" fill="#231F1A">MDA 1620 (420)</text><text x="500" y="896" font-size="24" fill="#231F1A">1600 m</text><path d="M620 720L620 960" fill="none" stroke="#231F1A" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/><text x="644" y="756" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1">NOTAS</text><text x="644" y="796" font-size="22" fill="#231F1A"><tspan x="644" dy="0">1. Baro-VNAV no autorizado fuera</tspan><tspan x="644" dy="32">de los límites de temperatura</tspan><tspan x="644" dy="32">publicados.</tspan><tspan x="644" dy="32">2. Ajuste altimétrico: QNH local.</tspan></text><path d="M360 192L326 192" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="326" cy="192" r="5" fill="#5C4520"/><circle cx="360" cy="192" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="360" y="200.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M700 214L740 214" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="740" cy="214" r="5" fill="#5C4520"/><circle cx="700" cy="214" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="700" y="222.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M690 370L620 456" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="456" r="5" fill="#5C4520"/><circle cx="690" cy="370" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="690" y="378.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M980 560L960 474" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="960" cy="474" r="5" fill="#5C4520"/><circle cx="980" cy="560" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="980" y="568.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M236 750L196 750" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="196" cy="750" r="5" fill="#5C4520"/><circle cx="236" cy="750" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="236" y="758.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M770 750L730 750" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="730" cy="750" r="5" fill="#5C4520"/><circle cx="770" cy="750" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="770" y="758.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="1160" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1180" cy="236" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1216" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Título</tspan></text><text x="1216" y="273" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Sigue la convención de quien</tspan><tspan x="1216" dy="27">publica; no dice solo qué exige.</tspan></text><circle cx="1180" cy="339" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="346.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1216" y="347" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Recuadro PBN</tspan></text><text x="1216" y="376" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Especificación, sensores y valor</tspan><tspan x="1216" dy="27">RNP mínimo. Obligatorio.</tspan></text><circle cx="1180" cy="442" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="449.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1216" y="450" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">FAF</tspan></text><text x="1216" y="479" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">A 2 NM de aquí, el sistema ya</tspan><tspan x="1216" dy="27">está en modo aproximación.</tspan></text><circle cx="1180" cy="545" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="552.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1216" y="553" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Frustrada</tspan></text><text x="1216" y="582" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Tiene su propio requisito de</tspan><tspan x="1216" dy="27">navegación.</tspan></text><circle cx="1180" cy="648" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="655.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1216" y="656" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Mínimos</tspan></text><text x="1216" y="685" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Cada línea pide una capacidad</tspan><tspan x="1216" dy="27">del avión y del operador.</tspan></text><circle cx="1180" cy="751" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="758.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="1216" y="759" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Notas</tspan></text><text x="1216" y="788" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Aquí están las limitaciones,</tspan><tspan x="1216" dy="27">como la de temperatura.</tspan></text>
<text x="1560" y="976" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-09</text>
