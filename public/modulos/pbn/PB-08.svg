<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Dónde mirar en una SID PBN</title>
<desc id="desc">Recreación de una carta de salida RNAV. Arriba a la derecha, dos recuadros apilados: el recuadro PBN, con RNAV 1 y los sensores admitidos, y debajo el de equipo requerido. En planta, la pista 09 y cuatro waypoints de nombre ficticio unidos por la derrota, con sus rumbos, dos restricciones de altitud y una de velocidad. Cinco números señalan el recuadro PBN, el de equipo, un punto fly-by, una restricción de altitud y la derrota entre dos puntos.</desc>
