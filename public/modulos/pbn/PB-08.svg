oke-linejoin="round"/><circle cx="780" cy="222" r="5" fill="#5C4520"/><circle cx="740" cy="222" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="740" y="230.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M740 330L780 330" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="780" cy="330" r="5" fill="#5C4520"/><circle cx="740" cy="330" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="740" y="338.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M470 600L528 650" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="528" cy="650" r="5" fill="#5C4520"/><circle cx="470" cy="600" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="470" y="608.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M720 760L660 736" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="660" cy="736" r="5" fill="#5C4520"/><circle cx="720" cy="760" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="720" y="768.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M780 560L725 478" fill="none" stroke="#5C4520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="725" cy="478" r="5" fill="#5C4520"/><circle cx="780" cy="560" r="22" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="780" y="568.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1160" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1180" cy="236" r="20" fill="#5C4520" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1216" y="2