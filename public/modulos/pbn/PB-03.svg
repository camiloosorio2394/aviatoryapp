<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Tres piezas que tienen que estar a la vez</title>
<desc id="desc">Tres engranajes encajados. El primero es la aplicación de navegación: la SID, la STAR, la ruta o la aproximación. El segundo, la especificación para la navegación: lo que deben cumplir el avión y la tripulación. El tercero, la infraestructura: GNSS, DME y VOR, que se revisa en los NOTAM. Debajo, la regla: si falta una, el procedimiento no se vuela como está publicado.</desc>
