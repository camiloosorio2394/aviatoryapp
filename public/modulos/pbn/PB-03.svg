526.3L1002.6 498.6L977.0 500.0L969.1 476.8L990.4 462.4L987.0 430.0L963.3 420.2L966.2 395.9L991.6 392.1L1002.6 361.4L985.5 342.3L998.7 321.7L1023.3 329.3L1046.5 306.5L1039.3 281.8L1060.2 269.0L1079.0 286.4L1109.8 276.0L1114.1 250.6L1138.5 248.1L1147.8 272.0L1180.2 276.0L1195.0 255.0L1218.0 263.3L1216.1 288.9L1243.5 306.5L1266.0 294.0L1283.1 311.5L1270.3 333.7L1287.4 361.4L1313.0 360.0L1320.9 383.2L1299.6 397.6Z" fill="#E9DDC7" stroke="#5C4520" stroke-width="3" stroke-linejoin="round"/><circle cx="1145" cy="430" r="132" fill="#FFFFFF" stroke="#D2BC93" stroke-width="2"/><text x="455" y="423" font-size="24" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="455" dy="0">APLICACIÓN</tspan><tspan x="455" dy="30">DE NAVEGACIÓN</tspan></text><text x="455" y="652" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="455" dy="0">La SID, la STAR, la ruta, la</tspan><tspan x="455" dy="31">aproximación.</tspan></text><text x="800" y="438" font-size="24" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="800" dy="0">ESPECIFICACIÓN</tspan><tspan x="800" dy="30">PARA LA</tspan><tspan x="800" dy="30">NAVEGACIÓN</tspan></text><text x="800" y="682" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="800" dy="0">Qué deben cumplir el avión</tspan><tspan x="800" dy="31">y la tripulación.</tspan></text><text x="1145" y="438" font-size="24" font-weight="700" fill="#5C4520" text-anchor="middle"><tspan x="1145" dy="0">INFRAESTRUCTURA</tspan></text><text x="1145" y="652" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="1145" dy="0">GNSS, DME, VOR: las</tspan><tspan x="1145" dy="31">ayudas que están fuera del</tspan><tspan x="1145" dy="31">avión.</tspan></text><text x="1145" y="478" font-size="20" font-weight="700" fill="#A86400" text-anchor="middle"><tspan x="1145" dy="0">No está en la carta:</tspan><tspan x="1145" dy="26">se revisa en los NOTAM</tspan></text><rect x="250" y="760" width="1100" height="76" rx="14" fill="#5C4520"/><text x="800" y="808" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Si falta una, el procedimiento no se vuela como está publicado.</text>
