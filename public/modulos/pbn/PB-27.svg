<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Seleccionar, verificar, ejecutar, vigilar</title>
<desc id="desc">Cuatro bloques en fila, cada uno más oscuro que el anterior: seleccionar, desde la base de datos y nunca a mano; verificar, contra la carta y lo hace otro; ejecutar, el punto sin retorno; y vigilar, la desviación lateral, el progreso, el valor RNP y los avisos. Entre verificar y ejecutar, una barra vertical marca el límite.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5C4520"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8F7343"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="700" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Seleccionar, verificar, ejecutar, vigilar</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Cuatro pasos para gestionar el FMS, con la frontera marcada</text>
<rect x="56" y="300" width="300" height="170" rx="16" fill="#E9DDC7"/><text x="206" y="400" font-size="32" font-weight="700" fill="#5C4520" text-anchor="middle">SELECCIONAR</text><text x="206" y="530" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="206" dy="0">Desde la base de datos,</tspan><tspan x="206" dy="31">nunca a mano.</tspan></text><path d="M366 385L440 385" fill="none" stroke="#5C4520" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="452" y="300" width="300" height="170" rx="16" fill="#D2BC93"/><text x="602" y="400" font-size="32" font-weight="700" fill="#5C4520" text-anchor="middle">VERIFICAR</text><text x="602" y="530" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="602" dy="0">Contra la carta, y lo hace</tspan><tspan x="602" dy="31">otro.</tspan></text><path d="M762 385L836 385" fill="none" stroke="#5C4520" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="848" y="300" width="300" height="170" rx="16" fill="#8F7343"/><text x="998" y="400" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">EJECUTAR</text><text x="998" y="530" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="998" dy="0">El punto sin retorno.</tspan></text><path d="M1158 385L1232 385" fill="none" stroke="#5C4520" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="1244" y="300" width="300" height="170" rx="16" fill="#5C4520"/><text x="1394" y="400" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">VIGILAR</text><text x="1394" y="530" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="1394" dy="0">Desviación lateral,</tspan><tspan x="1394" dy="31">progreso, valor RNP y</tspan><tspan x="1394" dy="31">avisos.</tspan></text><rect x="794" y="230" width="12" height="320" rx="6" fill="#231F1A"/><text x="800" y="212" font-size="24" font-weight="700" fill="#231F1A" text-anchor="middle">EL LÍMITE: nada se ejecuta sin verificar</text>
<text x="1560" y="676" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-27</text>
</svg>
