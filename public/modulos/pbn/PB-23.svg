orm="translate(290 650) rotate(0) scale(1.2)"/><path d="M334 670L486 736" fill="none" stroke="#A86400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-ambar)" marker-start="url(#f-ambar)"/><text x="370" y="790" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#A86400">discrepancia</text><text x="160" y="560" font-size="20" font-weight="700" fill="#A86400"><tspan x="160" dy="0">POSICIÓN SEGÚN DATOS</tspan><tspan x="160" dy="25">CRUDOS Y REPORTE</tspan><tspan x="160" dy="25">DEL ATC</tspan></text><text x="1000" y="210" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">INDICIOS QUE NO CUADRAN</text><rect x="1000" y="240" width="544" height="65" rx="12" fill="#F3EDE1"/><text x="1024" y="280" font-size="24" font-weight="700" fill="#5C4520"><tspan x="1024" dy="0">El reloj del avión</tspan></text><rect x="1000" y="325" width="544" height="65" rx="12" fill="#F3EDE1"/><text x="1024" y="365" font-size="24" font-weight="700" fill="#5C4520"><tspan x="1024" dy="0">El viento y la velocidad respecto al suelo</tspan></text><rect x="1000" y="410" width="544" height="96" rx="12" fill="#F3EDE1"/><text x="1024" y="450" font-size="24" font-weight="700" fill="#5C4520"><tspan x="1024" dy="0">La sintonización automática no</tspan><tspan x="1024" dy="31">selecciona la radioayuda cercana</tspan></text><text x="800" y="900" font-size="34" font-weight="700" fill="#5C4520" text-anchor="middle">¿Tiene sentido la posición que me está mostrando el sistema?</text>
<text x="1560" y="936" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PB-23</text>
