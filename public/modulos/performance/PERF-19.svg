<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Climb limited: la temperatura y la altitud recortan el peso</title>
<desc id="desc">Gráfico con el peso en el eje horizontal y el gradiente del segundo segmento en el vertical. Una línea horizontal fija: gradiente exigido, 2,4 %. Tres líneas descendentes de gradiente disponible: día fresco al nivel del mar, día caliente al nivel del mar y día caliente en altura. Donde cada una cruza la línea exigida hay un punto: ese es el peso máximo para esa condición.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Climb limited: la temperatura y la altitud recortan el peso</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Donde el gradiente disponible cae al exigido, ahí está el peso máximo</text>
<path d="M200 780L1320 780" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><path d="M200 780L200 180" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><text x="1320" y="824" font-size="26" font-weight="700" fill="#231F1A" text-anchor="end">peso</text><text x="180" y="190" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end"><tspan x="180" dy="0">gradiente</tspan><tspan x="180" dy="26">2.º segmento</tspan></text><path d="M200 500L1300 500" fill="none" stroke="#B3372B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 8"/><text x="1300" y="486" font-size="22" font-weight="700" fill="#B3372B" text-anchor="end">gradiente exigido · 2,4 %</text><path d="M220 320L1260 730" fill="none" stroke="#8A4B1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="676.5853658536585" cy="500" r="11" fill="#8A4B1F" stroke="#FFFFFF" stroke-width="3"/><path d="M676.5853658536585 512L676.5853658536585 780" fill="none" stroke="#8A4B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="1272" y="736" font-size="20" font-weight="700" fill="#8A4B1F">día fresco, nivel del mar</text><path d="M220 262L1260 672" fill="none" stroke="#C97B3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="823.7073170731707" cy="500" r="11" fill="#C97B3C" stroke="#FFFFFF" stroke-width="3"/><path d="M823.7073170731707 512L823.7073170731707 780" fill="none" stroke="#C97B3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="1272" y="678" font-size="20" font-weight="700" fill="#C97B3C">día caliente, nivel del mar</text><path d="M220 214L1260 624" fill="none" stroke="#E6BB93" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="945.4634146341463" cy="500" r="11" fill="#E6BB93" stroke="#FFFFFF" stroke-width="3"/><path d="M945.4634146341463 512L945.4634146341463 780" fill="none" stroke="#E6BB93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="1272" y="630" font-size="20" font-weight="700" fill="#E6BB93">día caliente, en altura</text><text x="1350" y="420" font-size="22" fill="#231F1A"><tspan x="1350" dy="0">Cada punto es un</tspan><tspan x="1350" dy="29">peso máximo. La</tspan><tspan x="1350" dy="29">pista no tiene nada</tspan><tspan x="1350" dy="29">que ver.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-19</text>
</svg>
