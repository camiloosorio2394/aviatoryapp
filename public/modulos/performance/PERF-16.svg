" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">margen</text><text x="316" y="723" font-size="20" font-weight="700" fill="#FFFFFF" font-style="italic">Landing Distance Required</text><rect x="300" y="770" width="1160" height="32" rx="4" fill="#A89F94"/><text x="316" y="793" font-size="20" font-weight="700" fill="#FFFFFF" font-style="italic">LDA</text>
