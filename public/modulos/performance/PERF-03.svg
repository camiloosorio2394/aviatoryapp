<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Las cuatro distancias declaradas</title>
<desc id="desc">Vista lateral de una pista con un umbral desplazado al comienzo, la zona de parada a continuación del extremo y la zona libre de obstáculos por encima y más allá. Debajo, cuatro barras: TORA, la pista; TODA, la pista más la zona libre; ASDA, la pista más la zona de parada; y LDA, desde el umbral hasta el extremo.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Las cuatro distancias declaradas</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Dónde empieza y dónde acaba cada una</text>
<rect x="1080" y="210" width="340" height="150" fill="#FBEFE4" stroke="#C97B3C" stroke-width="2.5" stroke-dasharray="10 8"/><text x="1250" y="244" font-size="22" font-weight="700" fill="#8A4B1F" text-anchor="middle" letter-spacing="1">CLEARWAY</text><text x="1250" y="272" font-size="20" fill="#6F665B" text-anchor="middle">zona libre de obstáculos</text><rect x="180" y="360" width="900" height="30" fill="#231F1A"/><rect x="1080" y="360" width="170" height="30" fill="#A89F94"/><path d="M1080 360L1250 390M1120 360L1250 380M1080 376L1210 390" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1165" y="426" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle">STOPWAY</text><rect x="326" y="350" width="8" height="50" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><text x="330" y="338" font-size="20" fill="#6F665B" text-anchor="middle">umbral desplazado</text><text x="630" y="426" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle">PISTA</text><path d="M120 375L170 375" fill="none" stroke="#8A4B1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><path d="M180 390L180 526" fill="none" stroke="#E6BB93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><path d="M1080 390L1080 526" fill="none" stroke="#E6BB93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><rect x="180" y="500" width="900" height="26" rx="4" fill="#8A4B1F"/><text x="196" y="520" font-size="20" font-weight="700" fill="#FFFFFF">TORA · Carrera de despegue: la pista</text><path d="M180 390L180 614" fill="none" stroke="#E6BB93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><path d="M1420 390L1420 614" fill="none" stroke="#E6BB93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><rect x="180" y="588" width="1240" height="26" rx="4" fill="#8A4B1F"/><text x="196" y="608" font-size="20" font-weight="700" fill="#FFFFFF">TODA · Distancia de despegue: pista y clearway</text><path d="M180 390L180 702" fill="none" stroke="#E6BB93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><path d="M1250 390L1250 702" fill="none" stroke="#E6BB93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><rect x="180" y="676" width="1070" height="26" rx="4" fill="#8A4B1F"/><text x="196" y="696" font-size="20" font-weight="700" fill="#FFFFFF">ASDA · Aceleración y parada: pista y stopway</text><path d="M330 390L330 790" fill="none" stroke="#E6BB93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><path d="M1080 390L1080 790" fill="none" stroke="#E6BB93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><rect x="330" y="764" width="750" height="26" rx="4" fill="#C97B3C"/><text x="346" y="784" font-size="20" font-weight="700" fill="#FFFFFF">LDA · Aterrizaje: desde el umbral</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-03</text>
</svg>
