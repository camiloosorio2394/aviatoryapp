<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Drift down sobre una cordillera</title>
<desc id="desc">Perfil de una ruta sobre una cordillera. El avión en crucero a la izquierda, un símbolo de falla de motor, y desde ahí una trayectoria descendente suave, drift down, que se aplana en la altitud de nivelación. Una cota entre esa altitud y la cima más alta. A la derecha, un aeródromo adecuado.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Drift down sobre una cordillera</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Con un motor menos se baja hasta donde el avión se sostiene; el terreno decide la ruta</text>
<path d="M60 800L260 800L420 620L520 690L640 520L760 640L860 580L1000 740L1200 800L1544 800L1544 840L60 840Z" fill="#E3D6BF" stroke="#C9B797" stroke-width="3"/><path d="M80 230L330 230" fill="none" stroke="#8A4B1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 230C520 240 640 380 820 400L1300 400" fill="none" stroke="#8A4B1F" stroke-width="5" stroke-dasharray="16 8"/><g transform="translate(200 222) scale(0.9)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><path d="M340 174L352 192L344 192L350 214L328 190L337 190Z" fill="#B3372B"/><text x="560" y="270" font-size="28" font-weight="700" fill="#8A4B1F" font-style="italic">Drift Down</text><text x="1300" y="384" font-size="22" font-weight="700" fill="#8A4B1F" text-anchor="end">altitud de nivelación</text><path d="M640 406L640 514" fill="none" stroke="#B3372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-rojo)" marker-start="url(#f-rojo)"/><text x="660" y="470" font-size="20" font-weight="700" fill="#B3372B"><tspan x="660" dy="0">margen exigido</tspan><tspan x="660" dy="24">sobre la cima</tspan></text><rect x="1340" y="792" width="160" height="10" fill="#231F1A"/><text x="1420" y="834" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">aeródromo adecuado</text><path d="M1300 400C1380 460 1400 680 1420 788" fill="none" stroke="#8A4B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8" marker-end="url(#f-acento)"/>
