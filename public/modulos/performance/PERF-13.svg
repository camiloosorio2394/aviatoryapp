<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Manda el límite más restrictivo</title>
<desc id="desc">Seis cajas en columna con un peso ficticio cada una: runway limit, climb limit, obstacle limit, brake energy limit, tire speed limit y structural limit. Todas apuntan a una caja final, maximum allowed takeoff weight. La del valor más bajo, obstacle limit con 74 200 kg, va resaltada y es la única cuya flecha llega gruesa.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Manda el límite más restrictivo</text>
<text x="56" y="124" font-size="24" fill="#6F665B">El peso permitido es el más bajo de todos los límites</text>
<rect x="80" y="170" width="480" height="84" rx="14" fill="#FFFFFF" stroke="#E6BB93" stroke-width="3"/><text x="110" y="222" font-size="26" font-weight="700" fill="#8A4B1F" font-style="italic">Runway Limit</text><text x="530" y="222" font-size="26" font-weight="700" fill="#231F1A" text-anchor="end">78 400 kg</text><path d="M560 212C800 212 850 480 1068 480" fill="none" stroke="#E6BB93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="278" width="480" height="84" rx="14" fill="#FFFFFF" stroke="#E6BB93" stroke-width="3"/><text x="110" y="330" font-size="26" font-weight="700" fill="#8A4B1F" font-style="italic">Climb Limit</text><text x="530" y="330" font-size="26" font-weight="700" fill="#231F1A" text-anchor="end">76 900 kg</text><path d="M560 320C800 320 850 480 1068 480" fill="none" stroke="#E6BB93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="386" width="480" height="84" rx="14" fill="#8A4B1F"/><text x="110" y="438" font-size="26" font-weight="700" fill="#FFFFFF" font-style="italic">Obstacle Limit</text><text x="530" y="438" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="end">74 200 kg</text><path d="M560 428C800 428 850 480 1068 480" fill="none" stroke="#8A4B1F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="80" y="494" width="480" height="84" rx="14" fill="#FFFFFF" stroke="#E6BB93" stroke-width="3"/><text x="110" y="546" font-size="26" font-weight="700" fill="#8A4B1F" font-style="italic">Brake Energy Limit</text><text x="530" y="546" font-size="26" font-weight="700" fill="#231F1A" text-anchor="end">79 800 kg</text><path d="M560 536C800 536 850 480 1068 480" fill="none" stroke="#E6BB93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="602" width="480" height="84" rx="14" fill="#FFFFFF" stroke="#E6BB93" stroke-width="3"/><text x="110" y="654" font-size="26" font-weight="700" fill="#8A4B1F" font-style="italic">Tire Speed Limit</text><text x="530" y="654" font-size="26" font-weight="700" fill="#231F1A" text-anchor="end">81 000 kg</text><path d="M560 644C800 644 850 480 1068 480" fill="none" stroke="#E6BB93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="710" width="480" height="84" rx="14" fill="#FFFFFF" stroke="#E6BB93" stroke-width="3"/><text x="110" y="762" font-size="26" font-weight="700" fill="#8A4B1F" font-style="italic">Structural Limit</text><text x="530" y="762" font-size="26" font-weight="700" fill="#231F1A" text-anchor="end">79 000 kg</text><path d="M560 752C800 752 850 480 1068 480" fill="none" stroke="#E6BB93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1080" y="370" width="460" height="220" rx="18" fill="#FBEFE4" stroke="#8A4B1F" stroke-width="4"/><text x="1310" y="436" font-size="28" font-weight="700" fill="#8A4B1F" text-anchor="middle" font-style="italic"><tspan x="1310" dy="0">Maximum Allowed</tspan><tspan x="1310" dy="34">Takeoff Weight</tspan></text><text x="1310" y="540" font-size="40" font-weight="700" fill="#231F1A" text-anchor="middle">74 200 kg</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-13</text>
</svg>
