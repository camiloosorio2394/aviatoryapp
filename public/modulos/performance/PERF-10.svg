<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Gradiente no es régimen de ascenso</title>
<desc id="desc">Un triángulo rectángulo con la trayectoria de ascenso como hipotenusa, la distancia horizontal en la base y la altura ganada en el lado vertical, con la fórmula: gradiente igual a altura ganada sobre distancia recorrida por cien. Al lado, dos aviones con el mismo régimen de 1 500 ft/min, uno a 160 kt y otro a 280 kt: el lento sube con un gradiente de cerca del 9 % y el rápido, de cerca del 5 %.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Gradiente no es régimen de ascenso</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Lo que libra obstáculos es la pendiente, no los pies por minuto</text>
<path d="M100 720L760 720L760 360Z" fill="#FBEFE4" stroke="#8A4B1F" stroke-width="4" stroke-linejoin="round"/><path d="M100 720L760 360" fill="none" stroke="#8A4B1F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="730" y="690" width="30" height="30" fill="none" stroke="#8A4B1F" stroke-width="2"/><text x="430" y="764" font-size="24" fill="#231F1A" text-anchor="middle">distancia horizontal recorrida</text><text x="780" y="540" font-size="24" fill="#231F1A"><tspan x="780" dy="0">altura</tspan><tspan x="780" dy="28">ganada</tspan></text><rect x="100" y="200" width="560" height="100" rx="14" fill="#FFFFFF" stroke="#8A4B1F" stroke-width="3"/><text x="380" y="262" font-size="28" font-weight="700" fill="#8A4B1F" text-anchor="middle">gradiente = altura ÷ distancia × 100</text><path d="M900 520L1500 386.08000000000004" fill="none" stroke="#C97B3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><g transform="translate(960 500) scale(0.7) rotate(-12.6)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><text x="900" y="564" font-size="22" font-weight="700" fill="#231F1A">1 500 ft/min · 160 kt</text><text x="1500" y="366.1" font-size="26" font-weight="700" fill="#8A4B1F" text-anchor="end">≈ 9 %</text><path d="M900 720L1500 643.6800000000001" fill="none" stroke="#C97B3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><g transform="translate(960 700) scale(0.7) rotate(-7.2)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><text x="900" y="764" font-size="22" font-weight="700" fill="#231F1A">1 500 ft/min · 280 kt</text><text x="1500" y="623.7" font-size="26" font-weight="700" fill="#8A4B1F" text-anchor="end">≈ 5 %</text><text x="900" y="250" font-size="24" font-weight="700" fill="#8A4B1F">El mismo régimen, distinta pendiente:</text><text x="900" y="282" font-size="22" fill="#6F665B">el rápido recorre más suelo por cada pie.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-10</text>
</svg>
