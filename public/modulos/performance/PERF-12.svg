<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">El obstáculo que limita el peso</title>
<desc id="desc">Perfil de salida con la pista a la izquierda, la trayectoria neta ascendiendo y, a la derecha, una colina con una antena encima. Entre la punta de la antena y la trayectoria neta, una cota de 35 ft. Por encima, en gris claro, la trayectoria real, con el margen extra.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">El obstáculo que limita el peso</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Se libra con la trayectoria neta y con un motor menos</text>
<rect x="60" y="780" width="360" height="18" fill="#231F1A"/><path d="M60 798L1540 798" fill="none" stroke="#C9B797" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 750L1500 210" fill="none" stroke="#A89F94" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="1340" y="276" font-size="22" fill="#6F665B" text-anchor="end">trayectoria real</text><path d="M420 750L1500 382.79999999999995" fill="none" stroke="#8A4B1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1500" y="422.8" font-size="26" font-weight="700" fill="#8A4B1F" text-anchor="end" font-style="italic">Net Flight Path</text><path d="M890 798C990 700 1070 651.8 1150 631.8C1230 651.8 1310 700 1410 798Z" fill="#E3D6BF" stroke="#C9B797" stroke-width="2"/><path d="M1150 631.8L1150 561.8" fill="none" stroke="#231F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1134 591.8L1166 591.8M1140 573.8L1160 573.8" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1150" cy="561.8" r="6" fill="#B3372B"/><path d="M1190 492.2L1190 559.8" fill="none" stroke="#B3372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-rojo)" marker-start="url(#f-rojo)"/><text x="1208" y="533" font-size="26" font-weight="700" fill="#B3372B">35 ft</text><g transform="translate(480 716) scale(0.8) rotate(-18)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><text x="60" y="860" font-size="22" fill="#231F1A">Si con el peso del día la neta no libra la antena por ese margen, el peso baja: el límite es el obstáculo.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-12</text>
</svg>
