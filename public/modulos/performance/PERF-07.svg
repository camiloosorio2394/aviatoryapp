<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Balanced field length</title>
<desc id="desc">Gráfico con V1 en el eje horizontal y distancia en el vertical. La distancia de aceleración y parada sube con V1; la de aceleración y continuación baja. Se cruzan: desde el cruce, líneas de puntos a los ejes rotuladas V1 equilibrada y balanced field length.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Balanced field length</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Donde parar y continuar piden la misma pista</text>
<path d="M220 780L1300 780" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><path d="M220 780L220 180" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><text x="1300" y="824" font-size="28" font-weight="700" fill="#231F1A" text-anchor="end">V₁</text><text x="200" y="190" font-size="24" font-weight="700" fill="#231F1A" text-anchor="end">distancia</text><path d="M260 700C520 640 610 520 760 440S1150 250 1240 210" fill="none" stroke="#8A4B1F" stroke-width="6"/><path d="M260 220C520 260 610 380 760 440S1150 640 1240 690" fill="none" stroke="#C97B3C" stroke-width="6"/><text x="1240" y="196" font-size="24" font-weight="700" fill="#8A4B1F" text-anchor="end" font-style="italic">Accelerate-Stop Distance</text><text x="1240" y="728" font-size="24" font-weight="700" fill="#C97B3C" text-anchor="end" font-style="italic">Accelerate-Go Distance</text><path d="M760 440L760 780" fill="none" stroke="#231F1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M760 440L220 440" fill="none" stroke="#231F1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><circle cx="760" cy="440" r="12" fill="#231F1A"/><text x="760" y="824" font-size="24" font-weight="700" fill="#231F1A" text-anchor="middle">V₁ equilibrada</text><text x="200" y="434" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end" font-style="italic"><tspan x="200" dy="0">Balanced</tspan><tspan x="200" dy="26">Field Length</tspan></text><text x="1340" y="380" font-size="22" fill="#231F1A"><tspan x="1340" dy="0">En el cruce, parar y</tspan><tspan x="1340" dy="29">continuar piden la</tspan><tspan x="1340" dy="29">misma distancia: esa</tspan><tspan x="1340" dy="29">es la pista mínima</tspan><tspan x="1340" dy="29">para ese peso.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-07</text>
</svg>
