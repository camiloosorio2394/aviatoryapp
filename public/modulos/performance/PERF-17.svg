<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Cuánta pista se pierde por técnica</title>
<desc id="desc">Dos aterrizajes sobre la misma pista. Arriba, en senda y a VREF: la toma cae dentro de la zona de contacto y el avión se detiene con pista de sobra. Abajo, con exceso de velocidad y altura: flota, toca pasada la zona de contacto y se detiene muy cerca del extremo. Las dos con la distancia recorrida acotada.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Cuánta pista se pierde por técnica</text>
<text x="56" y="124" font-size="24" fill="#6F665B">El mismo avión y el mismo peso; cambia cómo se llega</text>
<rect x="56" y="160" width="1488" height="310" rx="16" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="204" font-size="22" font-weight="700" fill="#2E7A4B" letter-spacing="1">EN SENDA Y A VREF</text><rect x="300" y="356" width="1180" height="18" fill="#231F1A"/><rect x="450" y="352" width="220" height="26" fill="none" stroke="#E6BB93" stroke-width="2" stroke-dasharray="5 5"/><text x="560" y="406" font-size="18" fill="#6F665B" text-anchor="middle">zona de toma de contacto</text><path d="M120 236L300 286C420 336 500 356 560 356" fill="none" stroke="#2E7A4B" stroke-width="4" stroke-dasharray="10 7"/><circle cx="560" cy="356" r="9" fill="#2E7A4B"/><g transform="translate(850 338) scale(0.8)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><path d="M300 426L900 426" fill="none" stroke="#2E7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-verde)" marker-start="url(#f-verde)"/><text x="600" y="456" font-size="20" font-weight="700" fill="#2E7A4B" text-anchor="middle">distancia recorrida</text><rect x="56" y="500" width="1488" height="310" rx="16" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="544" font-size="22" font-weight="700" fill="#B3372B" letter-spacing="1">CON EXCESO DE VELOCIDAD Y ALTURA</text><rect x="300" y="696" width="1180" height="18" fill="#231F1A"/><rect x="450" y="692" width="220" height="26" fill="none" stroke="#E6BB93" stroke-width="2" stroke-dasharray="5 5"/><text x="560" y="746" font-size="18" fill="#6F665B" text-anchor="middle">zona de toma de contacto</text><path d="M120 566L300 596C460 646 660 670 800 678C860 684 900 696 920 696" fill="none" stroke="#B3372B" stroke-width="4" stroke-dasharray="10 7"/><text x="770" y="656" font-size="20" font-weight="700" fill="#B3372B" text-anchor="middle">flotación</text><circle cx="920" cy="696" r="9" fill="#B3372B"/><g transform="translate(1350 678) scale(0.8)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><path d="M300 766L1400 766" fill="none" stroke="#B3372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-rojo)" marker-start="url(#f-rojo)"/><text x="850" y="796" font-size="20" font-weight="700" fill="#B3372B" text-anchor="middle">distancia recorrida</text><text x="1480" y="632" font-size="20" font-weight="700" fill="#B3372B" text-anchor="end">muy cerca del extremo</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-17</text>
