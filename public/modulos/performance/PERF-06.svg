<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Accelerate-Go: si se continúa</title>
<desc id="desc">El mismo encuadre que la figura anterior: suelta de frenos, acelerando, falla en VEF, rotación en VR, despegue en VLOF, y el avión a 35 ft sobre el final con V2. Debajo, la barra de la distancia de aceleración y continuación contra la barra de la TODA, con la clearway sombreada al final.</desc>
