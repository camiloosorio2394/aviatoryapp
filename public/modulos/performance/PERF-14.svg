<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Empuje reducido: sobra performance</title>
<desc id="desc">Dos barras verticales de empuje. La izquierda, llena hasta arriba: maximum takeoff thrust. La derecha, llena hasta unos tres cuartos: reduced takeoff thrust, con la parte vacía sombreada como margen que no se usa. Debajo, una pista con el punto de 35 ft alcanzado en los dos casos, más adelante con empuje reducido pero todavía dentro de la pista.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Empuje reducido: sobra performance</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Assumed temperature o flex: menos empuje dentro de lo que el día permite</text>
<rect x="380" y="200" width="180" height="380" rx="12" fill="#FBEFE4" stroke="#8A4B1F" stroke-width="3"/><rect x="380" y="200" width="180" height="380" rx="12" fill="#8A4B1F"/><text x="470" y="616" font-size="22" font-weight="700" fill="#8A4B1F" text-anchor="middle" font-style="italic"><tspan x="470" dy="0">Maximum</tspan><tspan x="470" dy="26">Thrust</tspan></text><rect x="820" y="200" width="180" height="380" rx="12" fill="#FBEFE4" stroke="#8A4B1F" stroke-width="3"/><rect x="820" y="295" width="180" height="285" rx="12" fill="#8A4B1F"/><text x="910" y="616" font-size="22" font-weight="700" fill="#8A4B1F" text-anchor="middle" font-style="italic"><tspan x="910" dy="0">Reduced</tspan><tspan x="910" dy="26">Thrust</tspan></text><text x="1030" y="230" font-size="22" font-weight="700" fill="#C97B3C"><tspan x="1030" dy="0">margen que</tspan><tspan x="1030" dy="26">no se usa</tspan></text><path d="M1026 240L1004 250" fill="none" stroke="#C97B3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="770" width="1200" height="20" fill="#231F1A"/><path d="M820 770L820 714" fill="none" stroke="#8A4B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="820" cy="710" r="10" fill="#8A4B1F"/><text x="820" y="690" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">35 ft · máximo</text><path d="M1160 770L1160 714" fill="none" stroke="#C97B3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1160" cy="710" r="10" fill="#C97B3C"/><text x="1160" y="690" font-size="20" font-weight="700" fill="#C97B3C" text-anchor="middle">35 ft · reducido</text><text x="1400" y="822" font-size="20" fill="#6F665B" text-anchor="end">fin de pista</text><text x="1120" y="360" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1120" dy="0">Se reduce porque sobra</tspan><tspan x="1120" dy="31">performance, no porque se acepte</tspan><tspan x="1120" dy="31">menos seguridad.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-14</text>
</svg>
