<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Gross y net flight path</title>
<desc id="desc">Perfil lateral desde el final de la pista. Dos trayectorias de ascenso salen del mismo punto a 35 ft: la superior, gross flight path, y la inferior, net flight path. La separación entre las dos crece y va sombreada: el margen de la norma. Abajo, un obstáculo que la trayectoria neta libra.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Gross y net flight path</text>
<text x="56" y="124" font-size="24" fill="#6F665B">La trayectoria que se analiza contra los obstáculos es la neta</text>
<rect x="60" y="760" width="260" height="18" fill="#231F1A"/><path d="M60 778L1540 778" fill="none" stroke="#C9B797" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 720L1500 216L1500 360Z" fill="#F3DCC6"/><path d="M300 720L1500 216" fill="none" stroke="#8A4B1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 720L1500 360" fill="none" stroke="#C97B3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 8"/><text x="1500" y="200" font-size="26" font-weight="700" fill="#8A4B1F" text-anchor="end" font-style="italic">Gross Flight Path</text><text x="1500" y="400" font-size="26" font-weight="700" fill="#C97B3C" text-anchor="end" font-style="italic">Net Flight Path</text><text x="900" y="500" font-size="22" font-weight="700" fill="#8A4B1F" text-anchor="middle"><tspan x="900" dy="0">margen de la norma</tspan><tspan x="900" dy="26">0,8 % en bimotor</tspan></text><g transform="translate(340 702) scale(0.8) rotate(-13)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><path d="M270 720L270 760" fill="none" stroke="#231F1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)" marker-start="url(#f-tinta)"/><text x="256" y="748" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end">35 ft</text><path d="M870 778C920 720 960 606 980 596C1010 606 1050 720 1100 778Z" fill="#E3D6BF" stroke="#C9B797" stroke-width="2"/><text x="980" y="750" font-size="22" fill="#6F665B" text-anchor="middle">obstáculo</text><text x="60" y="850" font-size="24" fill="#231F1A">El margen se aplica bajando la trayectoria, no subiendo el obstáculo.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-08</text>
</svg>
