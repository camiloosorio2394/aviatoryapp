<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Los cuatro segmentos del despegue</title>
<desc id="desc">Perfil lateral del despegue con un motor inoperativo, en cuatro tramos. Primero, desde 35 ft hasta el tren arriba: tren bajando, flaps de despegue, empuje de despegue, a VLOF, gradiente positivo en bimotor. Segundo, hasta la altura de aceleración: tren arriba, flaps de despegue, empuje de despegue, a V2, 2,4 % en bimotor. Aceleración: se acelera y se retraen flaps, sin gradiente exigido. Final: limpio, empuje máximo continuo, a VFTO, 1,2 % en bimotor, hasta al menos 1 500 ft.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Los cuatro segmentos del despegue</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Con un motor inoperativo: cada tramo tiene su configuración y su exigencia</text>
<rect x="140" y="160" width="220" height="610" fill="#FBEFE4"/><text x="250" y="196" font-size="18" font-weight="700" fill="#8A4B1F" text-anchor="middle" font-style="italic">First Segment</text><text x="250" y="224" font-size="18" fill="#231F1A" text-anchor="middle"><tspan x="250" dy="0">Tren bajando · flaps de</tspan><tspan x="250" dy="23">despegue</tspan></text><text x="250" y="272" font-size="18" fill="#231F1A" text-anchor="middle"><tspan x="250" dy="0">Empuje de despegue ·</tspan><tspan x="250" dy="23">VLOF</tspan></text><rect x="194.7" y="312" width="110.6" height="36" rx="18" fill="#FFFFFF" stroke="#8A4B1F" stroke-width="2"/><text x="250" y="337.2" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">Positivo</text><rect x="360" y="160" width="400" height="610" fill="#F3DCC6"/><text x="560" y="196" font-size="22" font-weight="700" fill="#8A4B1F" text-anchor="middle" font-style="italic">Second Segment</text><text x="560" y="224" font-size="18" fill="#231F1A" text-anchor="middle"><tspan x="560" dy="0">Tren arriba · flaps de despegue</tspan></text><text x="560" y="272" font-size="18" fill="#231F1A" text-anchor="middle"><tspan x="560" dy="0">Empuje de despegue · V₂</tspan></text><rect x="521.7" y="312" width="76.6" height="36" rx="18" fill="#FFFFFF" stroke="#8A4B1F" stroke-width="2"/><text x="560" y="337.2" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">2,4 %</text><rect x="760" y="160" width="280" height="610" fill="#FBEFE4"/><text x="900" y="196" font-size="22" font-weight="700" fill="#8A4B1F" text-anchor="middle" font-style="italic">Acceleration Segment</text><text x="900" y="224" font-size="18" fill="#231F1A" text-anchor="middle"><tspan x="900" dy="0">Acelera y retrae flaps</tspan></text><rect x="827.9" y="312" width="144.1" height="36" rx="18" fill="#FFFFFF" stroke="#8A4B1F" stroke-width="2"/><text x="900" y="337.2" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">No se exige</text><rect x="1040" y="160" width="460" height="610" fill="#F3DCC6"/><text x="1270" y="196" font-size="22" font-weight="700" fill="#8A4B1F" text-anchor="middle" font-style="italic">Final Segment</text><text x="1270" y="224" font-size="18" fill="#231F1A" text-anchor="middle"><tspan x="1270" dy="0">Limpio · empuje máximo continuo</tspan></text><text x="1270" y="272" font-size="18" fill="#231F1A" text-anchor="middle"><tspan x="1270" dy="0">VFTO</tspan></text><rect x="1231.7" y="312" width="76.6" height="36" rx="18" fill="#FFFFFF" stroke="#8A4B1F" stroke-width="2"/><text x="1270" y="337.2" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">1,2 %</text><rect x="60" y="770" width="100" height="16" fill="#231F1A"/><path d="M60 786L1540 786" fill="none" stroke="#C9B797" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 750L360 700L760 500L1040 490L1500 380" fill="none" stroke="#8A4B1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(560 592) scale(0.75) rotate(-27)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><circle cx="604" cy="544" r="16" fill="#FFFFFF" stroke="#B3372B" stroke-width="3"/><path d="M594 554L614 534" fill="none" stroke="#B3372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 750L1540 750" fill="none" stroke="#A89F94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 7"/><text x="70" y="742" font-size="18" fill="#6F665B">35 ft</text><path d="M60 500L1540 500" fill="none" stroke="#A89F94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 7"/><text x="70" y="492" font-size="18" fill="#6F665B">altura de aceleración · la fija el operador, no menos de 400 ft</text><path d="M60 380L1540 380" fill="none" stroke="#A89F94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 7"/><text x="70" y="372" font-size="18" fill="#6F665B">1 500 ft o más</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-09</text>
</svg>
