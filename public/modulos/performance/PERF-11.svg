<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Por qué limita el segundo segmento</title>
<desc id="desc">Un avión con un motor inoperativo, tren arriba y flaps de despegue, subiendo por una pendiente rotulada 2,4 % en bimotor. Alrededor, lo que juega en contra: peso máximo, V2 baja, flaps extendidos y medio empuje. Y a favor, el tren retraído.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Por qué limita el segundo segmento</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Cuatro cosas en contra y una a favor, en el mismo tramo</text>
<path d="M240 740L1340 465" fill="none" stroke="#8A4B1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 740L1340 740" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 8"/><rect x="1026.2" y="543" width="227.6" height="44" rx="22" fill="#8A4B1F"/><text x="1140" y="575.1" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2,4 % · bimotor</text><g transform="translate(760 580) scale(1.8) rotate(-14)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><circle cx="790" cy="650" r="16" fill="#FFFFFF" stroke="#B3372B" stroke-width="3"/><path d="M780 660L800 640" fill="none" stroke="#B3372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="230" width="209.7" height="40" rx="20" fill="#F6DEDA"/><text x="344.9" y="258.6" font-size="24" font-weight="700" fill="#B3372B" text-anchor="middle">− Peso máximo</text><rect x="560" y="180" width="138.7" height="40" rx="20" fill="#F6DEDA"/><text x="629.4" y="208.6" font-size="24" font-weight="700" fill="#B3372B" text-anchor="middle">− V₂ baja</text><rect x="1000" y="200" width="251" height="40" rx="20" fill="#F6DEDA"/><text x="1125.5" y="228.6" font-size="24" font-weight="700" fill="#B3372B" text-anchor="middle">− Flaps extendidos</text><rect x="1250" y="310" width="212.4" height="40" rx="20" fill="#F6DEDA"/><text x="1356.2" y="338.6" font-size="24" font-weight="700" fill="#B3372B" text-anchor="middle">− Medio empuje</text><rect x="560" y="800" width="208.8" height="40" rx="20" fill="#DDEFE3"/><text x="664.4" y="828.6" font-size="24" font-weight="700" fill="#2E7A4B" text-anchor="middle">+ Tren retraído</text><text x="1540" y="850" font-size="22" fill="#6F665B" text-anchor="end">Por eso este tramo decide el peso en tantos aeropuertos.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-11</text>
</svg>
