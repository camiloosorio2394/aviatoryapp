<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Entradas, cálculo y resultado</title>
<desc id="desc">Pantalla genérica de una aplicación de performance en tres bloques. A la izquierda, las entradas con valores ficticios: pista, viento, temperatura, QNH, estado de la pista, configuración y peso. En el centro, una flecha: performance calculation. A la derecha, los resultados: peso máximo, V1, VR, V2, el empuje y, destacada, la línea LIMIT con el factor limitante.</desc>
