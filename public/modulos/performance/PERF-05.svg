ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><circle cx="640" cy="450" r="18" fill="#8A4B1F"/><text x="640" y="457" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="640" y="416" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">falla · VEF</text><g transform="translate(790 542) scale(0.85)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><circle cx="790" cy="450" r="18" fill="#8A4B1F"/><text x="790" y="457" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="790" y="416" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">rechazo en V₁</text><g transform="translate(1180 542) scale(0.85)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><circle cx="1180" cy="450" r="18" fill="#8A4B1F"/><text x="1180" y="457" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1180" y="416" font-size="20" font-weight="700" fill="#8A4B1F" text-anchor="middle">detenido</text><path d="M640 478L652 496L644 496L650 518L628 494L637 494Z" fill="#B3372B"/><path d="M782 526L812 516" fill="none" stroke="#8A4B1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="660" width="1100" height="30" rx="4" fill="#8A4B1F"/><text x="96" y="682" font-size="20" font-weight="700" fill="#FFFFFF">Accelerate-Stop Distance</text><rect x="80" y="730" width="1290" height="30" rx="4" fill="#A89F94"/><text x="96" y="752" font-size="20" font-weight="700" fill="#FFFFFF">ASDA</text><text x="80" y="830" font-size="22" fill="#231F1A">La distancia para detenerse tiene que caber en la ASDA. La falla ocurre antes del punto de decisión.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-05</text>
