<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Energía de frenos y VMBE</title>
<desc id="desc">Curva creciente de la energía que absorben los frenos contra la velocidad de rechazo, cuadrática. Dos puntos marcados: a una velocidad V la energía es E; al doble de velocidad, 2V, la energía es cuatro veces mayor, 4E. Una línea horizontal de trazos, capacidad certificada, corta la curva; el punto de corte es VMBE.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8A4B1F"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C97B3C"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Energía de frenos y VMBE</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Por qué un rechazo a alta velocidad es tan exigente</text>
<path d="M200 780L1280 780" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><path d="M200 780L200 170" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><text x="1280" y="824" font-size="24" font-weight="700" fill="#231F1A" text-anchor="end">velocidad de rechazo</text><text x="180" y="180" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end"><tspan x="180" dy="0">energía en</tspan><tspan x="180" dy="26">los frenos</tspan></text><path d="M200 780L220 779.7107438016529L240 778.8429752066115L260 777.396694214876L280 775.3719008264463L300 772.7685950413223L320 769.5867768595041L340 765.8264462809917L360 761.4876033057851L380 756.5702479338843L400 751.0743801652893L420 745L440 738.3471074380166L460 731.1157024793389L480 723.305785123967L500 714.9173553719008L520 705.9504132231405L540 696.404958677686L560 686.2809917355372L580 675.5785123966942L600 664.297520661157L620 652.4380165289256L640 640L660 626.9834710743802L680 613.3884297520661L700 599.2148760330579L720 584.4628099173553L740 569.1322314049587L760 553.2231404958677L780 536.7355371900826L800 519.6694214876034L820 502.02479338842977L840 483.801652892562L860 465L880 445.6198347107438L900 425.66115702479345L920 405.1239669421488L940 384.00826446280996L960 362.3140495867769L980 340.04132231404964L1000 317.19008264462815L1020 293.7603305785124L1040 269.7520661157025L1060 245.16528925619832L1080 220L1100 194.25619834710744" fill="none" stroke="#8A4B1F" stroke-width="6"/><path d="M600 780L600 664.297520661157L200 664.297520661157" fill="none" stroke="#C97B3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><circle cx="600" cy="664.297520661157" r="11" fill="#C97B3C" stroke="#FFFFFF" stroke-width="3"/><text x="600" y="820" font-size="24" font-weight="700" fill="#C97B3C" text-anchor="middle">V</text><text x="184" y="672.3" font-size="24" font-weight="700" fill="#C97B3C" text-anchor="end">E</text><path d="M1000 780L1000 317.19008264462815L200 317.19008264462815" fill="none" stroke="#C97B3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><circle cx="1000" cy="317.19008264462815" r="11" fill="#C97B3C" stroke="#FFFFFF" stroke-width="3"/><text x="1000" y="820" font-size="24" font-weight="700" fill="#C97B3C" text-anchor="middle">2V</text><text x="184" y="325.2" font-size="24" font-weight="700" fill="#C97B3C" text-anchor="end">4E</text><path d="M200 425.66115702479345L1250 425.66115702479345" fill="none" stroke="#B3372B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 8"/><text x="1250" y="411.7" font-size="22" font-weight="700" fill="#B3372B" text-anchor="end">capacidad certificada</text><circle cx="900" cy="425.66115702479345" r="12" fill="#B3372B" stroke="#FFFFFF" stroke-width="3"/><rect x="846.9" y="449.7" width="106.2" height="40" rx="20" fill="#F6DEDA"/><text x="900" y="478.3" font-size="24" font-weight="700" fill="#B3372B" text-anchor="middle">VMBE</text><text x="1320" y="420" font-size="22" fill="#231F1A"><tspan x="1320" dy="0">Al doble de velocidad,</tspan><tspan x="1320" dy="29">cuatro veces la</tspan><tspan x="1320" dy="29">energía. V₁ no puede</tspan><tspan x="1320" dy="29">superar VMBE.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">PERF-20</text>
