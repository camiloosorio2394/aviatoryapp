<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Estructura de un mensaje no normal</title>
  <desc id="desc">Hecho, capacidad, ayuda e intención, con actualización cuando cambia la evaluación.</desc>
  <rect width="1600" height="900" fill="#102235"/>
  <rect x="70" y="60" width="1460" height="780" rx="32" fill="#1c3548" stroke="#4d7181" stroke-width="2"/>
  <text x="125" y="145" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">INGLÉS CLARO EN LO NO NORMAL</text>
  <text x="125" y="210" fill="#fff" font-family="Arial,sans-serif" font-size="50" font-weight="700">Un mensaje que ATC pueda utilizar</text>
  <text x="125" y="260" fill="#cbdbe3" font-family="Arial,sans-serif" font-size="26">Breve, observable y actualizado; no es un informe de mantenimiento.</text>
  <g font-family="Arial,sans-serif">
    <rect x="125" y="330" width="320" height="290" rx="23" fill="#284559" stroke="#68958e"/>
    <text x="155" y="395" fill="#a7f3d0" font-size="29" font-weight="700">01 · HECHO</text>
    <text x="155" y="450" fill="#fff" font-size="26" font-weight="700">¿Qué ocurre?</text>
    <text x="155" y="508" fill="#d6e4ea" font-size="22">Solo lo observado.</text>
    <text x="155" y="548" fill="#d6e4ea" font-size="22">Duda explícita si</text>
    <text x="155" y="581" fill="#d6e4ea" font-size="22">la causa es incierta.</text>
    <rect x="470" y="330" width="320" height="290" rx="23" fill="#284559" stroke="#68958e"/>
    <text x="500" y="395" fill="#a7f3d0" font-size="29" font-weight="700">02 · CAPACIDAD</text>
    <text x="500" y="450" fill="#fff" font-size="26" font-weight="700">¿Qué puede hacer?</text>
    <text x="500" y="508" fill="#d6e4ea" font-size="22">Nivel, rumbo, tiempo</text>
    <text x="500" y="548" fill="#d6e4ea" font-size="22">o aproximación.</text>
    <text x="500" y="581" fill="#d6e4ea" font-size="22">UNABLE si aplica.</text>
    <rect x="815" y="330" width="320" height="290" rx="23" fill="#284559" stroke="#68958e"/>
    <text x="845" y="395" fill="#a7f3d0" font-size="29" font-weight="700">03 · AYUDA</text>
    <text x="845" y="450" fill="#fff" font-size="26" font-weight="700">¿Qué necesita?</text>
    <text x="845" y="508" fill="#d6e4ea" font-size="22">Prioridad, demora,</text>
    <text x="845" y="548" fill="#d6e4ea" font-size="22">vectores o servicios</text>
    <text x="845" y="581" fill="#d6e4ea" font-size="22">concretos.</text>
    <rect x="1160" y="330" width="320" height="290" rx="23" fill="#205146" stroke="#8edeb9"/>
    <text x="1190" y="395" fill="#a7f3d0" font-size="29" font-weight="700">04 · INTENCIÓN</text>
    <text x="1190" y="450" fill="#fff" font-size="26" font-weight="700">¿Qué hará ahora?</text>
    <text x="1190" y="508" fill="#d6e4ea" font-size="22">Plan provisional;</text>
    <text x="1190" y="548" fill="#d6e4ea" font-size="22">avisar si cambia tras</text>
    <text x="1190" y="581" fill="#d6e4ea" font-size="22">la evaluación.</text>
  </g>
  <path d="M445 477h25m320 0h25m320 0h25" stroke="#a7f3d0" stroke-width="5"/>
  <rect x="125" y="665" width="1355" height="85" rx="15" fill="#304455" stroke="#d8b881"/>
  <text x="160" y="718" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Si cambia la capacidad o el plan, ATC necesita una actualización.</text>
  <text x="125" y="807" fill="#afc4d0" font-family="Arial,sans-serif" font-size="19">Plantilla de estudio, no fraseología prescrita ni orden rígido para una emergencia.</text>
</svg>
