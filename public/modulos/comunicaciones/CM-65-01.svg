<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro evidencias de criterio en una entrevista ATC</title>
  <desc id="desc">Escucha, decisión, comunicación y verificación de la trayectoria.</desc>
  <rect width="1600" height="900" fill="#102235"/>
  <rect x="70" y="60" width="1460" height="780" rx="32" fill="#1c3548" stroke="#4d7181" stroke-width="2"/>
  <text x="120" y="145" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">SIMULADOR DE SELECCIÓN</text>
  <text x="120" y="208" fill="#fff" font-family="Arial,sans-serif" font-size="50" font-weight="700">Lo que demuestra una buena respuesta</text>
  <text x="120" y="258" fill="#cbdbe3" font-family="Arial,sans-serif" font-size="25">La fluidez importa, pero el criterio operacional evita una acción errónea.</text>
  <g font-family="Arial,sans-serif">
    <rect x="120" y="330" width="320" height="300" rx="24" fill="#29475b" stroke="#699b96"/>
    <text x="150" y="396" fill="#a7f3d0" font-size="29" font-weight="700">01 · ESCUCHA</text>
    <text x="150" y="457" fill="#fff" font-size="25" font-weight="700">¿Llegó completo?</text>
    <text x="150" y="518" fill="#d8e6eb" font-size="22">Destinatario, acción,</text>
    <text x="150" y="550" fill="#d8e6eb" font-size="22">cifras y condición.</text>
    <text x="150" y="590" fill="#d8e6eb" font-size="22">Si falta: preguntar.</text>
    <rect x="470" y="330" width="320" height="300" rx="24" fill="#29475b" stroke="#699b96"/>
    <text x="500" y="396" fill="#a7f3d0" font-size="29" font-weight="700">02 · DECISIÓN</text>
    <text x="500" y="457" fill="#fff" font-size="25" font-weight="700">¿Puede cumplirse?</text>
    <text x="500" y="518" fill="#d8e6eb" font-size="22">Capacidad, seguridad</text>
    <text x="500" y="550" fill="#d8e6eb" font-size="22">y tiempo disponible.</text>
    <text x="500" y="590" fill="#d8e6eb" font-size="22">Si no: UNABLE.</text>
    <rect x="820" y="330" width="320" height="300" rx="24" fill="#29475b" stroke="#699b96"/>
    <text x="850" y="396" fill="#a7f3d0" font-size="29" font-weight="700">03 · MENSAJE</text>
    <text x="850" y="457" fill="#fff" font-size="25" font-weight="700">¿Qué sabe ATC?</text>
    <text x="850" y="518" fill="#d8e6eb" font-size="22">Colación precisa,</text>
    <text x="850" y="550" fill="#d8e6eb" font-size="22">límite y petición.</text>
    <text x="850" y="590" fill="#d8e6eb" font-size="22">Sin adivinar datos.</text>
    <rect x="1170" y="330" width="310" height="300" rx="24" fill="#215044" stroke="#93dfba"/>
    <text x="1200" y="396" fill="#a7f3d0" font-size="29" font-weight="700">04 · COTEJO</text>
    <text x="1200" y="457" fill="#fff" font-size="25" font-weight="700">¿Qué hace el avión?</text>
    <text x="1200" y="518" fill="#d8e6eb" font-size="22">Selector, modo y</text>
    <text x="1200" y="550" fill="#d8e6eb" font-size="22">trayectoria real.</text>
    <text x="1200" y="590" fill="#d8e6eb" font-size="22">Corregir si difiere.</text>
  </g>
  <path d="M440 475h30m320 0h30m320 0h30" stroke="#a7f3d0" stroke-width="5"/>
  <rect x="120" y="680" width="1360" height="72" rx="15" fill="#31485b"/>
  <text x="155" y="726" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700">Pregunta al final: ¿qué barrera detectó el error y qué harías después?</text>
  <text x="120" y="805" fill="#afc4d0" font-family="Arial,sans-serif" font-size="19">Rúbrica didáctica, no criterio oficial de selección de ninguna aerolínea.</text>
</svg>
