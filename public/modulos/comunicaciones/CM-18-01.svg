<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Despegue: cuatro estados de comunicación</title>
  <desc id="desc">READY informa preparación; LINE UP AND WAIT autoriza alineación y espera; CLEARED FOR TAKE-OFF autoriza la carrera; el contacto con Salida depende de instrucción o procedimiento aplicable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#142434"/><stop offset="1" stop-color="#203c4c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="11" stdDeviation="15" flood-color="#071522" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1600" height="850" rx="38" fill="url(#bg)"/>
  <text x="76" y="84" fill="#9adfce" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="6">COMUNICACIONES · DESPEGUE</text>
  <text x="76" y="151" fill="#fff" font-family="Arial,sans-serif" font-size="47" font-weight="700">Una autorización nueva para cada cambio de estado</text>
  <text x="76" y="202" fill="#c2ced6" font-family="Arial,sans-serif" font-size="24">Oír · confirmar indicativo y pista · colacionar · actuar solo dentro del permiso</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <rect x="76" y="270" width="332" height="360" rx="28" fill="#f6faf9"/>
    <rect x="446" y="270" width="332" height="360" rx="28" fill="#f6faf9"/>
    <rect x="816" y="270" width="332" height="360" rx="28" fill="#e4faf3"/>
    <rect x="1186" y="270" width="332" height="360" rx="28" fill="#f6faf9"/>
  </g>
  <path d="M408 445h38m332 0h38m332 0h38" stroke="#6bcbb5" stroke-width="9" stroke-linecap="round"/>
  <g fill="#1d3745" font-family="Arial,sans-serif">
    <text x="104" y="324" font-size="20" font-weight="700">01 · PREPARACIÓN</text>
    <text x="104" y="388" font-size="34" font-weight="700">READY</text>
    <text x="104" y="465" font-size="23">Informa que la tripulación</text>
    <text x="104" y="499" font-size="23">está preparada.</text>
    <text x="104" y="564" font-size="20" fill="#47606b">No autoriza movimiento.</text>
    <text x="474" y="324" font-size="20" font-weight="700">02 · ALINEACIÓN</text>
    <text x="474" y="385" font-size="30" font-weight="700">LINE UP</text>
    <text x="474" y="423" font-size="30" font-weight="700">AND WAIT</text>
    <text x="474" y="500" font-size="23">Entrar en pista y esperar.</text>
    <text x="474" y="564" font-size="20" fill="#47606b">No iniciar la carrera.</text>
    <text x="844" y="324" font-size="20" font-weight="700">03 · DESPEGUE</text>
    <text x="844" y="384" font-size="27" font-weight="700">CLEARED FOR</text>
    <text x="844" y="422" font-size="30" font-weight="700">TAKE-OFF</text>
    <text x="844" y="500" font-size="23">Autorización explícita</text>
    <text x="844" y="534" font-size="23">para la pista indicada.</text>
    <text x="1214" y="324" font-size="20" font-weight="700">04 · EN EL AIRE</text>
    <text x="1214" y="383" font-size="30" font-weight="700">SALIDA</text>
    <text x="1214" y="467" font-size="23">Contactar según instrucción</text>
    <text x="1214" y="501" font-size="23">o procedimiento aplicable.</text>
    <text x="1214" y="564" font-size="20" fill="#47606b">No adivinar frecuencia.</text>
  </g>
  <rect x="76" y="669" width="1442" height="89" rx="22" fill="#ffffff" fill-opacity=".11"/>
  <text x="104" y="724" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Una pista libre, una espera larga o un avión listo no sustituyen CLEARED FOR TAKE-OFF.</text>
  <text x="76" y="812" fill="#c2ced6" font-family="Arial,sans-serif" font-size="19">Esquema didáctico; no representa una autorización, frecuencia ni procedimiento de un aeropuerto.</text>
</svg>
