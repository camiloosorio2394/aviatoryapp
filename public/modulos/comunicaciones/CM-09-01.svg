<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Escala de competencia lingüística OACI y regla de calificación</title>
  <desc id="desc">Los niveles van de uno a seis; el cuatro es el mínimo operacional. En un ejemplo de seis habilidades con valores cinco, cinco, cuatro, cinco, tres y cinco, la calificación global es tres porque prevalece la habilidad más baja.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1b2030"/><stop offset="1" stop-color="#38263f"/></linearGradient>
    <style>
      .ey{font:700 20px Arial,sans-serif;letter-spacing:3px;fill:#d3bfd7}.h{font:700 42px Arial,sans-serif;fill:#fff}.section{font:700 23px Arial,sans-serif;fill:#fff}.num{font:700 45px Arial,sans-serif;fill:#fff}.lab{font:700 23px Arial,sans-serif;fill:#fff}.small{font:500 19px Arial,sans-serif;fill:#dfd7e5}.mark{font:700 27px Arial,sans-serif;fill:#e1ffed}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text class="ey" x="72" y="75">COMPETENCIA LINGÜÍSTICA · DOC 9835</text>
  <text class="h" x="72" y="135">El nivel 4 es el piso, no un promedio</text>
  <text class="section" x="72" y="199">SEIS NIVELES</text>
  <g text-anchor="middle">
    <rect x="72" y="226" width="224" height="150" rx="18" fill="#4a4056"/><text class="num" x="184" y="290">1</text><text class="small" x="184" y="334">Preelemental</text>
    <rect x="310" y="226" width="224" height="150" rx="18" fill="#55475e"/><text class="num" x="422" y="290">2</text><text class="small" x="422" y="334">Elemental</text>
    <rect x="548" y="226" width="224" height="150" rx="18" fill="#655067"/><text class="num" x="660" y="290">3</text><text class="small" x="660" y="334">Preoperacional</text>
    <rect x="786" y="226" width="224" height="150" rx="18" fill="#246c64" stroke="#9fe8c6" stroke-width="4"/><text class="num" x="898" y="290">4</text><text class="small" x="898" y="334">Operacional</text>
    <rect x="1024" y="226" width="224" height="150" rx="18" fill="#426779"/><text class="num" x="1136" y="290">5</text><text class="small" x="1136" y="334">Avanzado</text>
    <rect x="1262" y="226" width="266" height="150" rx="18" fill="#51647b"/><text class="num" x="1395" y="290">6</text><text class="small" x="1395" y="334">Experto</text>
  </g>
  <path d="M779 210V397" stroke="#a6edcb" stroke-width="5" stroke-dasharray="11 8"/>
  <rect x="604" y="394" width="350" height="52" rx="13" fill="#185b55"/><text class="mark" x="779" y="428" text-anchor="middle">MÍNIMO OPERACIONAL →</text>
  <text class="section" x="72" y="500">SEIS HABILIDADES · EJEMPLO DIDÁCTICO</text>
  <text class="small" x="72" y="534">No son resultados de una persona ni una escala de aprobación parcial.</text>
  <g text-anchor="middle">
    <rect x="72" y="565" width="224" height="155" rx="16" fill="#45465e"/><text class="num" x="184" y="630">5</text><text class="small" x="184" y="678">Pronunciación</text>
    <rect x="310" y="565" width="224" height="155" rx="16" fill="#45465e"/><text class="num" x="422" y="630">5</text><text class="small" x="422" y="678">Estructura</text>
    <rect x="548" y="565" width="224" height="155" rx="16" fill="#3d5c70"/><text class="num" x="660" y="630">4</text><text class="small" x="660" y="678">Vocabulario</text>
    <rect x="786" y="565" width="224" height="155" rx="16" fill="#45465e"/><text class="num" x="898" y="630">5</text><text class="small" x="898" y="678">Fluidez</text>
    <rect x="1024" y="565" width="224" height="155" rx="16" fill="#80515e" stroke="#ffc6c0" stroke-width="4"/><text class="num" x="1136" y="630">3</text><text class="small" x="1136" y="678">Comprensión</text>
    <rect x="1262" y="565" width="266" height="155" rx="16" fill="#45465e"/><text class="num" x="1395" y="630">5</text><text class="small" x="1395" y="678">Interacciones</text>
  </g>
  <path d="M1136 727v34H920" stroke="#ffc6c0" stroke-width="5" fill="none"/>
  <rect x="72" y="775" width="1456" height="77" rx="16" fill="#603746"/>
  <text class="lab" x="105" y="823">RESULTADO GLOBAL: 3</text>
  <text class="small" x="485" y="823">La habilidad más baja fija el nivel global; no se promedian las seis.</text>
</svg>
