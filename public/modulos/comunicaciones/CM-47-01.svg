<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cuándo se emite un informe ADS-C</title>
  <desc id="desc">El sistema de tierra establece un contrato con la aeronave. Los informes automáticos pueden ser periódicos, por un suceso, a solicitud o de emergencia. Se distinguen de los mensajes CPDLC y no autorizan maniobras.</desc>
  <rect width="1600" height="900" fill="#101d2b"/>
  <g font-family="Arial,sans-serif">
    <text x="90" y="104" fill="#f3f9fb" font-size="48" font-weight="700">ADS-C: informar no es autorizar</text>
    <text x="92" y="159" fill="#bed0d8" font-size="27">La dependencia ATS establece condiciones de reporte con la aviónica</text>
    <rect x="90" y="213" width="1420" height="126" rx="23" fill="#28414e" stroke="#85decf" stroke-width="3"/>
    <text x="139" y="263" fill="#85decf" font-size="29" font-weight="700">SISTEMA DE TIERRA</text>
    <text x="139" y="308" fill="#edf8f8" font-size="25">Solicita cuándo reportar y qué datos incluir; el avión acepta y envía informes.</text>
    <path d="M800 346v49" stroke="#85decf" stroke-width="5"/><path d="m800 405-13-20h26z" fill="#85decf"/>
    <rect x="90" y="414" width="680" height="152" rx="24" fill="#203947" stroke="#85decf" stroke-width="3"/>
    <text x="127" y="470" fill="#85decf" font-size="32" font-weight="700">PERIÓDICO</text>
    <text x="127" y="516" fill="#f2f8fa" font-size="25">Informe a intervalos del contrato.</text>
    <rect x="830" y="414" width="680" height="152" rx="24" fill="#203947" stroke="#85decf" stroke-width="3"/>
    <text x="867" y="470" fill="#85decf" font-size="32" font-weight="700">POR SUCESO</text>
    <text x="867" y="516" fill="#f2f8fa" font-size="25">Ej.: cambio de punto o desviación lateral.</text>
    <rect x="90" y="590" width="680" height="152" rx="24" fill="#203947" stroke="#85decf" stroke-width="3"/>
    <text x="127" y="646" fill="#85decf" font-size="32" font-weight="700">A SOLICITUD</text>
    <text x="127" y="692" fill="#f2f8fa" font-size="25">Un informe puntual pedido desde tierra.</text>
    <rect x="830" y="590" width="680" height="152" rx="24" fill="#203947" stroke="#85decf" stroke-width="3"/>
    <text x="867" y="646" fill="#85decf" font-size="32" font-weight="700">EMERGENCIA</text>
    <text x="867" y="692" fill="#f2f8fa" font-size="25">Reporte señalado como emergencia.</text>
    <text x="94" y="818" fill="#f3f9fb" font-size="27">La tripulación mantiene la ruta autorizada y los medios ATC requeridos.</text>
  </g>
</svg>
