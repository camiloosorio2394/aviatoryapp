<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Función de 121,5 MHz frente al canal ATS en uso</title>
  <desc id="d">Esquema que distingue el mensaje en el canal actual, la recuperación de contacto por la frecuencia de emergencia y la escucha cuando es obligatoria o posible.</desc>
  <rect width="1600" height="900" fill="#0c1724"/>
  <g font-family="Arial, sans-serif">
    <text x="78" y="110" fill="#e9f7f3" font-size="50" font-weight="700">121,5 MHz: canal de emergencia</text>
    <text x="80" y="165" fill="#a7c5c1" font-size="26">Una herramienta para establecer contacto; no sustituye la frecuencia ATS asignada</text>
    <rect x="80" y="244" width="680" height="385" rx="34" fill="#172b3d" stroke="#6edac0" stroke-width="3"/>
    <rect x="840" y="244" width="680" height="385" rx="34" fill="#172b3d" stroke="#6edac0" stroke-width="3"/>
    <circle cx="145" cy="320" r="33" fill="#6edac0"/><text x="137" y="331" fill="#0c1724" font-size="32" font-weight="700">1</text>
    <circle cx="905" cy="320" r="33" fill="#6edac0"/><text x="897" y="331" fill="#0c1724" font-size="32" font-weight="700">2</text>
    <text x="202" y="331" fill="#e9f7f3" font-size="34" font-weight="700">Contacto normal disponible</text>
    <text x="962" y="331" fill="#e9f7f3" font-size="34" font-weight="700">Contacto no disponible</text>
    <text x="128" y="414" fill="#a7c5c1" font-size="27">Socorro o urgencia:</text>
    <text x="128" y="458" fill="#e9f7f3" font-size="29" font-weight="700">transmitir en el canal en uso</text>
    <text x="128" y="522" fill="#a7c5c1" font-size="24">ATS ya conoce la aeronave y</text>
    <text x="128" y="557" fill="#a7c5c1" font-size="24">puede coordinar la respuesta.</text>
    <text x="888" y="414" fill="#a7c5c1" font-size="27">Tras revisar radios y canales:</text>
    <text x="888" y="458" fill="#e9f7f3" font-size="29" font-weight="700">usar 121,5 MHz si procede</text>
    <text x="888" y="522" fill="#a7c5c1" font-size="24">Contactar ATS o pedir ayuda;</text>
    <text x="888" y="557" fill="#a7c5c1" font-size="24">volver al canal ATS cuando proceda.</text>
    <rect x="80" y="691" width="1440" height="125" rx="29" fill="#203648"/>
    <text x="119" y="742" fill="#e9f7f3" font-size="28" font-weight="700">Escucha de 121,5 MHz</text>
    <text x="119" y="786" fill="#a7c5c1" font-size="24">Depende de la norma, zona, capacidad del equipo y procedimiento del explotador; no es universal.</text>
  </g>
</svg>
