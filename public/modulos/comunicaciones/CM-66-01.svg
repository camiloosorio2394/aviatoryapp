<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro contrastes de sentido en radiotelefonía</title>
  <desc id="desc">Distinguir recibido de sí, cortesía de petición, expectativa de autorización y número supuesto de número confirmado.</desc>
  <rect width="1600" height="900" fill="#102235"/>
  <rect x="70" y="60" width="1460" height="780" rx="32" fill="#1c3548" stroke="#4d7181" stroke-width="2"/>
  <text x="120" y="145" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">INGLÉS OPERACIONAL</text>
  <text x="120" y="208" fill="#fff" font-family="Arial,sans-serif" font-size="49" font-weight="700">El significado importa más que el acento</text>
  <text x="120" y="258" fill="#cbdbe3" font-family="Arial,sans-serif" font-size="25">Identifica qué comunica cada palabra antes de responder o actuar.</text>
  <g font-family="Arial,sans-serif">
    <rect x="120" y="326" width="660" height="188" rx="23" fill="#29475b" stroke="#699b96"/>
    <text x="152" y="378" fill="#a7f3d0" font-size="26" font-weight="700">01 · ACUSE ≠ RESPUESTA</text>
    <text x="152" y="427" fill="#fff" font-size="28" font-weight="700">ROGER no significa «sí puedo»</text>
    <text x="152" y="470" fill="#d8e6eb" font-size="22">Responde la capacidad o disponibilidad.</text>
    <rect x="820" y="326" width="660" height="188" rx="23" fill="#29475b" stroke="#699b96"/>
    <text x="852" y="378" fill="#a7f3d0" font-size="26" font-weight="700">02 · CORTESÍA ≠ PETICIÓN</text>
    <text x="852" y="427" fill="#fff" font-size="28" font-weight="700">El mensaje útil debe llegar primero</text>
    <text x="852" y="470" fill="#d8e6eb" font-size="22">Indicativo, solicitud y motivo breve.</text>
    <rect x="120" y="538" width="660" height="188" rx="23" fill="#29475b" stroke="#699b96"/>
    <text x="152" y="590" fill="#a7f3d0" font-size="26" font-weight="700">03 · EXPECTATIVA ≠ AUTORIZACIÓN</text>
    <text x="152" y="639" fill="#fff" font-size="27" font-weight="700">Lo esperado no habilita la maniobra</text>
    <text x="152" y="682" fill="#d8e6eb" font-size="22">Espera la instrucción aplicable y colaciónala.</text>
    <rect x="820" y="538" width="660" height="188" rx="23" fill="#215044" stroke="#93dfba"/>
    <text x="852" y="590" fill="#a7f3d0" font-size="26" font-weight="700">04 · SUPOSICIÓN ≠ CONFIRMACIÓN</text>
    <text x="852" y="639" fill="#fff" font-size="27" font-weight="700">Una cifra crítica se verifica</text>
    <text x="852" y="682" fill="#d8e6eb" font-size="22">Colación completa; si hay duda, pregunta.</text>
  </g>
  <text x="120" y="790" fill="#b6cbd2" font-family="Arial,sans-serif" font-size="22">Esquema didáctico: aplica siempre la fraseología y el procedimiento vigentes.</text>
</svg>
