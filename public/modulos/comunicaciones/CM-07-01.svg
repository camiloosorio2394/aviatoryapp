<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Estructura de una transmisión de radio aeronáutica</title>
  <desc id="desc">Tres bandas muestran el orden de una llamada inicial, una instrucción y una colación. El distintivo se conserva para identificar al destinatario y a quien responde.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191d2d"/><stop offset="1" stop-color="#342139"/></linearGradient>
    <style>
      .h{font:700 42px Arial,sans-serif;fill:#fff}.k{font:700 22px Arial,sans-serif;letter-spacing:3px;fill:#cdb7d5}.lbl{font:700 23px Arial,sans-serif;fill:#cfc4d4}.txt{font:700 30px Arial,sans-serif;fill:#fff}.small{font:500 23px Arial,sans-serif;fill:#e7e0e9}.n{font:700 23px Arial,sans-serif;fill:#241b2b}
    </style>
  </defs>
  <rect width="1600" height="900" rx="26" fill="url(#bg)"/>
  <text class="k" x="86" y="91">COMUNICACIONES · ESTRUCTURA</text>
  <text class="h" x="86" y="153">La identidad abre y cierra el intercambio</text>

  <text class="lbl" x="86" y="242">1 · EL PILOTO INICIA LA LLAMADA</text>
  <rect x="86" y="266" width="427" height="112" rx="15" fill="#806288"/>
  <rect x="527" y="266" width="413" height="112" rx="15" fill="#55435e"/>
  <rect x="954" y="266" width="560" height="112" rx="15" fill="#334756"/>
  <text class="small" x="108" y="303">¿A quién llamo?</text><text class="txt" x="108" y="349">ESTACIÓN</text>
  <text class="small" x="549" y="303">¿Quién soy?</text><text class="txt" x="549" y="349">DISTINTIVO COMPLETO</text>
  <text class="small" x="976" y="303">¿Dónde estoy / qué necesito?</text><text class="txt" x="976" y="349">POSICIÓN + SOLICITUD</text>

  <text class="lbl" x="86" y="475">2 · CONTROL RESPONDE</text>
  <rect x="86" y="499" width="540" height="109" rx="15" fill="#806288"/>
  <rect x="640" y="499" width="874" height="109" rx="15" fill="#334756"/>
  <text class="small" x="108" y="535">¿A quién se dirige?</text><text class="txt" x="108" y="581">DISTINTIVO DEL VUELO</text>
  <text class="small" x="662" y="535">¿Qué autoriza, instruye o informa?</text><text class="txt" x="662" y="581">MENSAJE DE CONTROL</text>

  <text class="lbl" x="86" y="705">3 · EL PILOTO COLACIONA</text>
  <rect x="86" y="729" width="870" height="102" rx="15" fill="#334756"/>
  <rect x="970" y="729" width="544" height="102" rx="15" fill="#806288"/>
  <text class="txt" x="108" y="792">ELEMENTOS QUE DEBEN REPETIRSE</text>
  <text class="txt" x="992" y="792">DISTINTIVO AL FINAL</text>
  <text class="small" x="86" y="868">Esquema pedagógico de orden; no es una autorización ni sustituye el procedimiento local.</text>
</svg>
