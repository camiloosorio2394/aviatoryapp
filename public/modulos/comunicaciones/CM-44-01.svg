<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Selección operacional entre voz y CPDLC</title>
  <desc id="desc">La voz resuelve lo inmediato, lo ambiguo y una falla de enlace. CPDLC permite intercambios estructurados cuando el servicio está disponible; cada mensaje se revisa y responde en su medio. La publicación local y el operador fijan los detalles.</desc>
  <rect width="1600" height="900" fill="#101d2b"/>
  <g font-family="Arial,sans-serif">
    <text x="92" y="108" fill="#f3f9fb" font-size="51" font-weight="700">Elegir el medio sin perder la autorización</text>
    <text x="94" y="165" fill="#b9cad3" font-size="27">No hay una regla universal: manda el servicio publicado y la situación</text>
    <rect x="91" y="233" width="680" height="410" rx="27" fill="#203947" stroke="#84ddcf" stroke-width="4"/>
    <text x="132" y="303" fill="#84ddcf" font-size="38" font-weight="700">VOZ</text>
    <text x="132" y="363" fill="#f3f9fb" font-size="29">• Instrucción inmediata o urgente</text>
    <text x="132" y="414" fill="#f3f9fb" font-size="29">• Duda, conflicto o mensaje tardío</text>
    <text x="132" y="465" fill="#f3f9fb" font-size="29">• Falla del enlace de datos</text>
    <text x="132" y="553" fill="#c9d8df" font-size="26">La instrucción oral requiere colación</text>
    <text x="132" y="590" fill="#c9d8df" font-size="26">según el elemento recibido.</text>
    <rect x="829" y="233" width="680" height="410" rx="27" fill="#203947" stroke="#84ddcf" stroke-width="4"/>
    <text x="870" y="303" fill="#84ddcf" font-size="38" font-weight="700">CPDLC</text>
    <text x="870" y="363" fill="#f3f9fb" font-size="29">• Mensaje estructurado disponible</text>
    <text x="870" y="414" fill="#f3f9fb" font-size="29">• Revisión de ambos pilotos</text>
    <text x="870" y="465" fill="#f3f9fb" font-size="29">• Respuesta habilitada en pantalla</text>
    <text x="870" y="553" fill="#c9d8df" font-size="26">Un acuse técnico no sustituye una</text>
    <text x="870" y="590" fill="#c9d8df" font-size="26">respuesta operacional.</text>
    <rect x="91" y="692" width="1418" height="129" rx="26" fill="#2a3b4b"/>
    <text x="131" y="751" fill="#84ddcf" font-size="29" font-weight="700">Al pasar de un medio al otro, cerrar la instrucción anterior y confirmar cuál rige.</text>
    <text x="131" y="792" fill="#f3f9fb" font-size="23">No ejecutar mensajes contradictorios sin aclaración con la dependencia activa.</text>
  </g>
</svg>
