<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Letreros de punto de espera por categoría de aproximación</title>
  <desc id="desc">Cuatro letreros rojos con texto blanco: 25 CAT II, 25 CAT III, 25 CAT II/III y 25 CAT I/II/III.</desc>
  <defs>
    <linearGradient id="fondo" x2="0" y2="1">
      <stop stop-color="#e7e9e8"/>
      <stop offset="1" stop-color="#cbd1d0"/>
    </linearGradient>
    <linearGradient id="cara" x2="0" y2="1">
      <stop stop-color="#b62635"/>
      <stop offset="1" stop-color="#951724"/>
    </linearGradient>
    <filter id="sombra" x="-15%" y="-30%" width="130%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="11"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .borde { fill: url(#cara); stroke: #262a2b; stroke-width: 13; }
      .letra { fill: #fff; stroke: #191d1e; stroke-width: 3; paint-order: stroke fill; font: 700 67px Arial, Helvetica, sans-serif; letter-spacing: 1px; text-anchor: middle; dominant-baseline: middle; }
      .letra-larga { font-size: 56px; }
      .letra-muy-larga { font-size: 48px; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="url(#fondo)"/>
  <rect x="45" y="45" width="1110" height="710" rx="26" fill="#f4f5f3" stroke="#aeb8b4" stroke-width="2"/>
  <g filter="url(#sombra)">
    <rect class="borde" x="104" y="162" width="440" height="162" rx="4"/>
    <rect class="borde" x="656" y="162" width="440" height="162" rx="4"/>
    <rect class="borde" x="84" y="469" width="480" height="162" rx="4"/>
    <rect class="borde" x="611" y="469" width="525" height="162" rx="4"/>
  </g>
  <g class="letra">
    <text x="324" y="245">25 CAT II</text>
    <text x="876" y="245">25 CAT III</text>
    <text class="letra-larga" x="324" y="552">25 CAT II/III</text>
    <text class="letra-muy-larga" x="873" y="552">25 CAT I/II/III</text>
  </g>
</svg>
