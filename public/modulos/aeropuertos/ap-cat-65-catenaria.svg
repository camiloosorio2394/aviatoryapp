<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Destellos de las torres de catenaria</title>
  <desc id="desc">Dos torres con un cable curvo. Las luces blancas se encienden en orden: primero nivel medio, después cima y al final nivel del punto más bajo del cable.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#30444a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
    <style>.tower{fill:none;stroke:#a1b3b6;stroke-width:8}.cross{stroke:#819a9f;stroke-width:5}.level{stroke:#75bbaa;stroke-width:2;stroke-dasharray:12 11}.call{fill:#eafaf5;font:600 32px Arial,Helvetica,sans-serif}.note{fill:#afd1c8;font:500 25px Arial,Helvetica,sans-serif}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 814Q480 800 780 810T1600 790v110H0Z" fill="#263a37"/>
  <g class="tower">
    <path d="M190 808 295 215 400 808M260 420h70M227 620h136M188 808h216M234 620l96-200m-69 0 102 200M190 808l173-188m-136 0 173 188"/>
    <path d="M1195 808 1290 215 1385 808M1265 420h50M1232 620h116M1194 808h192M1232 620l83-200m-50 0 83 200M1195 808l153-188m-116 0 153 188"/>
    <path d="M230 240h130M1225 240h130"/>
  </g>
  <path d="M295 240C540 744 1045 744 1290 240" fill="none" stroke="#d1dce0" stroke-width="7"/>
  <path d="M290 272C550 764 1035 764 1295 272" fill="none" stroke="#7a989d" stroke-width="3"/>
  <g class="level">
    <path d="M295 240h1160"/><path d="M295 420h1160"/><path d="M295 618h1160"/>
  </g>
  <g fill="#fff" filter="url(#glow)">
    <circle cx="295" cy="240" r="23"/><circle cx="295" cy="420" r="23"/><circle cx="295" cy="618" r="23"/>
  </g>
  <g fill="#fff">
    <circle cx="295" cy="240" r="9"/><circle cx="295" cy="420" r="9"/><circle cx="295" cy="618" r="9"/>
  </g>
  <rect x="917" y="154" width="555" height="70" rx="12" fill="#14312f" stroke="#6dc8ae" stroke-width="2"/>
  <text class="call" x="943" y="200">2 · Cima de la torre</text>
  <rect x="917" y="341" width="555" height="70" rx="12" fill="#14312f" stroke="#6dc8ae" stroke-width="2"/>
  <text class="call" x="943" y="387">1 · Mitad de la altura</text>
  <rect x="917" y="554" width="555" height="70" rx="12" fill="#14312f" stroke="#6dc8ae" stroke-width="2"/>
  <text class="call" x="943" y="600">3 · Punto más bajo del cable</text>
  <path d="M600 715q200 70 400 0" fill="none" stroke="#94aea9" stroke-width="2" stroke-dasharray="8 12"/>
  <text class="note" x="553" y="845">Orden de los destellos blancos: medio → superior → inferior</text>
</svg>
