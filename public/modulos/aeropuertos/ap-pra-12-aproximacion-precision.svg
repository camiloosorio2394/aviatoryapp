<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Planta de luces de aproximación</title>
  <desc id="desc">Eje blanco de 900 metros, dos barras transversales y dos filas laterales rojas próximas al umbral.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#101d24"/><stop offset="1" stop-color="#23373a"/></linearGradient>
    <pattern id="axis" width="40" height="24" patternUnits="userSpaceOnUse"><circle cx="20" cy="12" r="8" fill="#fffef2"/></pattern>
    <pattern id="side" width="40" height="24" patternUnits="userSpaceOnUse"><circle cx="20" cy="12" r="9" fill="#ff666b"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <path d="M1400 270H1600V630H1400Z" fill="#384544"/>
  <path d="M1417 270V630" stroke="#a3ead3" stroke-width="7"/>
  <path d="M1428 450H1600" stroke="#edf2e9" stroke-width="5" stroke-dasharray="40 36" opacity=".7"/>
  <g opacity=".28" filter="url(#glow)"><path d="M200 450H1400" stroke="#fff" stroke-width="24"/><path d="M1040 340H1400M1040 560H1400" stroke="#ff7778" stroke-width="22"/></g>
  <path d="M200 438H1400V462H200Z" fill="url(#axis)"/>
  <path d="M1040 328H1400V352H1040ZM1040 548H1400V572H1040Z" fill="url(#side)"/>
  <g fill="#fffef2">
    <circle cx="1000" cy="330" r="8"/><circle cx="1000" cy="370" r="8"/><circle cx="1000" cy="410" r="8"/><circle cx="1000" cy="450" r="8"/><circle cx="1000" cy="490" r="8"/><circle cx="1000" cy="530" r="8"/><circle cx="1000" cy="570" r="8"/>
    <circle cx="1200" cy="360" r="8"/><circle cx="1200" cy="390" r="8"/><circle cx="1200" cy="420" r="8"/><circle cx="1200" cy="450" r="8"/><circle cx="1200" cy="480" r="8"/><circle cx="1200" cy="510" r="8"/><circle cx="1200" cy="540" r="8"/>
  </g>
  <g fill="none" stroke="#a3ead3" stroke-width="2" opacity=".88">
    <path d="M220 698H1400M220 689V707M1400 689V707M1000 698V726M1200 698V726"/>
    <path d="M1040 264H1400M1040 255V273M1400 255V273"/>
  </g>
  <g fill="#a3ead3" font-family="Arial, sans-serif" font-size="36" font-weight="700">
    <text x="625" y="748">900 m</text><text x="946" y="771">300 m</text><text x="1160" y="771">150 m</text><text x="1170" y="248">270 m</text>
  </g>
  <text x="1440" y="248" fill="#d5f7e9" font-family="Arial, sans-serif" font-size="35" font-weight="700">UMBRAL</text>
</svg>
