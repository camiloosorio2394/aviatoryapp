<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Diez tipos de luz de obstáculo</title>
  <desc id="desc">Tabla técnica de luces de baja, mediana y alta intensidad, con color, ritmo fijo o destellante e intensidad en candelas.</desc>
  <defs>
    <style>
      .row-a { fill:#17272c; }.row-b { fill:#1d3035; }
      .name { fill:#f3f7f6; font:600 29px Arial,Helvetica,sans-serif; }
      .meta { fill:#a9c9c3; font:500 22px Arial,Helvetica,sans-serif; }
      .flash { fill:none; stroke:#80d4bf; stroke-width:3; stroke-dasharray:6 6; }
      .rule { stroke:#44615d; stroke-width:2; }
    </style>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="#0e1b20"/>
  <rect x="35" y="28" width="1530" height="844" rx="22" fill="#132329" stroke="#456962" stroke-width="2"/>
  <text x="85" y="82" fill="#e9f6f3" font="700 37px Arial,Helvetica,sans-serif">Luces de obstáculo · 10 tipos</text>
  <text x="86" y="122" fill="#9fcabf" font="500 21px Arial,Helvetica,sans-serif">Punto continuo = fija  ·  Anillo discontinuo = destellos</text>
  <path d="M70 144h1460" class="rule"/>
  <g>
    <rect class="row-a" x="70" y="157" width="1460" height="66"/><rect class="row-b" x="70" y="223" width="1460" height="66"/>
    <rect class="row-a" x="70" y="289" width="1460" height="66"/><rect class="row-b" x="70" y="355" width="1460" height="66"/>
    <rect class="row-a" x="70" y="421" width="1460" height="66"/><rect class="row-b" x="70" y="487" width="1460" height="66"/>
    <rect class="row-a" x="70" y="553" width="1460" height="66"/><rect class="row-b" x="70" y="619" width="1460" height="66"/>
    <rect class="row-a" x="70" y="685" width="1460" height="66"/><rect class="row-b" x="70" y="751" width="1460" height="66"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="111" cy="190" r="12" fill="#ec4249"/><circle cx="111" cy="256" r="12" fill="#ec4249"/>
    <path d="M99 322h12v-12a12 12 0 0 1 0 24v-12z" fill="#f5bf45"/><path d="M111 310a12 12 0 0 1 0 24z" fill="#42a3ee"/>
    <circle cx="111" cy="388" r="12" fill="#f5bf45"/><circle cx="111" cy="454" r="12" fill="#ec4249"/>
    <circle cx="111" cy="520" r="12" fill="#fff"/><circle cx="111" cy="586" r="12" fill="#ec4249"/>
    <circle cx="111" cy="652" r="12" fill="#ec4249"/><circle cx="111" cy="718" r="12" fill="#fff"/>
    <circle cx="111" cy="784" r="12" fill="#fff"/>
  </g>
  <g class="flash">
    <circle cx="111" cy="322" r="24"/><circle cx="111" cy="388" r="24"/><circle cx="111" cy="454" r="24"/>
    <circle cx="111" cy="520" r="24"/><circle cx="111" cy="586" r="24"/>
    <circle cx="111" cy="718" r="24"/><circle cx="111" cy="784" r="24"/>
  </g>
  <g class="name">
    <text x="165" y="200">Baja A · roja fija · 10 cd</text>
    <text x="165" y="266">Baja B · roja fija · 32 cd</text>
    <text x="165" y="332">Baja C · amarilla o azul de destellos · 40 cd</text>
    <text x="165" y="398">Baja D · amarilla de destellos · 200 cd</text>
    <text x="165" y="464">Baja E · roja de destellos · 32 cd</text>
    <text x="165" y="530">Mediana A · blanca de destellos · 20 000 cd</text>
    <text x="165" y="596">Mediana B · roja de destellos · 2 000 cd</text>
    <text x="165" y="662">Mediana C · roja fija · 2 000 cd</text>
    <text x="165" y="728">Alta A · blanca de destellos · 200 000 cd</text>
    <text x="165" y="794">Alta B · blanca de destellos · 100 000 cd</text>
  </g>
  <g class="meta" text-anchor="end">
    <text x="1480" y="200">fija</text><text x="1480" y="266">fija</text>
    <text x="1480" y="332">60–90/min</text><text x="1480" y="398">60–90/min</text><text x="1480" y="464">destellos</text>
    <text x="1480" y="530">20–60/min · día</text><text x="1480" y="596">20–60/min</text><text x="1480" y="662">fija</text>
    <text x="1480" y="728">40–60/min · día</text><text x="1480" y="794">40–60/min · día</text>
  </g>
  <text x="90" y="850" fill="#8bb1a9" font="500 20px Arial,Helvetica,sans-serif">En la mediana A, la intensidad nocturna es 2 000 cd; las intensidades altas indicadas corresponden al día.</text>
</svg>
