<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Transportar combustible también consume combustible</title>
<desc id="desc">Dos perfiles del mismo trayecto. Arriba, el vuelo normal, con el combustible requerido y el consumo del trayecto. Abajo, con tankering: el mismo avión con un bloque adicional de combustible, más peso al despegue y más consumo; al llegar, el bloque que sobra es menor que el que se cargó de más, porque la diferencia se quemó para transportarlo.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Transportar combustible también consume combustible</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Lo que se carga de más no llega entero</text>
<rect x="56" y="160" width="1488" height="300" rx="16" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="204" font-size="22" font-weight="700" fill="#005071" letter-spacing="1.5">VUELO NORMAL</text><path d="M240 410L400 270L1200 270L1360 410" fill="none" stroke="#A89F94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/><rect x="130" y="266.25" width="70" height="143.75" rx="4" fill="#2F92B8"/><text x="165" y="440" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">al despegar</text><rect x="1400" y="341.25" width="70" height="68.75" rx="4" fill="#2F92B8"/><text x="1435" y="440" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">al llegar</text><g transform="translate(800 262) scale(0.9)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><rect x="680.6" y="312" width="238.7" height="36" rx="18" fill="#E8F6FD"/><text x="800" y="337.2" font-size="20" font-weight="700" fill="#005071" text-anchor="middle">consumo del trayecto</text><rect x="56" y="490" width="1488" height="300" rx="16" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="534" font-size="22" font-weight="700" fill="#005071" letter-spacing="1.5">CON TANKERING</text><path d="M240 740L400 600L1200 600L1360 740" fill="none" stroke="#A89F94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/><rect x="130" y="550" width="70" height="190" rx="4" fill="#2F92B8"/><text x="165" y="770" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">al despegar</text><rect x="130" y="550" width="70" height="46.25" rx="4" fill="#005071"/><rect x="1400" y="633.75" width="70" height="106.25" rx="4" fill="#2F92B8"/><text x="1435" y="770" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">al llegar</text><rect x="1400" y="633.75" width="70" height="37.5" rx="4" fill="#005071"/><g transform="translate(800 592) scale(0.9)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><rect x="589.7" y="642" width="420.6" height="36" rx="18" fill="#F6DEDA"/><text x="800" y="667.2" font-size="20" font-weight="700" fill="#B3372B" text-anchor="middle">consumo mayor: el avión va más pesado</text><path d="M230 590L300 590" fill="none" stroke="#005071" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><text x="310" y="596" font-size="20" font-weight="700" fill="#005071">peso mayor al despegue</text><text x="1386" y="560" font-size="20" font-weight="700" fill="#B3372B" text-anchor="end"><tspan x="1386" dy="0">llega menos de lo que se cargó de más:</tspan><tspan x="1386" dy="24">la diferencia se quemó para transportarlo</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C11</text>
</svg>
