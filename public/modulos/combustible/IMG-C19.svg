<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Esperar en destino recorta las opciones</title>
<desc id="desc">Línea de tiempo de la llegada a un destino con tres bandas de combustible que se consumen de izquierda a derecha: discrecional y contingencia, luego alterno y al final reserva final. Tres marcas: desvío temprano, con todas las opciones; último momento para ir al alterno con la reserva final; y, desde ahí, comprometido con el destino. Debajo, el aeropuerto alterno se va llenando de aviones desviados.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Esperar en destino recorta las opciones</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Mientras se espera, el combustible y el alterno se van gastando</text>
<rect x="100" y="330" width="600" height="70" fill="#2F92B8"/><text x="400" y="374" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">discrecional y contingencia</text><rect x="700" y="330" width="460" height="70" fill="#005071"/><text x="930" y="374" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">alterno</text><rect x="1160" y="330" width="340" height="70" fill="#B3372B"/><text x="1330" y="374" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">reserva final</text><path d="M100 430L1500 430" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><text x="1500" y="466" font-size="20" fill="#6F665B" text-anchor="end">tiempo en el destino</text><path d="M300 300L300 440" fill="none" stroke="#2E7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="300" r="9" fill="#2E7A4B"/><text x="300" y="230" font-size="22" font-weight="700" fill="#2E7A4B" text-anchor="middle"><tspan x="300" dy="0">desvío temprano:</tspan><tspan x="300" dy="26">todas las opciones</tspan></text><path d="M700 300L700 440" fill="none" stroke="#A86400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="300" r="9" fill="#A86400"/><text x="700" y="230" font-size="22" font-weight="700" fill="#A86400" text-anchor="middle"><tspan x="700" dy="0">último momento para ir</tspan><tspan x="700" dy="26">al alterno con reserva final</tspan></text><path d="M1160 300L1160 440" fill="none" stroke="#B3372B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1160" cy="300" r="9" fill="#B3372B"/><text x="1160" y="230" font-size="22" font-weight="700" fill="#B3372B" text-anchor="middle"><tspan x="1160" dy="0">desde aquí:</tspan><tspan x="1160" dy="26">comprometido con el destino</tspan></text><text x="100" y="560" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">EL ALTERNO</text><rec