<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La suma del block fuel</title>
<desc id="desc">Siete bloques con su nombre en español y en inglés y el signo más entre ellos: rodaje 200, trayecto 3.000, contingencias 200, alterno 1.100, reserva final 1.150, adicional 0 y discrecional 300, que desembocan en el block fuel, 5.950 kg. Debajo, en gris: block fuel menos rodaje es el combustible de despegue, 5.750 kg; y combustible de despegue menos trayecto es el combustible previsto al aterrizaje, 2.750 kg.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La suma del block fuel</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Siete sumandos y un total</text>
<rect x="56" y="200" width="176" height="170" rx="14" fill="#E8F6FD" stroke="#2F92B8" stroke-width="3"/><text x="144" y="244" font-size="22" font-weight="700" fill="#005071" text-anchor="middle"><tspan x="144" dy="0">Rodaje</tspan></text><text x="144" y="306" font-size="18" fill="#6F665B" text-anchor="middle" font-style="italic">Taxi</text><text x="144" y="346" font-size="28" font-weight="700" fill="#231F1A" text-anchor="middle">200</text><text x="253" y="300" font-size="40" font-weight="700" fill="#005071" text-anchor="middle">+</text><rect x="274" y="200" width="176" height="170" rx="14" fill="#E8F6FD" stroke="#2F92B8" stroke-width="3"/><text x="362" y="244" font-size="22" font-weight="700" fill="#005071" text-anchor="middle"><tspan x="362" dy="0">Trayecto</tspan></text><text x="362" y="306" font-size="18" fill="#6F665B" text-anchor="middle" font-style="italic">Trip</text><text x="362" y="346" font-size="28" font-weight="700" fill="#231F1A" text-anchor="middle">3.000</text><text x="471" y="300" font-size="40" font-weight="700" fill="#005071" text-anchor="middle">+</text><rect x="492" y="200" width="176" height="170" rx="14" fill="#E8F6FD" stroke="#2F92B8" stroke-width="3"/><text x="580" y="244" font-size="22" font-weight="700" fill="#005071" text-anchor="middle"><tspan x="580" dy="0">Contingencias</tspan></text><text x="580" y="306" font-size="18" fill="#6F665B" text-anchor="middle" font-style="italic">Contingency</text><text x="580" y="346" font-size="28" font-weight="700" fill="#231F1A" text-anchor="middle">200</text><text x="689" y="300" font-size="40" font-weight="700" fill="#005071" text-anchor="middle">+</text><rect x="710" y="200" width="176" height="170" rx="14" fill="#E8F6FD" stroke="#2F92B8" stroke-width="3"/><text x="798" y="244" font-size="22" font-weight="700" fill="#005071" text-anchor="middle"><tspan x="798" dy="0">Alterno</tspan></text><text x="798" y="306" font-size="18" fill="#6F665B" text-anchor="middle" font-style="italic">Alternate</text><text x="798" y="346" font-size="28" font-weight="700" fill="#231F1A" text-anchor="middle">1.100</text><text x="907" y="300" font-size="40" font-weight="700" fill="#005071" text-anchor="middle">+</text><rect x="928" y="200" width="176" height="170" rx="14" fill="#F6DEDA" stroke="#B3372B" stroke-width="3"/><text x="1016" y="244" font-size="22" font-weight="700" fill="#B3372B" text-anchor="middle"><tspan x="1016" dy="0">Reserva final</tspan></text><text x="1016" y="306" font-size="18" fill="#6F665B" text-anchor="middle" font-style="italic">Final reserve</text><text x="1016" y="346" font-size="28" font-weight="700" fill="#231F1A" text-anchor="middle">1.150</text><text x="1125" y="300" font-size="40" font-weight="700" fill="#005071" text-anchor="middle">+</text><rect x="1146" y="200" width="176" height="170" rx="14" fill="#E8F6FD" stroke="#2F92B8" stroke-width="3"/><text x="1234" y="244" font-size="22" font-weight="700" fill="#005071" text-anchor="middle"><tspan x="1234" dy="0">Adicional</tspan></text><text x="1234" y="306" font-size="18" fill="#6F665B" text-anchor="middle" font-style="italic">Additional</text><text x="1234" y="346" font-size="28" font-weight="700" fill="#231F1A" text-anchor="middle">0</text><text x="1343" y="300" font-size="40" font-weight="700" fill="#005071" text-anchor="middle">+</text><rect x="1364" y="200" width="176" height="170" rx="14" fill="#E8F6FD" stroke="#2F92B8" stroke-width="3"/><text x="1452" y="244" font-size="22" font-weight="700" fill="#005071" text-anchor="middle"><tspan x="1452" dy="0">Discrecional</tspan></text><text x="1452" y="306" font-size="18" fill="#6F665B" text-anchor="middle" font-style="italic">Extra</text><text x="1452" y="346" font-size="28" font-weight="700" fill="#231F1A" text-anchor="middle">300</text><path d="M800 390L800 440" fill="none" stroke="#005071" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="520" y="450" width="560" height="120" rx="18" fill="#005071"/><text x="800" y="506" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BLOCK FUEL</text><text x="800" y="548" font-size="30" font-weight="700" fill="#E8F6FD" text-anchor="middle">5.950 kg</text><text x="800" y="660" font-size="24" fill="#6F665B" text-anchor="middle">Block fuel − rodaje = combustible de despegue · 5.950 − 200 = 5.750 kg</text><text x="800" y="710" font-size="24" fill="#6F665B" text-anchor="middle">Combustible de despegue − trayecto = combustible previsto al aterrizaje · 5.750 − 3.000 = 2.750 kg</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C04</text>
</svg>
