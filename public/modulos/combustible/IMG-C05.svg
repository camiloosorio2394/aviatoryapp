<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Qué cubre el trip fuel</title>
<desc id="desc">Perfil de un vuelo de origen a destino. El rodaje va en gris, fuera del trip fuel. Despegue, ascenso, crucero con un escalón de nivel, descenso, aproximación y aterrizaje van dentro de una llave rotulada trip fuel. Desde la aproximación, en línea de puntos, una frustrada rotulada: no es trip, va en el combustible para el alterno.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="700" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Qué cubre el trip fuel</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Del despegue al aterrizaje en destino, y nada más</text>
<path d="M56 560L1544 560" fill="none" stroke="#C9B797" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 556L200 556" fill="none" stroke="#A89F94" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="596" font-size="22" font-weight="700" fill="#A89F94" text-anchor="middle">rodaje</text><path d="M200 556L480 290L760 290L800 250L1150 250L1370 480L1440 556" fill="none" stroke="#005071" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="530" font-size="20" font-weight="700" fill="#005071">despegue y ascenso</text><text x="620" y="276" font-size="20" font-weight="700" fill="#005071" text-anchor="middle">crucero</text><text x="780" y="236" font-size="20" font-weight="700" fill="#005071" text-anchor="middle">escalón</text><text x="1000" y="236" font-size="20" font-weight="700" fill="#005071" text-anchor="middle">crucero</text><text x="1290" y="356" font-size="20" font-weight="700" fill="#005071">descenso</text><text x="1380" y="540" font-size="20" font-weight="700" fill="#005071" text-anchor="end">aproximación y aterrizaje</text><path d="M1400 506C1430 480 1470 420 1520 390" fill="none" stroke="#B3372B" stroke-width="3.5" stroke-dasharray="4 8" marker-end="url(#f-rojo)"/><text x="1540" y="260" font-size="20" font-weight="700" fill="#B3372B" text-anchor="end"><tspan x="1540" dy="0">no es trip: va en el</tspan><tspan x="1540" dy="24">combustible para el alterno</tspan></text><path d="M200 200Q200 180 220 180L800 180Q820 180 820 160Q820 180 840 180L1420 180Q1440 180 1440 200" fill="none" stroke="#005071" stroke-width="3.5"/><text x="820" y="150" font-size="28" font-weight="700" fill="#005071" text-anchor="middle" font-style="italic">Trip fuel</text><text x="140" y="200" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle">ORIGEN</text><text x="1440" y="596" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle">DESTINO</text>
<text x="1560" y="676" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C05</text>
