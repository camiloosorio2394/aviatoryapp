<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Cuánto tiempo aguanta la espera</title>
<desc id="desc">Vista en planta de un circuito de espera junto a un reloj de arena. Arriba del reloj, el combustible al entrar: 2.950 kg. Abajo, el combustible para abandonar la espera hacia el alterno: 2.250 kg. Entre los dos, el tiempo disponible, 17 minutos, y una flecha que sale de la espera hacia el alterno a la hora límite. Cifras ilustrativas.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Cuánto tiempo aguanta la espera</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Se calcula antes de aceptarla, no dentro de ella</text>
<path d="M260 380L620 380A90 90 0 0 1 620 560L260 560A90 90 0 0 1 260 380Z" fill="none" stroke="#005071" stroke-width="5"/><path d="M440 380L470 380" fill="none" stroke="#005071" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><path d="M460 560L430 560" fill="none" stroke="#005071" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><g transform="translate(330 372) scale(0.6)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><text x="440" y="620" font-size="22" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1.5">ESPERA</text><path d="M710 470C820 470 900 520 1000 700" fill="none" stroke="#B3372B" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#f-rojo)"/><text x="900" y="740" font-size="22" font-weight="700" fill="#B3372B" text-anchor="middle"><tspan x="900" dy="0">hacia el alterno,</tspan><tspan x="900" dy="26">a la hora límite</tspan></text><path d="M1120 220L1400 220L1280 460L1400 700L1120 700L1240 460Z" fill="#E8F6FD" stroke="#005071" stroke-width="4" stroke-linejoin="round"/><path d="M1160 280L1360 280L1274 450L1246 450Z" fill="#2F92B8"/><path d="M1140 700L1380 700L1320 610L1200 610Z" fill="#2F92B8"/><text x="1260" y="200" font-size="24" font-weight="700" fill="#005071" text-anchor="middle">al entrar: 2.950 kg</text><text x="1260" y="740" font-size="24" font-weight="700" fill="#B3372B" text-anchor="middle"><tspan x="1260" dy="0">para ir al alterno: 2.250 kg</tspan></text><rect x="1430" y="436" width="148.2" height="48" rx="24" fill="#005071"/><text x="1504.1" y="471.5" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">17 min</text><text x="1430" y="516" font-size="22" fill="#6F665B">disponibles</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C18</text>
</svg>
