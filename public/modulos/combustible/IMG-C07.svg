<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Las cinco partes del alternate fuel</title>
<desc id="desc">Perfil y planta del tramo del destino al alterno, lado a lado, con los tramos numerados: 1, frustrada en el destino; 2, ascenso; 3, crucero al alterno; 4, descenso; y 5, aproximación y aterrizaje en el alterno. Sobre la pista del alterno, un bloque rojo: aterriza con la reserva final intacta.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Las cinco partes del alternate fuel</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Desde la frustrada en destino hasta la toma en el alterno</text>
<rect x="56" y="160" width="900" height="640" rx="18" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="84" y="206" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">PERFIL</text><path d="M80 700L930 700" fill="none" stroke="#C9B797" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="694" width="110" height="8" fill="#231F1A"/><rect x="780" y="694" width="110" height="8" fill="#231F1A"/><text x="175" y="734" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">DESTINO</text><text x="835" y="734" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">ALTERNO</text><path d="M80 570L200 660L260 630L420 330L620 330L760 640L800 696" fill="none" stroke="#005071" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="610" r="20" fill="#005071"/><text x="200" y="618" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="330" cy="470" r="20" fill="#005071"/><text x="330" y="478" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="520" cy="300" r="20" fill="#005071"/><text x="520" y="308" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="690" cy="470" r="20" fill="#005071"/><text x="690" y="478" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="800" cy="630" r="20" fill="#005071"/><text x="800" y="638" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="780" y="660" width="110" height="34" rx="6" fill="#B3372B"/><text x="835" y="580" font-size="20" font-weight="700" fill="#B3372B" text-anchor="middle"><tspan x="835" dy="0">aterriza con la</tspan><tspan x="835" dy="24">reserva final intacta</tspan></text><rect x="990" y="160" width="554" height="640" rx="18" fill="#FFFFFF" stroke="#E3DACB" stroke-width="3"/><text x="1018" y="206" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">PLANTA</text><rect x="1060" y="620" width="120" height="14" fill="#231F1A"/><rect x="1380" y="300" width="14" height="120" fill="#231F1A"/><path d="M1040 627L1180 627C1230 627 1250 600 1260 560L1340 380C1350 350 1370 320 1387 312" fill="none" stroke="#005071" stroke-width="5" marker-end="url(#f-acento)"/><text x="1120" y="668" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">DESTINO</text><text x="1440" y="460" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">ALTERNO</text><text x="1018" y="250" font-size="20" fill="#231F1A"><tspan x="1018" dy="0">1 · frustrada en el destino</tspan><tspan x="1018" dy="28">2 · ascenso</tspan><tspan x="1018" dy="28">3 · crucero al alterno</tspan><tspan x="1018" dy="28">4 · descenso</tspan><tspan x="1018" dy="28">5 · aproximación y aterrizaje</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C07</text>
