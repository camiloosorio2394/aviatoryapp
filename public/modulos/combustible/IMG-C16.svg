<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">De normal a MAYDAY, paso a paso</title>
<desc id="desc">Cuatro cajas de izquierda a derecha, cada una de un color: situación normal, en verde, la predicción mantiene alterno más reserva final; reducción de opciones, en amarillo, pedir información de demoras, 121.2553 (b)(1); combustible mínimo, en ámbar, obligado a un aeródromo y cualquier cambio deja bajo la reserva final, 121.2553 (b)(2); y MAYDAY combustible, en rojo, aterrizaje calculado bajo la reserva final, 121.2553 (b)(3).</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">De normal a MAYDAY, paso a paso</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Cuatro estados, tres avisos del RAC 121</text>
<rect x="56" y="250" width="340" height="150" rx="16" fill="#DDEFE3" stroke="#2E7A4B" stroke-width="4"/><text x="226" y="318" font-size="28" font-weight="700" fill="#2E7A4B" text-anchor="middle"><tspan x="226" dy="0">Situación normal</tspan></text><text x="66" y="460" font-size="22" fill="#231F1A"><tspan x="66" dy="0">La predicción mantiene alterno</tspan><tspan x="66" dy="29">+ reserva final.</tspan></text><path d="M400 325L432 325" fill="none" stroke="#231F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><rect x="438" y="250" width="340" height="150" rx="16" fill="#FBF1C4" stroke="#8A6D00" stroke-width="4"/><text x="608" y="318" font-size="28" font-weight="700" fill="#8A6D00" text-anchor="middle"><tspan x="608" dy="0">Reducción de</tspan><tspan x="608" dy="36">opciones</tspan></text><text x="448" y="460" font-size="22" fill="#231F1A"><tspan x="448" dy="0">Puede quedar menos que</tspan><tspan x="448" dy="29">alterno + reserva final: pedir</tspan><tspan x="448" dy="29">información de demoras.</tspan></text><text x="448" y="640" font-size="22" font-weight="700" fill="#8A6D00">121.2553 (b)(1)</text><path d="M782 325L814 325" fill="none" stroke="#231F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><rect x="820" y="250" width="340" height="150" rx="16" fill="#FBEBD2" stroke="#A86400" stroke-width="4"/><text x="990" y="318" font-size="28" font-weight="700" fill="#A86400" text-anchor="middle"><tspan x="990" dy="0">COMBUSTIBLE</tspan><tspan x="990" dy="36">MÍNIMO</tspan></text><text x="830" y="460" font-size="22" fill="#231F1A"><tspan x="830" dy="0">Obligado a un aeródromo;</tspan><tspan x="830" dy="29">cualquier cambio deja bajo la</tspan><tspan x="830" dy="29">reserva final.</tspan></text><text x="830" y="640" font-size="22" font-weight="700" fill="#A86400">121.2553 (b)(2)</text><path d="M1164 325L1196 325" fill="none" stroke="#231F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)"/><rect x="1202" y="250" width="340" height="150" rx="16" fill="#F6DEDA" stroke="#B3372B" stroke-width="4"/><text x="1372" y="318" font-size="28" font-weight="700" fill="#B3372B" text-anchor="middle"><tspan x="1372" dy="0">MAYDAY</tspan><tspan x="1372" dy="36">COMBUSTIBLE</tspan></text><text x="1212" y="460" font-size="22" fill="#231F1A"><tspan x="1212" dy="0">Aterrizaje calculado bajo la</tspan><tspan x="1212" dy="29">reserva final.</tspan></text><text x="1212" y="640" font-size="22" font-weight="700" fill="#B3372B">121.2553 (b)(3)</text><text x="56" y="760" font-size="24" fill="#6F665B">Los avisos se dan cuando la predicción cruza cada umbral, no cuando el combustible ya se acabó.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C16</text>
</svg>
