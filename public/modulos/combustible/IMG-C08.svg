<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La reserva final es una barrera</title>
<desc id="desc">Indicador de combustible vertical con tres zonas. Arriba, en azul, el combustible para operar: trayecto, contingencias y discrecional. En el medio, el combustible para el alterno. Abajo, en rojo, la reserva final, que no se planifica para consumirse, separada por una línea gruesa como barrera. Al lado, los avisos: pedir demoras a la altura de alterno más reserva final; combustible mínimo cerca de la barrera; y MAYDAY combustible dentro de la zona roja.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="900" height="1400" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La reserva final es una barrera</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Tres zonas y tres avisos</text>
<rect x="180" y="200" width="200" height="560" fill="#2F92B8"/><text x="280" y="470" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Para operar</text><text x="280" y="500" font-size="18" fill="#FFFFFF" text-anchor="middle"><tspan x="280" dy="0">trayecto,</tspan><tspan x="280" dy="23">contingencias,</tspan><tspan x="280" dy="23">discrecional</tspan></text><rect x="180" y="760" width="200" height="260" fill="#005071"/><text x="280" y="898" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Alterno</text><rect x="180" y="1020" width="200" height="260" fill="#B3372B"/><text x="280" y="1140" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">RESERVA FINAL</text><text x="280" y="1170" font-size="18" fill="#FFFFFF" text-anchor="middle"><tspan x="280" dy="0">no se planifica para</tspan><tspan x="280" dy="23">consumirse</tspan></text><rect x="180" y="200" width="200" height="1080" fill="none" stroke="#231F1A" stroke-width="4" rx="6"/><rect x="150" y="1012" width="260" height="16" rx="4" fill="#231F1A"/><path d="M414 760L450 760" fill="none" stroke="#005071" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="464" y="762" font-size="24" font-weight="700" fill="#005071">Pedir demoras</text><text x="464" y="792" font-size="20" fill="#231F1A"><tspan x="464" dy="0">cuando puede quedar menos que alterno +</tspan><tspan x="464" dy="26">reserva final</tspan></text><path d="M414 1000L450 1000" fill="none" stroke="#A86400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="464" y="1002" font-size="24" font-weight="700" fill="#A86400">COMBUSTIBLE MÍNIMO</text><text x="464" y="1032" font-size="20" fill="#231F1A"><tspan x="464" dy="0">cualquier cambio deja bajo la reserva final</tspan></text><path d="M414 1150L450 1150" fill="none" stroke="#B3372B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="464" y="1152" font-size="24" font-weight="700" fill="#B3372B">MAYDAY COMBUSTIBLE</text><text x="464" y="1182" font-size="20" fill="#231F1A"><tspan x="464" dy="0">aterrizaje calculado bajo la reserva final</tspan></text>
<text x="860" y="1376" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C08</text>
</svg>
