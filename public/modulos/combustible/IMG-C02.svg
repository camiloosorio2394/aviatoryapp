<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Utilizable y no utilizable</title>
<desc id="desc">Corte esquemático de los tanques de un bimotor de fuselaje estrecho: ala izquierda, tanque central y ala derecha. Casi todo el volumen es combustible utilizable; abajo, junto a los puntos de succión de las bombas, una franja de combustible no utilizable. Una llave marca que la suma de los dos es el combustible total.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Utilizable y no utilizable</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Lo que los motores pueden consumir y lo que se queda en el fondo</text>
<path d="M120 580L560 640L560 470L120 490Z" fill="#E8F6FD" stroke="#005071" stroke-width="3"/><path d="M120 580L560 640L560 622L120 562Z" fill="#B3372B" opacity="0.75"/><path d="M120 562L560 622L560 484L120 504Z" fill="#2F92B8" opacity="0.8"/><path d="M1040 640L1480 580L1480 490L1040 470Z" fill="#E8F6FD" stroke="#005071" stroke-width="3"/><path d="M1040 640L1480 580L1480 562L1040 622Z" fill="#B3372B" opacity="0.75"/><path d="M1040 622L1480 562L1480 504L1040 484Z" fill="#2F92B8" opacity="0.8"/><rect x="600" y="410" width="400" height="230" rx="10" fill="#E8F6FD" stroke="#005071" stroke-width="3"/><rect x="600" y="622" width="400" height="18" fill="#B3372B" opacity="0.75"/><rect x="600" y="426" width="400" height="196" fill="#2F92B8" opacity="0.8"/><circle cx="540" cy="634" r="9" fill="#231F1A"/><circle cx="800" cy="634" r="9" fill="#231F1A"/><circle cx="1060" cy="634" r="9" fill="#231F1A"/><text x="360" y="700" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">ALA IZQUIERDA</text><text x="800" y="700" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">TANQUE CENTRAL</text><text x="1260" y="700" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">ALA DERECHA</text><path d="M800 720L800 650" fill="none" stroke="#231F1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="752" font-size="22" fill="#231F1A" text-anchor="middle">puntos de succión de las bombas</text><rect x="80" y="180" width="434.8" height="40" rx="20" fill="#2F92B8"/><text x="297.4" y="208.6" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Combustible utilizable (usable fuel)</text><path d="M300 222L420 530" fill="none" stroke="#2F92B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1169.7" y="180" width="350.3" height="40" rx="20" fill="#F6DEDA"/><text x="1344.8" y="208.6" font-size="24" font-weight="700" fill="#B3372B" text-anchor="middle">No utilizable (unusable fuel)</text><path d="M1300 222L1300 570" fill="none" stroke="#B3372B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="260" font-size="24" font-weight="700" fill="#005071" text-anchor="middle">Combustible total (total fuel) = utilizable + no utilizable</text><text x="800" y="842" font-size="22" fill="#6F665B" text-anchor="middle">La norma se escribe en combustible utilizable.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C02</text>
</svg>
