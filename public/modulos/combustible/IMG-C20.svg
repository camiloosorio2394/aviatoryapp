<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">El punto de decisión</title>
<desc id="desc">Ruta horizontal del origen al destino final, con un destino intermedio para reabastecer debajo de la línea. Sobre la ruta, un rombo: punto de decisión, nueva planificación en vuelo. Antes del rombo, una zona sombreada: opciones, seguir o desviarse al intermedio. Después, dos flechas: con combustible suficiente, al destino final; con combustible insuficiente, al destino intermedio. Debajo, la misma ruta más pequeña con los símbolos del PNR y del CP para compararlos.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">El punto de decisión</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Antes del punto se decide; después, cada rama tiene su combustible</text>
<rect x="160" y="290" width="660" height="140" fill="#E8F6FD"/><text x="490" y="276" font-size="22" font-weight="700" fill="#005071" text-anchor="middle">opciones: seguir o desviarse al intermedio</text><path d="M140 360L1440 360" fill="none" stroke="#005071" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="360" r="14" fill="#005071"/><text x="140" y="410" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">ORIGEN</text><circle cx="1460" cy="360" r="14" fill="#005071"/><text x="1460" y="330" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">DESTINO FINAL</text><path d="M820 316L864 360L820 404L776 360Z" fill="#005071" stroke="#FFFFFF" stroke-width="3"/><text x="820" y="440" font-size="22" font-weight="700" fill="#005071" text-anchor="middle"><tspan x="820" dy="0">punto de decisión</tspan><tspan x="820" dy="26">nueva planificación en vuelo</tspan></text><circle cx="1100" cy="580" r="14" fill="#2F92B8"/><text x="1100" y="622" font-size="20" font-weight="700" fill="#231F1A" text-anchor="middle">DESTINO INTERMEDIO · reabastecimiento</text><path d="M870 344L1430 344" fill="none" stroke="#2E7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-verde)"/><text x="1140" y="330" font-size="20" font-weight="700" fill="#2E7A4B" text-anchor="middle">combustible suficiente → destino final</text><path d="M850 394C940 510 1000 570 1080 574" fill="none" stroke="#B3372B" stroke-width="4" marker-end="url(#f-rojo)"/><text x="880" y="550" font-size="20" font-weight="700" fill="#B3372B" text-anchor="end">combustible insuficiente → intermedio</text><text x="140" y="740" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">PARA COMPARAR</text><path d="M140 780L1460 780" fill="none" stroke="#A89F94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="608" y="768" width="24" height="24" fill="#FFFFFF" stroke="#231F1A" stroke-width="3" transform="rotate(45 620 780)"/><text x="620" y="754" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">CP</text><text x="620" y="824" font-size="20" fill="#6F665B" text-anchor="middle">punto crítico</text><rect x="1028" y="768" width="24" height="24" fill="#FFFFFF" stroke="#231F1A" stroke-width="3" transform="rotate(45 1040 780)"/><text x="1040" y="754" font-size="22" font-weight="700" fill="#231F1A" text-anchor="middle">PNR</text><text x="1040" y="824" font-size="20" fill="#6F665B" text-anchor="middle">punto de no retorno</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C20</text>
</svg>
