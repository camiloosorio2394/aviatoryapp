<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Un fuel check, renglón por renglón</title>
<desc id="desc">Tabla de seguimiento con formato de OFP: waypoint, hora, combustible planificado, combustible a bordo, diferencia y combustible usado, en cinco puntos de la ruta. Las diferencias crecen de menos 40 a menos 200 kg y la columna de diferencia pasa de verde a ámbar. Debajo, la comprobación: combustible a bordo más combustible usado igual al combustible inicial.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Un fuel check, renglón por renglón</text>
<text x="56" y="124" font-size="24" fill="#6F665B">La diferencia se mira en cada punto; la suma confirma que no hay fuga</text>
<rect x="56" y="170" width="1488" height="520" rx="4" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><rect x="57" y="171" width="1486" height="70" fill="#EEEAE4"/><text x="90" y="216" font-size="22" font-weight="700" fill="#6F665B">Waypoint</text><text x="330" y="216" font-size="22" font-weight="700" fill="#6F665B">Hora</text><text x="510" y="216" font-size="22" font-weight="700" fill="#6F665B">Planned (EFOB)</text><text x="760" y="216" font-size="22" font-weight="700" fill="#6F665B">Actual (FOB)</text><text x="1010" y="216" font-size="22" font-weight="700" fill="#6F665B">Difference</text><text x="1260" y="216" font-size="22" font-weight="700" fill="#6F665B">Fuel Used</text><path d="M56 316L1544 316" fill="none" stroke="#E3DACB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="290" font-size="26" font-weight="700" fill="#231F1A">KILAB</text><text x="330" y="290" font-size="26" fill="#231F1A">1432</text><text x="510" y="290" font-size="26" fill="#231F1A">5.100</text><text x="760" y="290" font-size="26" fill="#231F1A">5.060</text><rect x="996" y="258" width="200" height="44" rx="8" fill="#DDEFE3"/><text x="1010" y="290" font-size="26" font-weight="700" fill="#2E7A4B">-40</text><text x="1260" y="290" font-size="26" fill="#231F1A">690</text><path d="M56 396L1544 396" fill="none" stroke="#E3DACB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="370" font-size="26" font-weight="700" fill="#231F1A">MORUS</text><text x="330" y="370" font-size="26" fill="#231F1A">1451</text><text x="510" y="370" font-size="26" fill="#231F1A">4.480</text><text x="760" y="370" font-size="26" fill="#231F1A">4.400</text><rect x="996" y="338" width="200" height="44" rx="8" fill="#DDEFE3"/><text x="1010" y="370" font-size="26" font-weight="700" fill="#2E7A4B">-80</text><text x="1260" y="370" font-size="26" fill="#231F1A">1.350</text><path d="M56 476L1544 476" fill="none" stroke="#E3DACB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="450" font-size="26" font-weight="700" fill="#231F1A">TENPA</text><text x="330" y="450" font-size="26" fill="#231F1A">1510</text><text x="510" y="450" font-size="26" fill="#231F1A">3.860</text><text x="760" y="450" font-size="26" fill="#231F1A">3.740</text><rect x="996" y="418" width="200" height="44" rx="8" fill="#FBF1C4"/><text x="1010" y="450" font-size="26" font-weight="700" fill="#8A6D00">-120</text><text x="1260" y="450" font-size="26" fill="#231F1A">2.010</text><path d="M56 556L1544 556" fill="none" stroke="#E3DACB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="530" font-size="26" font-weight="700" fill="#231F1A">VUDEX</text><text x="330" y="530" font-size="26" fill="#231F1A">1529</text><text x="510" y="530" font-size="26" fill="#231F1A">3.240</text><text x="760" y="530" font-size="26" fill="#231F1A">3.080</text><rect x="996" y="498" width="200" height="44" rx="8" fill="#FBEBD2"/><text x="1010" y="530" font-size="26" font-weight="700" fill="#A86400">-160</text><text x="1260" y="530" font-size="26" fill="#231F1A">2.670</text><path d="M56 636L1544 636" fill="none" stroke="#E3DACB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="610" font-size="26" font-weight="700" fill="#231F1A">SARIP</text><text x="330" y="610" font-size="26" fill="#231F1A">1548</text><text x="510" y="610" font-size="26" fill="#231F1A">2.950</text><text x="760" y="610" font-size="26" fill="#231F1A">2.750</text><rect x="996" y="578" width="200" height="44" rx="8" fill="#FBEBD2"/><text x="1010" y="610" font-size="26" font-weight="700" fill="#A86400">-200</text><text x="1260" y="610" font-size="26" fill="#231F1A">3.000</text><rect x="56" y="720" width="1488" height="90" rx="14" fill="#E8F6FD"/><text x="90" y="776" font-size="28" font-weight="700" fill="#005071">FOB + FU = FOB inicial   ·   2.750 + 3.000 = 5.750 kg</text><text x="1510" y="776" font-size="26" font-weight="700" fill="#2E7A4B" text-anchor="end">✓ cuadra</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C12</text>
</svg>
