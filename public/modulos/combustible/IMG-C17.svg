<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Tres estados, tres maneras de decirlo</title>
<desc id="desc">Escala horizontal de tres franjas. Normal, en verde: la predicción conserva alterno más reserva final. Combustible mínimo, en ámbar: obligado a un aeródromo, cualquier cambio deja bajo la reserva final, y no es emergencia; se dice COMBUSTIBLE MÍNIMO o MINIMUM FUEL, 121.2553 (b)(2). MAYDAY combustible, en rojo: aterrizaje calculado bajo la reserva final, emergencia; se dice MAYDAY, MAYDAY, MAYDAY, COMBUSTIBLE, 121.2553 (b)(3).</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#005071"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F92B8"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="600" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Tres estados, tres maneras de decirlo</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Solo el último es una emergencia</text>
<rect x="56" y="170" width="490" height="90" fill="#2E7A4B" rx="14"/><text x="301" y="208" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="301" dy="0">NORMAL</tspan></text><rect x="56" y="280" width="490" height="220" rx="14" fill="#DDEFE3"/><text x="76" y="322" font-size="22" fill="#231F1A"><tspan x="76" dy="0">Conserva alterno + reserva final.</tspan></text><text x="76" y="420" font-size="21" font-weight="700" fill="#2E7A4B"><tspan x="76" dy="0">Sin llamada: se vigila la predicción.</tspan></text><rect x="552" y="170" width="490" height="90" fill="#A86400"/><text x="797" y="208" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="797" dy="0">COMBUSTIBLE MÍNIMO · MINIMUM</tspan><tspan x="797" dy="29">FUEL</tspan></text><rect x="552" y="280" width="490" height="220" rx="14" fill="#FBEBD2"/><text x="572" y="322" font-size="22" fill="#231F1A"><tspan x="572" dy="0">Obligado a un aeródromo. No es emergencia.</tspan></text><text x="572" y="420" font-size="21" font-weight="700" fill="#A86400"><tspan x="572" dy="0">«COMBUSTIBLE MÍNIMO» · 121.2553 (b)(2)</tspan></text><rect x="1048" y="170" width="490" height="90" fill="#B3372B" rx="14"/><text x="1293" y="208" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1293" dy="0">MAYDAY COMBUSTIBLE · MAYDAY</tspan><tspan x="1293" dy="29">FUEL</tspan></text><rect x="1048" y="280" width="490" height="220" rx="14" fill="#F6DEDA"/><text x="1068" y="322" font-size="22" fill="#231F1A"><tspan x="1068" dy="0">Aterrizaje calculado bajo la reserva final.</tspan><tspan x="1068" dy="29">Emergencia.</tspan></text><text x="1068" y="420" font-size="21" font-weight="700" fill="#B3372B"><tspan x="1068" dy="0">«MAYDAY, MAYDAY, MAYDAY,</tspan><tspan x="1068" dy="27">COMBUSTIBLE» · 121.2553 (b)(3)</tspan></text>
<text x="1560" y="576" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">IMG-C17</text>
</svg>
