<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Dónde vive RVSM en el plan de vuelo</title>
<desc id="desc">Recreación de un fragmento de plan de vuelo OACI con las casillas 7 a 10: identificación AVY101, reglas y tipo de vuelo IS, tipo de aeronave y estela A320/M, y en la casilla 10 la cadena de equipo SDFGHIRWY/S con la W resaltada. Tres números señalan la W, el resto de la cadena y la casilla 7.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Dónde vive RVSM en el plan de vuelo</text>
<rect x="1132.8" y="54" width="411.2" height="36" rx="18" fill="#E5F3F1"/><text x="1338.4" y="79.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">Recreación educativa · plan de ejemplo</text>
<rect x="56" y="170" width="1074" height="560" rx="3" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><text x="90" y="250" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="0.5">7  IDENTIFICACIÓN</text><rect x="90" y="268" width="240" height="84" rx="2" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><text x="110" y="324" font-family="'Courier New', Courier, monospace" font-size="40" font-weight="700" fill="#231F1A">AVY101</text><text x="350" y="250" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="0.5">8  REGLAS · TIPO</text><rect x="350" y="268" width="170" height="84" rx="2" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><text x="370" y="324" font-family="'Courier New', Courier, monospace" font-size="40" font-weight="700" fill="#231F1A">I S</text><text x="540" y="250" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="0.5">9  AERONAVE · ESTELA</text><rect x="540" y="268" width="260" height="84" rx="2" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><text x="560" y="324" font-family="'Courier New', Courier, monospace" font-size="40" font-weight="700" fill="#231F1A">A320/M</text><text x="90" y="440" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="0.5">10  EQUIPO Y CAPACIDADES</text><rect x="90" y="458" width="700" height="84" rx="2" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><rect x="275" y="470" width="30" height="60" rx="6" fill="#CDE5E1"/><text x="110" y="514" font-family="'Courier New', Courier, monospace" font-size="40" font-weight="700" fill="#231F1A">SDFGHIRWY/S</text><path d="M290 620L290 540" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="290" cy="540" r="5" fill="#1C5750"/><circle cx="290" cy="620" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="290" y="628.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M230 620L230 540" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="540" r="5" fill="#1C5750"/><circle cx="230" cy="620" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="230" y="628.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M210 400L210 352" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="352" r="5" fill="#1C5750"/><circle cx="210" cy="400" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="210" y="408.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1160" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1180" cy="236" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1216" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">La W</tspan></text><text x="1216" y="273" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Declara capacidad RVSM: con</tspan><tspan x="1216" dy="27">ella el ATS decide si te aplica</tspan><tspan x="1216" dy="27">1.000 ft. Es una declaración, no</tspan><tspan x="1216" dy="27">una autorización.</tspan></text><circle cx="1180" cy="393" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="400.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1216" y="401" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">El resto de la cadena</tspan></text><text x="1216" y="430" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Las demás capacidades. La W</tspan><tspan x="1216" dy="27">convive con ellas; no las</tspan><tspan x="1216" dy="27">sustituye.</tspan></text><circle cx="1180" cy="523" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="530.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1216" y="531" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Casilla 7</tspan></text><text x="1216" y="560" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">La identificación. Si la matrícula</tspan><tspan x="1216" dy="27">es otra, va en la información</tspan><tspan x="1216" dy="27">complementaria.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-09</text>
</svg>
