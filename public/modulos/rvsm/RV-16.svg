<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Onda de montaña: el avión se mueve sin que nada falle</title>
<desc id="desc">Perfil de una cordillera de costado con el viento entrando desde la izquierda. Las líneas de corriente suben al pasar la cresta y siguen ondulando corriente abajo, cada vez menos. Un avión en crucero dentro de la zona ondulada, con dos siluetas por encima y por debajo de su posición y una cota: desplazamiento vertical inducido. Una línea de puntos marca el nivel autorizado. Etiquetas: viento perpendicular a la cordillera, flujo ondulatorio corriente abajo, y el nivel se mantiene con dificultad aunque el avión esté sano.</desc>
