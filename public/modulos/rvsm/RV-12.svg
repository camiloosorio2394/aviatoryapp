<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">AAD, TVE y ASE: tres distancias distintas</title>
<desc id="desc">Un avión en crucero y tres líneas horizontales: el nivel asignado, FL 350, continuo; la altitud que el transpondedor transmite, de trazo y punto; y la altitud que el avión vuela de verdad, de puntos, donde está el avión. Tres cotas: AAD, entre el nivel asignado y lo que transmite el transpondedor, es lo que ve el ATC; TVE, entre el nivel asignado y la altitud real, es la separación real que se pierde; ASE, entre lo transmitido y lo real, es el error de medición, invisible en cabina.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">AAD, TVE y ASE: tres distancias distintas</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Una de las preguntas de entrevista que más separa a los candidatos</text>
<path d="M120 330L1040 330" fill="none" stroke="#1C5750" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 450L1040 450" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 8 3 8"/><path d="M120 570L1040 570" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8"/><text x="130" y="314" font-size="24" font-weight="700" fill="#1C5750">NIVEL ASIGNADO · FL 350</text><text x="130" y="434" font-size="22" font-weight="700" fill="#231F1A">ALTITUD QUE EL TRANSPONDEDOR TRANSMITE</text><text x="130" y="610" font-size="22" font-weight="700" fill="#231F1A">ALTITUD QUE EL AVIÓN VUELA DE VERDAD</text><g transform="translate(560 560) scale(1)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><path d="M760 336L760 564" fill="none" stroke="#231F1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-tinta)" marker-start="url(#f-tinta)"/><text x="748" y="398" font-size="24" font-weight="700" fill="#231F1A" text-anchor="end">TVE</text><path d="M880 336L880 444" fill="none" stroke="#1C5750" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)" marker-start="url(#f-acento)"/><text x="868" y="398" font-size="24" font-weight="700" fill="#1C5750" text-anchor="end">AAD</text><path d="M1000 456L1000 564" fill="none" stroke="#A86400" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-ambar)" marker-start="url(#f-ambar)"/><text x="988" y="518" font-size="24" font-weight="700" fill="#A86400" text-anchor="end">ASE</text><rect x="1100" y="250" width="444" height="130" rx="14" fill="#FFFFFF" stroke="#1C5750" stroke-width="3"/><text x="1126" y="294" font-size="30" font-weight="700" fill="#1C5750">AAD</text><text x="1126" y="330" font-size="21" fill="#231F1A"><tspan x="1126" dy="0">Lo que ve el ATC: el nivel transmitido</tspan><tspan x="1126" dy="27">frente al asignado.</tspan></text><rect x="1100" y="400" width="444" height="130" rx="14" fill="#FFFFFF" stroke="#231F1A" stroke-width="3"/><text x="1126" y="444" font-size="30" font-weight="700" fill="#231F1A">TVE</text><text x="1126" y="480" font-size="21" fill="#231F1A"><tspan x="1126" dy="0">La separación real que se pierde: la altitud</tspan><tspan x="1126" dy="27">verdadera frente a la asignada.</tspan></text><rect x="1100" y="550" width="444" height="130" rx="14" fill="#FFFFFF" stroke="#A86400" stroke-width="3"/><text x="1126" y="594" font-size="30" font-weight="700" fill="#A86400">ASE</text><text x="1126" y="630" font-size="21" fill="#231F1A"><tspan x="1126" dy="0">El error de medición del sistema</tspan><tspan x="1126" dy="27">altimétrico. Invisible en cabina.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-12</text>
</svg>
