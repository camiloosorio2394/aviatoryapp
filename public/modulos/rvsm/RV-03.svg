<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La aprobación: tres cosas, no una</title>
<desc id="desc">Tres bloques iguales arriba: la aeronave, con equipo y performance altimétrica aprobados; el operador, con la autorización en sus especificaciones de operación; y la tripulación, entrenada en procedimientos RVSM. De cada uno baja una flecha a un bloque único y más ancho: operación RVSM. Al lado, la nota: si falta una, no hay RVSM.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La aprobación: tres cosas, no una</text>
<text x="56" y="124" font-size="24" fill="#6F665B">RVSM no es una propiedad del avión: es la intersección de tres condiciones</text>
<rect x="90" y="180" width="440" height="170" rx="16" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="310" y="240" font-size="32" font-weight="700" fill="#1C5750" text-anchor="middle" letter-spacing="1">AERONAVE</text><text x="310" y="286" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="310" dy="0">Equipo y performance altimétrica</tspan><tspan x="310" dy="31">aprobados</tspan></text><path d="M310 356C310 450 800 440 800 546" fill="none" stroke="#4B9089" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="580" y="180" width="440" height="170" rx="16" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="800" y="240" font-size="32" font-weight="700" fill="#1C5750" text-anchor="middle" letter-spacing="1">OPERADOR</text><text x="800" y="286" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="800" dy="0">Autorización en las</tspan><tspan x="800" dy="31">especificaciones de operación</tspan></text><path d="M800 356C800 450 800 440 800 540" fill="none" stroke="#4B9089" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="1070" y="180" width="440" height="170" rx="16" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="1290" y="240" font-size="32" font-weight="700" fill="#1C5750" text-anchor="middle" letter-spacing="1">TRIPULACIÓN</text><text x="1290" y="286" font-size="24" fill="#231F1A" text-anchor="middle"><tspan x="1290" dy="0">Entrenada en procedimientos</tspan><tspan x="1290" dy="31">RVSM</tspan></text><path d="M1290 356C1290 450 800 440 800 546" fill="none" stroke="#4B9089" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="420" y="560" width="760" height="150" rx="18" fill="#1C5750"/><text x="800" y="652" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">OPERACIÓN RVSM</text><text x="1210" y="645" font-size="28" font-weight="700" fill="#B3372B">Si falta una,</text><text x="1210" y="682" font-size="28" font-weight="700" fill="#B3372B">no hay RVSM.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-03</text>
