<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Lo que cuesta perder RVSM</title>
<desc id="desc">Cadena de izquierda a derecha: pérdida de capacidad RVSM; salida del espacio, normalmente por debajo de FL 290; mayor consumo por hora; predicción al destino revisada; y la decisión, conserva alterno más reserva final. Si sí, continuar vigilando. Si no, replanificar con el despacho.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Lo que cuesta perder RVSM</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Una falla técnica en crucero termina en una decisión de combustible</text>
<rect x="56" y="330" width="250" height="240" rx="16" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><path d="M181 374L209 422L153 422Z" fill="none" stroke="#A86400" stroke-width="5" stroke-linejoin="round"/><text x="181" y="416" font-size="28" font-weight="700" fill="#A86400" text-anchor="middle">!</text><text x="181" y="470" font-size="22" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="181" dy="0">PÉRDIDA DE</tspan><tspan x="181" dy="29">CAPACIDAD RVSM</tspan></text><path d="M312 450L344 450" fill="none" stroke="#1C5750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="350" y="330" width="250" height="240" rx="16" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><path d="M435 380L465 380L495 416L517 416" fill="none" stroke="#1C5750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><path d="M431 402L519 402" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="475" y="470" font-size="22" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="475" dy="0">SALIDA DEL</tspan><tspan x="475" dy="29">ESPACIO</tspan></text><text x="475" y="532" font-size="20" fill="#6F665B" text-anchor="middle"><tspan x="475" dy="0">normalmente por debajo</tspan><tspan x="475" dy="26">de FL 290</tspan></text><path d="M606 450L638 450" fill="none" stroke="#1C5750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="644" y="330" width="250" height="240" rx="16" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><path d="M735 418A34 34 0 0 1 803 418" fill="none" stroke="#1C5750" stroke-width="5"/><path d="M769 418L791 392" fill="none" stroke="#B3372B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="769" y="470" font-size="22" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="769" dy="0">MAYOR CONSUMO</tspan><tspan x="769" dy="29">POR HORA</tspan></text><path d="M900 450L932 450" fill="none" stroke="#1C5750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><rect x="938" y="330" width="250" height="240" rx="16" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="1053" y="412" font-size="30" font-weight="700" fill="#1C5750" text-anchor="middle">kg</text><path d="M1093 378L1093 420" fill="none" stroke="#B3372B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-rojo)"/><text x="1063" y="470" font-size="22" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="1063" dy="0">PREDICCIÓN AL</tspan><tspan x="1063" dy="29">DESTINO</tspan><tspan x="1063" dy="29">REVISADA</tspan></text><path d="M1194 450L1226 450" fill="none" stroke="#1C5750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><path d="M1360 320L1540 450L1360 580L1180 450Z" fill="#1C5750"/><text x="1360" y="428" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1360" dy="0">¿CONSERVA</tspan><tspan x="1360" dy="28">ALTERNO +</tspan><tspan x="1360" dy="28">RESERVA FINAL?</tspan></text><path d="M1360 320L1360 254" fill="none" stroke="#2E7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-verde)"/><rect x="1170" y="170" width="380" height="70" rx="14" fill="#DDEFE3"/><text x="1360" y="214" font-size="24" font-weight="700" fill="#2E7A4B" text-anchor="middle">SÍ · continuar vigilando</text><path d="M1360 580L1360 646" fill="none" stroke="#B3372B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-rojo)"/><rect x="1170" y="650" width="380" height="70" rx="14" fill="#F6DEDA"/><text x="1360" y="694" font-size="22" font-weight="700" fill="#B3372B" text-anchor="middle">NO · replanificar con el despacho</text><text x="56" y="820" font-size="22" fill="#6F665B">La falla es técnica; la decisión termina siendo de combustible. Ver el módulo de Gestión del combustible.</text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-19</text>
