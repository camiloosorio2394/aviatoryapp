<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Despachable no quiere decir RVSM</title>
<desc id="desc">Recreación de una entrada de MEL ficticia para el control automático de altitud, con columnas de ítem, categoría, instalados, requeridos y observaciones. Requeridos para el despacho: cero. En las observaciones, con las marcas (M) y (O), la condición: no se opera en espacio RVSM. Tres números señalan la columna de requeridos, el renglón de la restricción y las marcas (M) y (O).</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Despachable no quiere decir RVSM</text>
<rect x="1117.2" y="54" width="426.8" height="36" rx="18" fill="#E5F3F1"/><text x="1330.6" y="79.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">Entrada ficticia · con fines de enseñanza</text>
<rect x="56" y="170" width="1074" height="420" rx="3" fill="#FFFFFF" stroke="#231F1A" stroke-width="2"/><rect x="57" y="171" width="1072" height="70" fill="#EEEAE4"/><text x="178" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">ÍTEM Y SISTEMA</text><text x="345" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">CAT.</text><path d="M300 170L300 590" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="455" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">INSTAL.</text><path d="M390 170L390 590" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="585" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">REQUER.</text><path d="M520 170L520 590" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="890" y="214" font-size="20" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">OBSERVACIONES O EXCEPCIONES</text><path d="M650 170L650 590" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><path d="M56 241L1130 241" fill="none" stroke="#231F1A" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="76" y="290" font-size="24" font-weight="700" fill="#231F1A"><tspan x="76" dy="0">22-XX-01</tspan><tspan x="76" dy="32">Control automático</tspan><tspan x="76" dy="32">de altitud</tspan></text><text x="345" y="290" font-size="30" font-weight="700" fill="#231F1A" text-anchor="middle">C</text><text x="455" y="290" font-size="30" font-weight="700" fill="#231F1A" text-anchor="middle">2</text><text x="585" y="290" font-size="30" font-weight="700" fill="#231F1A" text-anchor="middle">0</text><rect x="670" y="450" width="400" height="42" rx="6" fill="#FBEBD2"/><text x="674" y="340" font-size="23" fill="#231F1A"><tspan x="674" dy="0">(M) (O) Pueden estar inoperativos</tspan><tspan x="674" dy="34">siempre que:</tspan><tspan x="674" dy="34">a) se cumplan los procedimientos</tspan><tspan x="674" dy="34">asociados, y</tspan><tspan x="674" dy="34">b) no se opere en espacio RVSM.</tspan></text><path d="M585 420L585 304" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="585" cy="304" r="5" fill="#1C5750"/><circle cx="585" cy="420" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="585" y="428.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M1090 470L1060 470" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1060" cy="470" r="5" fill="#1C5750"/><circle cx="1090" cy="470" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1090" y="477.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M760 282L720 318" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720" cy="318" r="5" fill="#1C5750"/><circle cx="760" cy="282" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="760" y="290.4" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1160" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1180" cy="236" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1216" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Requeridos</tspan></text><text x="1216" y="273" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Cuántos hacen falta para</tspan><tspan x="1216" dy="27">despachar. Responde «¿sale el</tspan><tspan x="1216" dy="27">avión?», no «¿es RVSM?».</tspan></text><circle cx="1180" cy="366" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="373.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1216" y="374" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">La restricción</tspan></text><text x="1216" y="403" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Aquí la MEL retira la capacidad</tspan><tspan x="1216" dy="27">RVSM, con todas las letras.</tspan></text><circle cx="1180" cy="469" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="476.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1216" y="477" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">(M) y (O)</tspan></text><text x="1216" y="506" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">(M), procedimiento de</tspan><tspan x="1216" dy="27">mantenimiento; (O), operacional:</tspan><tspan x="1216" dy="27">ese lo cumple la tripulación.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-08</text>
</svg>
