FF" stroke-width="3"/><text x="327.9" y="523.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M413.5820895522388 490L413.5820895522388 468" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="413.5820895522388" cy="490" r="7" fill="#1C5750"/><circle cx="413.6" cy="446" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="413.6" y="453.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M499.25373134328356 420L499.25373134328356 398" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="499.25373134328356" cy="420" r="7" fill="#1C5750"/><circle cx="499.3" cy="376" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="499.3" y="383.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M700 305L700 283" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="700" cy="305" r="7" fill="#1C5750"/><circle cx="700" cy="261" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="700" y="268.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><path d="M860 305L860 283" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="860" cy="305" r="7" fill="#1C5750"/><circle cx="860" cy="261" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="860" y="268.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><path d="M1010 305L1010 283" fill="none" stroke="#1C5750" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1010" cy="305" r="7" fill="#1C5750"/><circle cx="1010" cy="261" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1010" y="268.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>