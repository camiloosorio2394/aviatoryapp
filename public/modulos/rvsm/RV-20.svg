-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1110" y="878" font-size="22" fill="#231F1A"><tspan x="1110" dy="0">Ascenso.</tspan></text><circle cx="76" cy="958" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="76" y="965.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="110" y="966" font-size="22" fill="#231F1A"><tspan x="110" dy="0">Altitud de transición: 1013,25 hPa.</tspan></text><circle cx="576" cy="958" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="576" y="965.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="610" y="966" font-size="22" fill="#231F1A"><tspan x="610" dy="0">Puerta RVSM en FL 290: las</tspan><tspan x="610" dy="27">verificaciones de entrada.</tspan></text><circle cx="1076" cy="958" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1076" y="965.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="1110" y="966" font-size="22" fill="#231F1A"><tspan x="1110" dy="0">Nivelado en FL 370.</tspan></text><circle cx="76" cy="1046" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="76" y="1053.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="110" y="1054" font-size="22" fill="#231F1A"><tspan x="110" dy="0">Chequeo altimétrico, cada hora.</tspan></text><circle cx="576" cy="1046" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="576" y="1053.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="610" y="1054" font-size="22" fill="#231F1A"><tspan x="610" dy="0">Turbulencia: «unable RVSM due</tspan><tspan x="610" dy="27">turbulence».</tspan></text><circle cx="1076" cy="1046" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1076" y="1053.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="1110" y="1054" font-size="22" fill="#231F1A"><tspan x="1110" dy="0">Posible falla: el flujo de contingencia.</tspan></text><circle cx="76" cy="1134" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="76" y="1141.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><text x="110" y="1142" font-size="22" fill="#231F1A"><tspan x="110" dy="0">Salida del espacio RVSM al descender por</tspan><tspan x="110" dy="27">FL 290.</tspan></text><circle cx="576" cy="1134" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="576" y="1141.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text><text x="610" y="1142" font-size="22" fill="#231F1A"><tspan x="610" dy="0">Postvuelo: la anotación en el libro.</tspan></text>
