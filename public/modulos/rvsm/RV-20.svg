<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Un vuelo completo, con RVSM de principio a fin</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Dónde aparece cada procedimiento del módulo dentro de una operación real</text>
