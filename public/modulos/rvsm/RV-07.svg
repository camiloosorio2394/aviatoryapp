" stroke-linejoin="round"/><text x="816" y="443" font-family="'Courier New', Courier, monospace" font-size="22" fill="#9AA3AD" text-anchor="middle">35100</text><path d="M740 615L760 615" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="816" y="623" font-family="'Courier New', Courier, monospace" font-size="22" fill="#9AA3AD" text-anchor="middle">34900</text><path d="M740 705L760 705" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="816" y="713" font-family="'Courier New', Courier, monospace" font-size="22" fill="#9AA3AD" text-anchor="middle">34800</text><rect x="730" y="497" width="150" height="56" fill="#000" stroke="#E6EAEE" stroke-width="2"/><text x="805" y="535" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#5BD68F" text-anchor="middle">35000</text><text x="805" y="278" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#63C7E0" text-anchor="middle">35000</text><path d="M980 270L880 270" fill="none" stroke="#E5F3F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="880" cy="270" r="5" fill="#E5F3F1"/><circle cx="980" cy="270" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="980" y="278" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M980 525L882 525" fill="none" stroke="#E5F3F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="882" cy="525" r="5" fill="#E5F3F1"/><circle cx="980" cy="525" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="980" y="533" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M980 221L900 221" fill="none" stroke="#E5F3F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="900" cy="221" r="5" fill="#E5F3F1"/><circle cx="980" cy="221" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="980" y="229" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1060" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1080" cy="236" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1116" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">Altitud seleccionada</tspan></text><text x="1116" y="273" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">El nivel autorizado, tal como quedó tras la</tspan><tspan x="1116" dy="27">colación. El otro piloto la verifica.</tspan></text><circle cx="1080" cy="339" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="346.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1116" y="347" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">Altitud actual</tspan></text><text x="1116" y="376" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">Lo que hace el avión: en crucero estable,</tspan><tspan x="1116" dy="27">el sistema la mantiene dentro de ±65 ft.</tspan></text><circle cx="1080" cy="442" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1080" y="449.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1116" y="450" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1116" dy="0">Modo vertical y piloto automático</tspan></text><text x="1116" y="479" font-size="22" fill="#6F665B"><tspan x="1116" dy="0">RVSM exige el automático operativo y</tspan><tspan x="1116" dy="27">acoplado en crucero nivelado, no solo</tspan><tspan x="1116" dy="27">disponible.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-07</text>
