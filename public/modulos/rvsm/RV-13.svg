<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Una desviación grande se come el margen</title>
<desc id="desc">Dos aviones de costado en niveles RVSM adyacentes. El de arriba, en FL 360, nivel autorizado y mantenido. El de abajo tiene autorizado FL 350, marcado con una línea de puntos, pero vuela por encima de ella y ascendiendo. Una cota marca la desviación vertical entre el nivel autorizado y el real; otra, a la derecha, el margen real que queda entre los dos aviones, visiblemente menor que los 1.000 ft nominales.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Una desviación grande se come el margen</text>
<text x="56" y="124" font-size="24" fill="#6F665B">No es un error abstracto: es la distancia que separa a dos aviones reales</text>
<path d="M120 330L1480 330" fill="none" stroke="#1C5750" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 640L1480 640" fill="none" stroke="#231F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 9"/><text x="130" y="312" font-size="24" font-weight="700" fill="#1C5750">FL 360 · nivel autorizado y mantenido</text><text x="130" y="680" font-size="24" font-weight="700" fill="#231F1A">FL 350 · NIVEL AUTORIZADO</text><g transform="translate(1000 320) scale(1.05) scale(-1 1)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#1C5750"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#1C5750"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#1C5750" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#1C5750"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><g transform="translate(640 484) scale(1.05) rotate(-7)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><text x="560" y="440" font-size="22" font-weight="700" fill="#231F1A" text-anchor="end">NIVEL REAL</text><rect x="380" y="490" width="60" height="150" fill="#F6DEDA"/><path d="M410 496L410 634" fill="none" stroke="#B3372B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-rojo)" marker-start="url(#f-rojo)"/><text x="370" y="554" font-size="22" font-weight="700" fill="#B3372B" text-anchor="end"><tspan x="370" dy="0">DESVIACIÓN</tspan><tspan x="370" dy="27">VERTICAL</tspan></text><path d="M1240 336L1240 484" fill="none" stroke="#A86400" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-ambar)" marker-start="url(#f-ambar)"/><text x="1260" y="410" font-size="22" font-weight="700" fill="#A86400"><tspan x="1260" dy="0">margen real</tspan><tspan x="1260" dy="27">restante</tspan></text><path d="M1420 336L1420 634" fill="none" stroke="#6F665B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-suave)" marker-start="url(#f-suave)"/><text x="1410" y="550" font-size="20" fill="#6F665B" text-anchor="end"><tspan x="1410" dy="0">1.000 ft</tspan><tspan x="1410" dy="24">nominales</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-13</text>
</svg>
