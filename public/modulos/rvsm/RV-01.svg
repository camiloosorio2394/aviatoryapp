<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La misma franja, casi el doble de niveles</text>
<text x="56" y="124" font-size="24" fill="#6F665B">RVSM no acerca los aviones por acercarlos: aprovecha mejor la altura</text>
