<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La puerta se cruza con la capacidad confirmada</title>
<desc id="desc">Perfil de ascenso de izquierda a derecha, con una línea gruesa en FL 290 rotulada puerta de entrada RVSM. Antes de la línea, un recuadro con la secuencia de verificación: capacidad, sistemas, altímetros, mantenimiento del nivel, reporte de altitud, meteorología y autorización, con la nota de que es un resumen educativo y que manda el SOP, el FCOM y el QRH del operador. Al otro lado de la línea, en el espacio RVSM, el avión ya nivelado.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La puerta se cruza con la capacidad confirmada</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Antes de cruzar se confirma; lo que pasa después se gestiona con otras reglas</text>
<rect x="600" y="160" width="944" height="270" fill="#E5F3F1"/><text x="1520" y="200" font-size="24" font-weight="700" fill="#1C5750" text-anchor="end" letter-spacing="1.5">ESPACIO RVSM</text><path d="M300 860L1000 330L1544 330" fill="none" stroke="#A89F94" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 10"/><path d="M600 430L1544 430" fill="none" stroke="#1C5750" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="1520" y="474" font-size="26" font-weight="700" fill="#1C5750" text-anchor="end">FL 290 · PUERTA DE ENTRADA RVSM</text><g transform="translate(760 510) scale(0.9) rotate(-37)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><g transform="translate(1300 322) scale(0.9)"><path d="M-58 -2L-50 -30L-40 -30L-27 -6L40 -6C52 -6 60 -3 63 1C60 6 52 8 40 8L-52 8C-58 8 -61 4 -58 -2Z" fill="#231F1A"/><path d="M-60 1L-40 1L-44 5L-60 5Z" fill="#231F1A"/><path d="M-10 3L18 3L8 13L-4 13Z" fill="#231F1A" opacity="0.75"/><ellipse cx="4" cy="15" rx="10" ry="4" fill="#231F1A"/><path d="M45 -3L53 -3L56 0L47 0Z" fill="#FFFFFF"/></g><rect x="80" y="170" width="470" height="470" rx="16" fill="#FFFFFF" stroke="#1C5750" stroke-width="3"/><text x="110" y="214" font-size="22" font-weight="700" fill="#1C5750" letter-spacing="1.5">ANTES DE FL 290</text><circle cx="124" cy="254" r="16" fill="#1C5750"/><text x="124" y="261" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="154" y="262" font-size="24" font-weight="700" fill="#231F1A">Capacidad</text><circle cx="124" cy="300" r="16" fill="#1C5750"/><text x="124" y="307" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="154" y="308" font-size="24" font-weight="700" fill="#231F1A">Sistemas</text><circle cx="124" cy="346" r="16" fill="#1C5750"/><text x="124" y="353" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="154" y="354" font-size="24" font-weight="700" fill="#231F1A">Altímetros</text><circle cx="124" cy="392" r="16" fill="#1C5750"/><text x="124" y="399" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="154" y="400" font-size="24" font-weight="700" fill="#231F1A">Mantenimiento del nivel</text><circle cx="124" cy="438" r="16" fill="#1C5750"/><text x="124" y="445" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="154" y="446" font-size="24" font-weight="700" fill="#231F1A">Reporte de altitud</text><circle cx="124" cy="484" r="16" fill="#1C5750"/><text x="124" y="491" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="154" y="492" font-size="24" font-weight="700" fill="#231F1A">Meteorología</text><circle cx="124" cy="530" r="16" fill="#1C5750"/><text x="124" y="537" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="154" y="538" font-size="24" font-weight="700" fill="#231F1A">Autorización</text><text x="110" y="592" font-size="20" fill="#6F665B" font-style="italic"><tspan x="110" dy="0">Resumen educativo: seguir siempre el SOP, el</tspan><tspan x="110" dy="26">FCOM y el QRH del operador.</tspan></text><path d="M550 390L592 422" fill="none" stroke="#1C5750" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento)"/><text x="960" y="620" font-size="24" fill="#231F1A"><tspan x="960" dy="0">Si algo falla antes, se pide una autorización que</tspan><tspan x="960" dy="31">evite el espacio. Dentro, se comunica y se coordina.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-11</text>
</svg>
