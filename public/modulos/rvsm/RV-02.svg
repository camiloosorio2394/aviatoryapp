<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Dónde empieza y dónde acaba</title>
<desc id="desc">Una columna de altura en tres franjas. Abajo, en gris, por debajo del espacio RVSM, hasta FL 290. En el centro, destacada, el espacio RVSM con separación de 1.000 ft, entre FL 290 y FL 410. Arriba, en gris, por encima del espacio RVSM, desde FL 410. Al lado, la nota: los detalles los publica cada Estado en el AIP, los procedimientos regionales y los NOTAM.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Dónde empieza y dónde acaba</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Dos límites fijos; lo que pasa dentro lo concreta cada región</text>
<rect x="380" y="170" width="520" height="130" rx="16" fill="#EEEAE4"/><rect x="380" y="300" width="520" height="400" fill="#E5F3F1" stroke="#1C5750" stroke-width="4"/><rect x="380" y="700" width="520" height="130" rx="16" fill="#EEEAE4"/><text x="640" y="245" font-size="24" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">POR ENCIMA DEL ESPACIO RVSM</text><text x="640" y="480" font-size="40" font-weight="700" fill="#1C5750" text-anchor="middle">ESPACIO RVSM</text><text x="640" y="530" font-size="28" fill="#1C5750" text-anchor="middle">separación vertical de 1.000 ft</text><text x="640" y="775" font-size="24" font-weight="700" fill="#6F665B" text-anchor="middle" letter-spacing="1">POR DEBAJO DEL ESPACIO RVSM</text><path d="M310 300L380 300" fill="none" stroke="#1C5750" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="296" y="310" font-size="30" font-weight="700" fill="#231F1A" text-anchor="end">FL 410</text><path d="M310 700L380 700" fill="none" stroke="#1C5750" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="296" y="710" font-size="30" font-weight="700" fill="#231F1A" text-anchor="end">FL 290</text><path d="M900 500L980 500" fill="none" stroke="#1C5750" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="980" y="400" width="540" height="200" rx="16" fill="#FFFFFF" stroke="#9CC9C3" stroke-width="3"/><text x="1010" y="460" font-size="26" font-weight="700" fill="#1C5750"><tspan x="1010" dy="0">Los detalles los publica cada Estado:</tspan><tspan x="1010" dy="34">AIP, procedimientos regionales y</tspan><tspan x="1010" dy="34">NOTAM.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-02</text>
</svg>
