<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La cadena que evita el level bust</title>
<desc id="desc">Diagrama de flujo de siete bloques con el responsable de cada uno: autorización ATC, los dos escuchan; colación, el PM; selección de altitud, el PM; verificación cruzada, PF y PM, destacada como el eslabón que más se salta; ejecución, el PF; nivelación dentro de 150 ft, el PF; y vigilancia del nivel, los dos.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La cadena que evita el level bust</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Una secuencia con responsables, no una cuestión de atención individual</text>
<rect x="470" y="160" width="560" height="70" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="750" y="205" font-size="26" font-weight="700" fill="#1C5750" text-anchor="middle">AUTORIZACIÓN ATC</text><rect x="1060" y="177" width="247.5" height="36" rx="18" fill="#E5F3F1"/><text x="1183.8" y="202.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">LOS DOS ESCUCHAN</text><path d="M750 232L750 252" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="470" y="256" width="560" height="70" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="750" y="301" font-size="26" font-weight="700" fill="#1C5750" text-anchor="middle">COLACIÓN</text><rect x="1060" y="273" width="64.6" height="36" rx="18" fill="#E5F3F1"/><text x="1092.3" y="298.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">PM</text><path d="M750 328L750 348" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="470" y="352" width="560" height="70" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="750" y="397" font-size="26" font-weight="700" fill="#1C5750" text-anchor="middle">SELECCIÓN DE ALTITUD</text><rect x="1060" y="369" width="64.6" height="36" rx="18" fill="#E5F3F1"/><text x="1092.3" y="394.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">PM</text><path d="M750 424L750 444" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="470" y="448" width="560" height="70" rx="14" fill="#1C5750"/><text x="750" y="493" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">VERIFICACIÓN CRUZADA</text><rect x="1060" y="465" width="119.5" height="36" rx="18" fill="#E5F3F1"/><text x="1119.8" y="490.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">PF Y PM</text><path d="M750 520L750 540" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="470" y="544" width="560" height="70" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="750" y="589" font-size="26" font-weight="700" fill="#1C5750" text-anchor="middle">EJECUCIÓN</text><rect x="1060" y="561" width="61.2" height="36" rx="18" fill="#E5F3F1"/><text x="1090.6" y="586.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">PF</text><path d="M750 616L750 636" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="470" y="640" width="560" height="70" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="750" y="685" font-size="26" font-weight="700" fill="#1C5750" text-anchor="middle">NIVELACIÓN · dentro de 150 ft</text><rect x="1060" y="657" width="61.2" height="36" rx="18" fill="#E5F3F1"/><text x="1090.6" y="682.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">PF</text><path d="M750 712L750 732" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="470" y="736" width="560" height="70" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="750" y="781" font-size="26" font-weight="700" fill="#1C5750" text-anchor="middle">VIGILANCIA DEL NIVEL</text><rect x="1060" y="753" width="125.2" height="36" rx="18" fill="#E5F3F1"/><text x="1122.6" y="778.2" font-size="20" font-weight="700" fill="#1C5750" text-anchor="middle">LOS DOS</text><path d="M462 483L400 483" fill="none" stroke="#B3372B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="477" font-size="26" font-weight="700" fill="#B3372B" text-anchor="end"><tspan x="386" dy="0">El eslabón que</tspan><tspan x="386" dy="32">más se salta</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-14</text>
</svg>
