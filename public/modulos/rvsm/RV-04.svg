<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">El equipo requerido, de un vistazo</title>
<desc id="desc">Cuatro tarjetas en dos filas. Dos sistemas independientes de altitud, que permiten comparar. Transpondedor con reporte de altitud, para que el ATC vea el nivel. Alerta de altitud, que avisa si el avión se aparta. Control automático de altitud, que mantiene el nivel. Debajo, una banda: los cuatro, operativos, antes de entrar.</desc>
