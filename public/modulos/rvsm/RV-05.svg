<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">En RVSM no hay «el altímetro»</title>
<desc id="desc">Cabina genérica vista de frente: el PFD del comandante a la izquierda con 35000 ft, el del primer oficial a la derecha con 35010 ft, y el altímetro de reserva en el panel central con 34960 ft. Tres números señalan las dos primarias y la de reserva.</desc>
