 700L593 480" fill="none" stroke="#E5F3F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="593" cy="480" r="5" fill="#E5F3F1"/><circle cx="593" cy="700" r="22" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="593" y="708" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1160" y="190" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SEÑALA CADA NÚMERO</text><circle cx="1180" cy="236" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="243.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="1216" y="244" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Primaria del comandante</tspan></text><circle cx="1180" cy="300" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="307.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="1216" y="308" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">Primaria del primer oficial</tspan></text><text x="1216" y="337" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">Estas dos tienen que coincidir</tspan><tspan x="1216" dy="27">dentro de 200 ft en crucero.</tspan></text><circle cx="1180" cy="403" r="20" fill="#1C5750" stroke="#FFFFFF" stroke-width="3"/><text x="1180" y="410.6" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1216" y="411" font-size="24" font-weight="700" fill="#231F1A"><tspan x="1216" dy="0">La de reserva</tspan></text><text x="1216" y="440" font-size="22" fill="#6F665B"><tspan x="1216" dy="0">La tercera opinión,</tspan><tspan x="1216" dy="27">independiente: contra ella se</tspan><tspan x="1216" dy="27">contrastan las primarias cada</tspan><tspan x="1216" dy="27">hora, y la diferencia se anota.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-05</text>
