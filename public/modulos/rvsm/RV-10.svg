<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">La toma estática, en el preflight</title>
<desc id="desc">Esquema del fuselaje delantero de un reactor, de costado, con la toma estática marcada por un círculo y la zona del revestimiento a su alrededor sombreada. Al lado, lo que se busca: superficie limpia y sin obstrucción; revestimiento sin abolladuras ni reparaciones que alteren el flujo; y sin cinta, sellante ni pintura sobre la toma o su entorno.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">La toma estática, en el preflight</text>
<text x="56" y="124" font-size="24" fill="#6F665B">En RVSM, lo que altera el flujo junto a la toma altera la altitud que se mide</text>
<path d="M80 540C80 430 190 360 360 346L940 340L940 700L360 700C200 700 80 640 80 540Z" fill="#EEEAE4" stroke="#A89F94" stroke-width="3"/><path d="M190 430L250 400L330 392L318 440L200 452Z" fill="#231F1A" opacity="0.85"/><path d="M340 390L400 386L396 436L330 440Z" fill="#231F1A" opacity="0.85"/><rect x="560" y="400" width="96" height="200" rx="18" fill="none" stroke="#A89F94" stroke-width="3"/><rect x="720" y="420" width="34" height="46" rx="14" fill="#FFFFFF" stroke="#A89F94" stroke-width="2"/><rect x="800" y="420" width="34" height="46" rx="14" fill="#FFFFFF" stroke="#A89F94" stroke-width="2"/><rect x="880" y="420" width="34" height="46" rx="14" fill="#FFFFFF" stroke="#A89F94" stroke-width="2"/><path d="M100 610C300 660 700 668 940 666" fill="none" stroke="#A89F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="440" cy="560" rx="120" ry="80" fill="#E5F3F1" stroke="#1C5750" stroke-width="3" stroke-dasharray="8 8"/><rect x="412" y="538" width="56" height="44" rx="8" fill="#FFFFFF" stroke="#231F1A" stroke-width="2.5"/><circle cx="428" cy="552" r="4.5" fill="#231F1A"/><circle cx="452" cy="552" r="4.5" fill="#231F1A"/><circle cx="428" cy="568" r="4.5" fill="#231F1A"/><circle cx="452" cy="568" r="4.5" fill="#231F1A"/><circle cx="440" cy="560" r="44" fill="none" stroke="#A86400" stroke-width="5"/><path d="M470 520L560 250" fill="none" stroke="#A86400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="236" font-size="24" font-weight="700" fill="#A86400">TOMA ESTÁTICA</text><text x="300" y="690" font-size="22" font-weight="700" fill="#1C5750">zona a su alrededor</text><text x="1000" y="250" font-size="20" font-weight="700" fill="#6F665B" letter-spacing="1.5">QUÉ SE BUSCA</text><rect x="1000" y="290" width="540" height="65" rx="12" fill="#E5F3F1"/><text x="1030" y="328" font-size="24" font-weight="700" fill="#1C5750"><tspan x="1030" dy="0">Superficie limpia y sin obstrucción.</tspan></text><rect x="1000" y="375" width="540" height="96" rx="12" fill="#E5F3F1"/><text x="1030" y="413" font-size="24" font-weight="700" fill="#1C5750"><tspan x="1030" dy="0">Revestimiento sin abolladuras ni</tspan><tspan x="1030" dy="31">reparaciones que alteren el flujo.</tspan></text><rect x="1000" y="491" width="540" height="96" rx="12" fill="#E5F3F1"/><text x="1030" y="529" font-size="24" font-weight="700" fill="#1C5750"><tspan x="1030" dy="0">Sin cinta, sellante ni pintura sobre la toma</tspan><tspan x="1030" dy="31">o su entorno.</tspan></text>
<text x="1560" y="876" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-10</text>
</svg>
