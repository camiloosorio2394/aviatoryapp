cing="0.5">3  EN CRUCERO</text><text x="830" y="872" font-size="22" fill="#231F1A"><tspan x="830" dy="0">Primarias dentro de 200 ft</tspan></text><rect x="1175" y="790" width="345" height="196" rx="14" fill="#CDE5E1"/><text x="1195" y="830" font-size="22" font-weight="700" fill="#1C5750" letter-spacing="0.5">4  CADA HORA</text><text x="1195" y="872" font-size="22" fill="#231F1A"><tspan x="1195" dy="0">Primarias contra la de reserva</tspan><tspan x="1195" dy="30">Anotar la diferencia</tspan></text>
