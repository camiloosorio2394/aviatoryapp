<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="titulo desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="titulo">Si se pierde RVSM en vuelo</title>
<desc id="desc">Diagrama de flujo de ocho bloques con tres llaves a la izquierda: aviar, navegar y comunicar. Falla de sistema RVSM; controlar la aeronave, mantener el nivel en lo posible, vigilar tráfico y encender luces; identificar la falla; QRH y SOP; y la decisión, conserva capacidad RVSM. Si sí, continuar vigilando la altitud. Si no, informar al ATC con unable RVSM due equipment, solicitar o aceptar una nueva autorización y avisar cuando ya no haga falta.</desc>
<defs><marker id="f-tinta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#231F1A"/></marker><marker id="f-acento" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1C5750"/></marker><marker id="f-acento2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4B9089"/></marker><marker id="f-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B0198F"/></marker><marker id="f-suave" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6F665B"/></marker><marker id="f-ambar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A86400"/></marker><marker id="f-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A89F94"/></marker><marker id="f-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2E7A4B"/></marker><marker id="f-rojo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B3372B"/></marker></defs>
<rect width="1600" height="1020" rx="24" fill="#FCFAF6"/>
<text x="56" y="84" font-size="44" font-weight="700" fill="#231F1A">Si se pierde RVSM en vuelo</text>
<text x="56" y="124" font-size="24" fill="#6F665B">Una estructura para ordenar la respuesta; lo que manda es el QRH y el SOP</text>
<rect x="500" y="160" width="620" height="64" rx="14" fill="#CDE5E1" stroke="#4B9089" stroke-width="3"/><text x="810" y="201" font-size="24" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="810" dy="0">FALLA DE SISTEMA RVSM</tspan></text><path d="M810 226L810 242" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="246" width="620" height="96" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="810" y="275" font-size="24" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="810" dy="0">CONTROLAR LA AERONAVE</tspan><tspan x="810" dy="28">Mantener el nivel en lo posible;</tspan><tspan x="810" dy="28">vigilar tráfico y encender luces</tspan></text><path d="M810 344L810 360" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="364" width="620" height="64" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="810" y="405" font-size="24" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="810" dy="0">IDENTIFICAR LA FALLA</tspan></text><path d="M810 430L810 446" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="450" width="620" height="64" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="810" y="491" font-size="24" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="810" dy="0">QRH Y SOP</tspan></text><path d="M810 516L810 532" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><path d="M810 536L1140 606L810 676L480 606Z" fill="#1C5750"/><text x="810" y="615" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">¿CONSERVA CAPACIDAD RVSM?</text><path d="M1140 606L1250 606" fill="none" stroke="#2E7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-verde)"/><text x="1180" y="592" font-size="24" font-weight="700" fill="#2E7A4B">SÍ</text><rect x="1260" y="556" width="284" height="100" rx="14" fill="#DDEFE3"/><text x="1402" y="600" font-size="22" font-weight="700" fill="#2E7A4B" text-anchor="middle"><tspan x="1402" dy="0">CONTINUAR</tspan><tspan x="1402" dy="30">Vigilar la altitud</tspan></text><path d="M810 678L810 706" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><text x="826" y="702" font-size="24" font-weight="700" fill="#1C5750">NO</text><rect x="500" y="710" width="620" height="80" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="810" y="745" font-size="24" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="810" dy="0">INFORMAR AL ATC</tspan><tspan x="810" dy="28">«unable RVSM due equipment»</tspan></text><path d="M810 792L810 808" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="812" width="620" height="64" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="810" y="853" font-size="24" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="810" dy="0">SOLICITAR O ACEPTAR NUEVA AUTORIZACIÓN</tspan></text><path d="M810 878L810 894" fill="none" stroke="#4B9089" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f-acento2)"/><rect x="500" y="898" width="620" height="64" rx="14" fill="#FFFFFF" stroke="#4B9089" stroke-width="3"/><text x="810" y="939" font-size="24" font-weight="700" fill="#1C5750" text-anchor="middle"><tspan x="810" dy="0">AVISAR CUANDO YA NO HAGA FALTA</tspan></text><path d="M460 160Q440 160 440 180L440 235Q440 251 424 251Q440 251 440 267L440 322Q440 342 460 342" fill="none" stroke="#1C5750" stroke-width="3.5"/><text x="410" y="261" font-size="28" font-weight="700" fill="#1C5750" text-anchor="end" letter-spacing="2">AVIAR</text><path d="M460 364Q440 364 440 384L440 423Q440 439 424 439Q440 439 440 455L440 494Q440 514 460 514" fill="none" stroke="#1C5750" stroke-width="3.5"/><text x="410" y="449" font-size="28" font-weight="700" fill="#1C5750" text-anchor="end" letter-spacing="2">NAVEGAR</text><path d="M460 536Q440 536 440 556L440 733Q440 749 424 749Q440 749 440 765L440 942Q440 962 460 962" fill="none" stroke="#1C5750" stroke-width="3.5"/><text x="410" y="759" font-size="28" font-weight="700" fill="#1C5750" text-anchor="end" letter-spacing="2">COMUNICAR</text>
<text x="1560" y="996" font-size="20" font-weight="700" fill="#A89F94" text-anchor="end" letter-spacing="1">RV-17</text>
</svg>
