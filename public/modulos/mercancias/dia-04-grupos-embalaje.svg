<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Clase, grupo de embalaje y régimen de cantidad</title>
  <desc id="desc">Tres columnas independientes que muestran qué pregunta responde cada concepto de las mercancías peligrosas.</desc>
  <style>
    .paper{fill:#fbfaf8}.card{fill:#fff;stroke:#d8d4cc;stroke-width:2}.accent{fill:#7a5c12}.soft{fill:#f3ead2}.pale{fill:#faf6eb}.ink{fill:#16191d}.muted{fill:#5f646b}.rule{stroke:#d8d4cc;stroke-width:2}.strong{stroke:#7a5c12;stroke-width:4}.label{font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.6px}.heading{font:700 36px Arial,Helvetica,sans-serif}.body{font:21px Arial,Helvetica,sans-serif}.small{font:18px Arial,Helvetica,sans-serif}.num{font:700 29px Arial,Helvetica,sans-serif}
  </style>
  <rect class="paper" width="1600" height="900"/>
  <rect x="80" y="64" width="8" height="72" class="accent"/>
  <text x="112" y="94" class="label accent">MERCANCÍAS PELIGROSAS</text>
  <text x="112" y="140" class="heading ink">Tres conceptos distintos</text>
  <text x="112" y="178" class="body muted">No son peldaños de una misma escala: cada columna responde una pregunta diferente.</text>
  <line x1="80" y1="224" x2="1520" y2="224" class="rule"/>

  <g transform="translate(80 280)">
    <rect width="420" height="470" rx="12" class="card"/><rect width="420" height="8" rx="4" class="accent"/>
    <text x="32" y="56" class="label accent">01 · CLASE</text><text x="32" y="102" class="heading ink">¿Qué riesgo?</text><text x="32" y="138" class="small muted">La familia del peligro.</text>
    <g transform="translate(32 176)" fill="#f3ead2" stroke="#7a5c12" stroke-width="2">
      <rect width="106" height="68" rx="8"/><rect x="126" width="106" height="68" rx="8"/><rect x="252" width="106" height="68" rx="8"/>
      <rect y="88" width="106" height="68" rx="8"/><rect x="126" y="88" width="106" height="68" rx="8"/><rect x="252" y="88" width="106" height="68" rx="8"/>
      <rect x="63" y="176" width="106" height="68" rx="8"/><rect x="189" y="176" width="106" height="68" rx="8"/><rect x="315" y="176" width="43" height="68" rx="8"/>
    </g>
    <g class="num ink" text-anchor="middle"><text x="85" y="221">1</text><text x="211" y="221">2</text><text x="337" y="221">3</text><text x="85" y="309">4</text><text x="211" y="309">5</text><text x="337" y="309">6</text><text x="148" y="397">7</text><text x="274" y="397">8</text><text x="368" y="397">9</text></g>
    <text x="32" y="438" class="body ink">Inflamable, tóxico, corrosivo…</text>
  </g>

  <g transform="translate(590 280)">
    <rect width="420" height="470" rx="12" class="card"/><rect width="420" height="8" rx="4" class="accent"/>
    <text x="32" y="56" class="label accent">02 · GRUPO</text><text x="32" y="102" class="heading ink">¿Qué grado?</text><text x="32" y="138" class="small muted">Solo cuando la clasificación lo asigna.</text>
    <g transform="translate(32 176)">
      <rect width="356" height="68" rx="8" class="soft"/><text x="28" y="44" class="num accent">I</text><text x="88" y="43" class="body ink">Mayor riesgo</text>
      <rect y="86" width="356" height="68" rx="8" class="pale"/><text x="28" y="130" class="num accent">II</text><text x="88" y="129" class="body ink">Riesgo intermedio</text>
      <rect y="172" width="356" height="68" rx="8" fill="#fdfbf6"/><text x="28" y="216" class="num accent">III</text><text x="88" y="215" class="body ink">Menor riesgo</text>
    </g>
    <text x="32" y="438" class="body ink">Afecta el embalaje exigido.</text>
  </g>

  <g transform="translate(1100 280)">
    <rect width="420" height="470" rx="12" class="card"/><rect width="420" height="8" rx="4" class="accent"/>
    <text x="32" y="56" class="label accent">03 · CANTIDAD</text><text x="32" y="102" class="heading ink">¿Qué condición?</text><text x="32" y="138" class="small muted">Cuando se transporta una cantidad pequeña.</text>
    <g transform="translate(32 176)">
      <rect width="356" height="86" rx="8" class="soft"/><text x="26" y="38" class="body ink">Cantidad limitada</text><text x="26" y="65" class="small muted">Régimen y marca propios.</text>
      <rect y="108" width="356" height="86" rx="8" class="pale"/><text x="26" y="146" class="body ink">Cantidad exceptuada</text><text x="26" y="173" class="small muted">Exención según la lista aplicable.</text>
    </g>
    <text x="32" y="438" class="body ink">No cambia la clase ni el grupo.</text>
  </g>

  <text x="800" y="850" text-anchor="middle" class="label accent">LEE CADA COLUMNA POR SEPARADO</text>
</svg>
