<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Por qué se segregan bultos incompatibles</title>
  <desc id="desc">Comparación conceptual: dos bultos juntos podrían permitir que una fuga entre en contacto con otra mercancía; con estiba separada se evita ese contacto. No se representan clases, distancias ni posiciones reglamentarias.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#f7f4ed"/>
      <stop offset="1" stop-color="#e7eef1"/>
    </linearGradient>
    <pattern id="floor" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 0 35 H 36" stroke="#d2dce1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#paper)"/>
  <text x="75" y="108" fill="#132c40" font-family="Arial, sans-serif" font-size="54" font-weight="700">SEGREGACIÓN: EVITAR EL CONTACTO</text>
  <text x="75" y="158" fill="#526b79" font-family="Arial, sans-serif" font-size="28">Lo que importa es qué podría pasar si un bulto pierde su contenido.</text>
  <rect x="75" y="225" width="694" height="516" rx="32" fill="#fff" stroke="#e4c6b6" stroke-width="3"/>
  <rect x="831" y="225" width="694" height="516" rx="32" fill="#fff" stroke="#c5dcd2" stroke-width="3"/>
  <rect x="106" y="591" width="632" height="90" fill="url(#floor)"/>
  <rect x="862" y="591" width="632" height="90" fill="url(#floor)"/>
  <g font-family="Arial, sans-serif" font-weight="700">
    <text x="112" y="293" fill="#b75b38" font-size="33">CONTACTO POSIBLE</text>
    <text x="868" y="293" fill="#21836c" font-size="33">CONTACTO EVITADO</text>
  </g>
  <g fill="#c89a6f" stroke="#875e3c" stroke-width="4">
    <rect x="169" y="410" width="180" height="180" rx="12"/>
    <rect x="430" y="410" width="180" height="180" rx="12"/>
    <rect x="920" y="410" width="180" height="180" rx="12"/>
    <rect x="1300" y="410" width="180" height="180" rx="12"/>
  </g>
  <g fill="#a8754e">
    <path d="M 259 411 V 590" stroke="#a8754e" stroke-width="8"/>
    <path d="M 520 411 V 590" stroke="#a8754e" stroke-width="8"/>
    <path d="M 1010 411 V 590" stroke="#a8754e" stroke-width="8"/>
    <path d="M 1390 411 V 590" stroke="#a8754e" stroke-width="8"/>
  </g>
  <path d="M 357 552 C 377 563 402 571 428 559" fill="none" stroke="#dd704b" stroke-width="15" stroke-linecap="round"/>
  <path d="M 1107 552 C 1145 570 1180 570 1211 559" fill="none" stroke="#dd704b" stroke-width="15" stroke-linecap="round"/>
  <path d="M 1200 345 V 657" stroke="#24856d" stroke-width="13" stroke-linecap="round" stroke-dasharray="18 15"/>
  <g font-family="Arial, sans-serif" font-size="29" fill="#253d4b">
    <text x="112" y="350">Una pérdida alcanza el otro bulto.</text>
    <text x="868" y="350">La estiba impide esa interacción.</text>
  </g>
  <text x="76" y="809" fill="#435f6e" font-family="Arial, sans-serif" font-size="26">Esquema conceptual. La separación real depende de la mercancía y de las reglas aplicables; no representa distancias fijas.</text>
</svg>
