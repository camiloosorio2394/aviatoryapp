<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Isotipo circular de Aviatory: la A blanca con dos estelas y el avion
    despegando, sobre circulo con gradiente azul. Version para icono de app,
    favicon, avatar y todo espacio cuadrado. Redibujado como vector a partir
    del arte de marca (jul 2026). El gradiente va del azul claro (arriba a la
    derecha, donde despega el avion) al azul profundo.
  -->
  <defs>
    <linearGradient id="bg" x1="820" y1="180" x2="240" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E96E3"/>
      <stop offset="1" stop-color="#1F4B9E"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="512" fill="url(#bg)"/>
  <path fill-rule="evenodd" clip-rule="evenodd" fill="#FFFFFF"
    d="M470 210 L560 210 L724 806 L628 806 L515 386 L404 806 L308 806 Z"
    transform="translate(-60 40)"/>
  <polygon fill="#FFFFFF" points="160,838 700,332 736,356"/>
  <polygon fill="#FFFFFF" points="238,894 738,388 766,414"/>
  <g fill="#FFFFFF" transform="translate(772,300) rotate(-42)">
    <polygon points="0,0 150,-16 178,0 150,16"/>
    <polygon points="52,-8 20,-78 52,-64 86,-12"/>
    <polygon points="52,8 20,78 52,64 86,12"/>
    <polygon points="132,-10 118,-46 138,-40 152,-12"/>
    <polygon points="132,10 118,46 138,40 152,12"/>
  </g>
</svg>
