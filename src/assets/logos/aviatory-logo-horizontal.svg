<svg width="1440" height="420" viewBox="0 0 1440 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent canvas (no bg rect — lets it sit on any surface) -->

  <!-- Isotype, scaled to 300x300, sitting at left -->
  <g transform="translate(60 60)">
    <!-- Squircle bg with refined gradient -->
    <rect width="300" height="300" rx="66" fill="url(#g1)"/>

    <!-- Glassy top sheen -->
    <rect width="300" height="300" rx="66" fill="url(#sheen)"/>

    <!-- Cyan glow -->
    <ellipse cx="150" cy="228" rx="94" ry="14" fill="url(#glow)"/>

    <!-- Wing glyph (scaled 1024→300, ratio 0.293) -->
    <path d="M 150 52 C 150 52 89 178 69 222 C 67 228 73 232 79 230 L 129 218 C 135 217 139 220 138 226 L 132 264 C 132 269 138 272 142 268 L 235 65 C 239 56 234 51 228 56 L 156 59 Z" fill="white"/>

    <!-- Right wing inner shadow -->
    <path d="M 150 52 L 212 50 C 220 41 234 46 230 60 L 176 198 C 174 202 170 201 170 197 L 150 52 Z" fill="#0F172A" fill-opacity="0.10"/>

    <!-- Rim -->
    <rect x="0.5" y="0.5" width="299" height="299" rx="65.5" fill="none" stroke="white" stroke-opacity="0.10" stroke-width="1"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(420 130)">
    <text x="0" y="88" font-family="'Plus Jakarta Sans', 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" font-size="100" font-weight="800" letter-spacing="-5" fill="#0B1426">Aviatory</text>
    <text x="3" y="148" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="22" font-weight="600" letter-spacing="3.6" fill="#475569">DE ESTUDIANTE PILOTO A CANDIDATO DE AEROLÍNEA</text>
  </g>

  <defs>
    <linearGradient id="g1" x1="150" y1="0" x2="150" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.42" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="150" y1="0" x2="150" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.32"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="150" cy="228" r="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
