<script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"specificContentPage":[{"attributes":{"updatedAt":"2026-08-24T19:46:40.304Z","contenidoBasico":[{"contenidoHtml":"<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap\" rel=\"stylesheet\">\n\n<div style=\"font-family: 'Inter', sans-serif; color: #2D2E2F; background-color: #f9fafb; padding: 30px 15px; border-radius: 20px; position: relative; z-index: 1; max-width: 1200px; margin: 20px auto 60px auto; box-sizing: border-box; border: 1px solid #E1E8EC;\">\n\n  <div style=\"text-align: center; margin-bottom: 40px; padding: 0 10px;\">\n    <span style=\"background-color: #e0d6f5; color: #6633cb; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 15px;\">Únete al equipo con más buena onda</span>\n    <h1 style=\"color: #463091; font-size: 2.4rem; font-weight: 900; margin: 0 0 15px 0; line-height: 1.2;\">¿Listo para tu próximo gran vuelo profesional?</h1>\n    <p style=\"color: #5f686c; font-size: 1.05rem; line-height: 1.6; max-width: 850px; margin: 0 auto;\">\n      Somos una de las aerolíneas con mayor proyección de la región y queremos contar con personas que quieran volar alto y que compartan con nosotros la visión de hacer felices a nuestros pasajeros en todos sus vuelos. Conoce aquí sobre nuestras vacantes:\n    </p>\n  </div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 40px;\">\n\n    <!-- Tarjeta Tripulantes de Cabina -->\n    <div style=\"background-color: #ffffff; border: 1px solid #E1E8EC; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.02); display: flex; flex-direction: column;\">\n      \n      <div style=\"background-color: #463091; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <h2 style=\"color: #ffffff; font-size: 1.45rem; font-weight: 800; margin: 0;\">Tripulante de Cabina de Pasajeros</h2>\n        </div>\n        <span style=\"background-color: #ffb800; color: #2D2E2F; font-size: 0.78rem; font-weight: 800; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;\">Tu Próximo Vuelo</span>\n      </div>\n\n      <div style=\"padding: 30px 20px; box-sizing: border-box;\">\n        <div style=\"background-color: #fffbeb; border-left: 4px solid #ffb800; color: #5f686c; padding: 15px 20px; border-radius: 0 8px 8px 0; font-size: 0.9rem; line-height: 1.5; margin-bottom: 30px; font-weight: 600;\">\n          Actualmente, no tenemos vacantes disponibles. Sin embargo, si te apasiona el servicio y te caracteriza la buena onda, envíanos tu CV y lo tendremos en cuenta para futuros procesos.\n        </div>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-bottom: 30px;\">\n          \n          <div>\n            <h3 style=\"color: #463091; font-size: 1.2rem; font-weight: 700; margin: 0 0 15px 0; border-bottom: 2px solid #e0d6f5; padding-bottom: 8px;\">Funciones del Cargo</h3>\n            <ul style=\"list-style-type: disc !important; padding-left: 20px; margin: 0 0 25px 0; color: #5f686c; font-size: 0.88rem; line-height: 1.6; display: block !important;\">\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 12px;\">Cumplir con los estándares de operación, bajo los lineamientos establecidos por las áreas de entrenamiento, estándares y servicio para Tripulantes en tu desempeño dentro del plan de carrera, identificando cualidades y aptitudes que te permitan el equilibrio en habilidades técnicas y no técnicas.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 12px;\">Velar por la seguridad a bordo de nuestras aeronaves, mediante el cumplimiento de procesos y procedimientos administrativos y operativos.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 12px;\">Promover la buena onda y la actitud de servicio y eficiencia a bordo de los aviones con el fin de ofrecer una experiencia #ModoWingo a todos nuestros viajeros.</li>\n            </ul>\n\n            <h3 style=\"color: #463091; font-size: 1.2rem; font-weight: 700; margin: 0 0 15px 0; border-bottom: 2px solid #e0d6f5; padding-bottom: 8px;\">Formación Requerida</h3>\n            <ul style=\"list-style-type: disc !important; padding-left: 20px; margin: 0; color: #5f686c; font-size: 0.88rem; line-height: 1.6; display: block !important;\">\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Carreras técnicas, tecnológicas y/o profesionales en curso. Mínimo 3 años de estudios diferentes a Auxiliar de vuelo.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important;\">Manejo proficiente de inglés.</li>\n            </ul>\n          </div>\n\n          <div>\n            <h3 style=\"color: #463091; font-size: 1.2rem; font-weight: 700; margin: 0 0 15px 0; border-bottom: 2px solid #e0d6f5; padding-bottom: 8px;\">Requisitos Indispensables</h3>\n            <ul style=\"list-style-type: disc !important; padding-left: 20px; margin: 0; color: #5f686c; font-size: 0.88rem; line-height: 1.6; display: block !important;\">\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px; font-weight: 700; color: #463091;\">Mínimo 1 año de experiencia en servicio al cliente, de los cuales 6 meses deben ser en ventas.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Hoja de vida con foto y correo electrónico (para recibir las notificaciones/ resultados del proceso).</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Fotocopia Licencia TCP.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Fotocopia de certificado médico.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Si eres extranjero (a), debes contar con el correspondiente permiso de trabajo.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Pasaporte vigente.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Disponibilidad para vivir en otras ciudades.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Excelente presentación personal.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important;\">Buena onda y toda la disposición para ser parte de este gran equipo de trabajo.</li>\n            </ul>\n          </div>\n\n        </div>\n\n        <div style=\"background-color: #e0d6f5; border: 1px solid #c8b7eb; border-radius: 16px; padding: 25px 20px; text-align: center; box-sizing: border-box;\">\n          <h4 style=\"color: #463091; font-size: 1.15rem; font-weight: 800; margin: 0 0 10px 0;\">¡Te contactaremos tan pronto encontremos una vacante acorde a tu perfil!</h4>\n          <p style=\"color: #463091; font-size: 0.9rem; margin: 0 0 20px 0; line-height: 1.5;\">Si cumples con todos los requisitos y quieres darle alas a tu carrera como Tripulante de cabina de pasajeros, envíanos tu hoja de vida por correo electrónico:</p>\n          <a href=\"mailto:seleccion@wingo.com?subject=Postulaci%C3%B3n%20TCP%20-%20Wingo\" style=\"display: inline-block; background-color: #6633cb; color: #ffffff; text-decoration: none; font-weight: 700; padding: 12px 30px; border-radius: 8px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(102, 51, 203, 0.25);\">Enviar a seleccion@wingo.com</a>\n        </div>\n\n      </div>\n    </div>\n\n    <!-- Tarjeta Pilotos -->\n    <div style=\"background-color: #ffffff; border: 1px solid #E1E8EC; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.02); display: flex; flex-direction: column;\">\n      \n      <div style=\"background-color: #463091; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <h2 style=\"color: #ffffff; font-size: 1.45rem; font-weight: 800; margin: 0;\">Pilotos</h2>\n        </div>\n        <span style=\"background-color: #ffb800; color: #2D2E2F; font-size: 0.78rem; font-weight: 800; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;\">Tu Próximo Vuelo</span>\n      </div>\n\n      <div style=\"padding: 30px 20px; box-sizing: border-box;\">\n        <div style=\"background-color: #fffbeb; border-left: 4px solid #ffb800; color: #5f686c; padding: 15px 20px; border-radius: 0 8px 8px 0; font-size: 0.9rem; line-height: 1.5; margin-bottom: 30px; font-weight: 600;\">\n          Actualmente, no tenemos vacantes disponibles. Sin embargo, si lo tuyo es volar de manera segura, íntegra, eficiente y con buena onda, envíanos tu CV y lo tendremos en cuenta para futuros procesos.\n        </div>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-bottom: 30px;\">\n          \n          <div>\n            <h3 style=\"color: #463091; font-size: 1.2rem; font-weight: 700; margin: 0 0 15px 0; border-bottom: 2px solid #e0d6f5; padding-bottom: 8px;\">Funciones del Cargo</h3>\n            <ul style=\"list-style-type: disc !important; padding-left: 20px; margin: 0 0 25px 0; color: #5f686c; font-size: 0.88rem; line-height: 1.6; display: block !important;\">\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 12px;\">Comandar de manera segura, íntegra y eficiente nuestras aeronaves en todas las rutas nacionales e internacionales de Wingo.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 12px;\">Liderar con empatía, profesionalismo y buena onda a toda la tripulación técnica y de cabina a bordo.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 12px;\">Asegurar los más altos estándares operativos de la aerolínea manteniendo un vuelo agradable para todos los viajeros.</li>\n            </ul>\n\n            <h3 style=\"color: #463091; font-size: 1.2rem; font-weight: 700; margin: 0 0 15px 0; border-bottom: 2px solid #e0d6f5; padding-bottom: 8px;\">Formación Requerida</h3>\n            <ul style=\"list-style-type: disc !important; padding-left: 20px; margin: 0; color: #5f686c; font-size: 0.88rem; line-height: 1.6; display: block !important;\">\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 10px;\">Copia del certificado de la escuela de procedencia donde obtuvo su título de Piloto comercial.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important;\">Preferiblemente formación universitaria (adjuntar fotocopia del diploma o certificado de los semestres realizados).</li>\n            </ul>\n          </div>\n\n          <div>\n            <h3 style=\"color: #463091; font-size: 1.2rem; font-weight: 700; margin: 0 0 15px 0; border-bottom: 2px solid #e0d6f5; padding-bottom: 8px;\">Requisitos Indispensables</h3>\n            <ul style=\"list-style-type: disc !important; padding-left: 20px; margin: 0; color: #5f686c; font-size: 0.88rem; line-height: 1.6; display: block !important;\">\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Debes ser mayor de 21 años.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Hoja de vida digital con foto.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Copia de la cédula y copia de libreta militar.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Copia de la licencia PCA o PTL monomotor, multi-motor e instrumentos con la adición de inglés mínimo nivel 4 vigente.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Copia del certificado médico vigente.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Copia del Examen TEA o EALTS mínimo nivel 4.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Copia certificado de fiebre amarilla.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Copia de la visa americana vigente y copia del Pasaporte vigente.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important; margin-bottom: 8px;\">Copia del certificado de notas de donde se graduó de piloto.</li>\n              <li style=\"display: list-item !important; list-style-type: disc !important;\">Copia de la última hoja de la bitácora de vuelo.</li>\n            </ul>\n          </div>\n\n        </div>\n\n        <div style=\"background-color: #e0d6f5; border: 1px solid #c8b7eb; border-radius: 16px; padding: 25px 20px; text-align: center; box-sizing: border-box;\">\n          <h4 style=\"color: #463091; font-size: 1.15rem; font-weight: 800; margin: 0 0 10px 0;\">¡Te contactaremos tan pronto encontremos una vacante acorde a tu perfil!</h4>\n          <p style=\"color: #463091; font-size: 0.95rem; margin: 0 0 15px 0; line-height: 1.5;\">Si cumples con todos los requisitos y quieres llevar a miles de viajeros a disfrutar de destinos increíbles de este lado del mundo, envíanos tu hoja de vida:</p>\n          \n          <div style=\"background-color: #ffffff; border: 1px dashed #6633cb; padding: 12px; border-radius: 8px; color: #2D2E2F; font-size: 0.85rem; font-weight: 700; max-width: 700px; margin: 0 auto 25px auto;\">\n            Asegúrate de que la hoja de vida esté completa en un solo documento en PDF, el correo NO debe contener varios documentos adjuntos.\n          </div>\n\n          <a href=\"mailto:seleccion@wingo.com?subject=Postulaci%C3%B3n%20Piloto%20-%20Wingo\" style=\"display: inline-block; background-color: #6633cb; color: #ffffff; text-decoration: none; font-weight: 700; padding: 12px 30px; border-radius: 8px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(102, 51, 203, 0.25);\">Enviar a seleccion@wingo.com</a>\n        </div>\n\n      </div>\n    </div>\n\n  </div>\n\n</div>"}]}}]}}}</script></body></html>
