<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Piezas sueltas y cuatro montajes</title>
  <desc id="descripcion">Redibujo del ejercicio 6 del cuadernillo E1. El modelo muestra un paralelogramo estrecho, un rectángulo corto y una pieza de barra horizontal con dos patas.</desc>
