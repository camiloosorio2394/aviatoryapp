<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Silueta de encaje y cuatro alternativas</title>
  <desc id="descripcion">Redibujo del ejercicio 2 del cuadernillo E1. La alternativa C conserva el mismo contorno, el remate redondo y los dos huecos del modelo.</desc>
  <defs>
    <style>
      .panel { fill: #fafbfc; stroke: #d8dee5; stroke-width: 2; }
      .rotulo { fill: #202631; font: 700 25px Arial, sans-serif; }
      .guia { fill: #637182; font: 600 18px Arial, sans-serif; letter-spacing: 1px; }
      .linea { fill: none; stroke: #202631; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .hueco { fill: none; stroke: #202631; stroke-width: 14; stroke-linejoin: round; }
    </style>
    <g id="silueta-correcta">
      <path class="hueco" d="M30 78 55 64 80 78 80 108 55 122 30 108Z"/>
      <path class="linea" d="M80 78 C106 48 136 70 136 100 L136 112 Q136 127 154 127 L185 127 Q196 127 211 115"/>
      <path class="hueco" d="M185 81H242V145H185Z"/>
    </g>
  </defs>

  <rect width="1100" height="790" fill="#fff"/>
  <text class="guia" x="36" y="45">HUECO DE REFERENCIA</text>
  <rect x="390" y="65" width="320" height="126" rx="10" fill="#55585e"/>
  <g transform="translate(407 20)" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 78 55 64 80 78 80 108 55 122 30 108Z"/>
    <path d="M80 78 C106 48 136 70 136 100 L136 112 Q136 127 154 127 L185 127 Q196 127 211 115"/>
    <path d="M185 81H242V145H185Z"/>
  </g>

  <rect class="panel" x="30" y="215" width="510" height="262" rx="16"/>
  <rect class="panel" x="560" y="215" width="510" height="262" rx="16"/>
  <rect class="panel" x="30" y="493" width="510" height="262" rx="16"/>
  <rect class="panel" x="560" y="493" width="510" height="262" rx="16"/>

  <text class="rotulo" x="62" y="254">A</text>
  <g transform="translate(151 265) scale(1.16)">
    <path class="hueco" d="M30 78 55 64 80 78 80 108 55 122 30 108Z"/>
    <path class="linea" d="M80 78 C106 48 136 70 136 100 L136 112 Q136 127 154 127 L185 127 215 112"/>
    <path class="hueco" d="M185 81H242V145H185Z"/>
    <path d="M215 112 216 127 198 121Z" fill="#202631"/>
  </g>

  <text class="rotulo" x="592" y="254">B</text>
  <g transform="translate(681 265) scale(1.16)">
    <path d="M30 78 55 64 80 78 80 108 55 122 30 108Z" fill="#202631"/>
    <path class="linea" d="M80 78 C106 48 136 70 136 100 L136 112 Q136 127 154 127 L185 127"/>
    <path d="M185 81H242V145H185Z" fill="#202631"/>
  </g>

  <text class="rotulo" x="62" y="532">C</text>
  <g transform="translate(151 543) scale(1.16)"><use href="#silueta-correcta"/></g>

  <text class="rotulo" x="592" y="532">D</text>
  <g transform="translate(681 543) scale(1.16)">
    <path class="hueco" d="M30 78 51 64 81 66 94 94 80 122 48 119 30 100Z"/>
    <path class="linea" d="M80 78 C106 48 136 70 136 100 L136 112 Q136 127 154 127 L185 127 Q196 127 211 115"/>
    <path class="hueco" d="M185 81H242V145H185Z"/>
  </g>
